---
name: Fix package lock version

on:
  push:
    branches:
      - refactor/consolidate-truenas-access

permissions:
  contents: write

jobs:
  fix-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/consolidate-truenas-access
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Regenerate npm lock metadata
        run: npm version 1.5.0 --no-git-tag-version --allow-same-version
      - name: Verify repository versions
        run: uv run python scripts/check_versions.py
      - name: Commit corrected lock and remove temporary workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/fix-package-lock-version.yml
          git add package-lock.json package.json
          git diff --cached --quiet && exit 0
          git commit -m "fix(ci): restore 1.5.0 package lock metadata"
          git push origin HEAD:refactor/consolidate-truenas-access
