name: Fix TrueNAS health test harness

on:
  push:
    branches:
      - feat/truenas-health-board

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/truenas-health-board
          fetch-depth: 0

      - name: Add canonical CI env and idempotence guard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/implement-truenas-negative-auth-test.yml')
          text = workflow.read_text()

          env_block = '''    env:\n      KEYCLOAK_SERVER_URL: http://localhost:8080\n      KEYCLOAK_REALM: test\n      KEYCLOAK_CLIENT_ID: test\n      KEYCLOAK_CLIENT_SECRET: test-secret\n      OAUTH_TOKEN_SECRET: mocked-oauth-token-secret\n      METRICS_ENABLED: "false"\n      LOGFIRE_ENABLED: "false"\n      LOGFIRE_ENVIRONMENT: test\n      LOGFIRE_TOKEN: ""\n      SENTRY_ENABLED: "false"\n      SENTRY_DSN: ""\n      SENTRY_ENVIRONMENT: test\n      DATADOG_ENABLED: "false"\n      DD_TRACE_ENABLED: "false"\n      DD_PROFILING_ENABLED: "false"\n      DD_LOGS_INJECTION: "false"\n      DD_APPSEC_ENABLED: "false"\n      DD_IAST_ENABLED: "false"\n      UNLEASH_ENABLED: "false"\n      STATSIG_ENABLED: "false"\n'''
          needle = '    runs-on: ubuntu-latest\n    steps:\n'
          if '      OAUTH_TOKEN_SECRET: mocked-oauth-token-secret\n' not in text:
              if needle not in text:
                  raise SystemExit('workflow job insertion point not found')
              text = text.replace(needle, '    runs-on: ubuntu-latest\n' + env_block + '    steps:\n', 1)

          guard_needle = '''      - name: Patch TrueNAS health contract and UI\n        shell: bash\n        run: |\n'''
          guard = '''      - name: Patch TrueNAS health contract and UI\n        shell: bash\n        run: |\n          if grep -q 'def _truenas_api_configuration_failure' nabla/api/homelab_health.py; then\n            echo 'TrueNAS health implementation is already applied.'\n            exit 0\n          fi\n'''
          if "TrueNAS health implementation is already applied." not in text:
              if guard_needle not in text:
                  raise SystemExit('workflow patch-step insertion point not found')
              text = text.replace(guard_needle, guard, 1)

          workflow.write_text(text)
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/implement-truenas-negative-auth-test.yml
          git rm .github/workflows/fix-truenas-health-harness.yml
          git commit -m 'chore(ci): repair TrueNAS health test harness'
          git push origin HEAD:feat/truenas-health-board
