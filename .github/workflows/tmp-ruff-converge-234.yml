name: Temporary Ruff convergence PR 234

on:
  push:
    branches:
      - fix/homelab-deadline-cloudflare-unknown

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Apply repository Ruff formatting
        run: |
          python -m pip install --disable-pip-version-check --quiet ruff==0.16.3
          ruff format nabla/api/homelab_exposure.py nabla/api/platform_health.py tests/unit/test_cloudflare_uncertainty.py
      - name: Remove temporary workflow
        run: git rm .github/workflows/tmp-ruff-converge-234.yml
      - name: Commit canonical formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style(health): apply canonical Ruff formatting"
          git push
