name: Repair runtime import

on:
  push:
    branches:
      - feat/mcp-streamable-http-outbound
    paths:
      - .github/workflows/fix-runtime-import.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feat/mcp-streamable-http-outbound
          fetch-depth: 2
          persist-credentials: true
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          python-version: "3.12"
      - name: Restore and patch config settings
        shell: bash
        run: |
          git checkout HEAD~1 -- nabla/config_settings.py
          python - <<'PY'
          from pathlib import Path

          path = Path('nabla/config_settings.py')
          text = path.read_text()
          marker = '''def _env_bool(name: str, default: bool) -> bool:\n    raw = os.environ.get(name)\n    if raw is None:\n        return default\n    return raw.lower() in ("true", "1", "yes")\n'''
          replacement = marker + '''\n\ndef _configured_feature_flag_key(value: str) -> bool:\n    """Return true only for a non-empty, non-placeholder feature-flag credential."""\n    normalized = value.strip().upper()\n    return bool(normalized) and normalized not in {"XXX", "CHANGEME", "PLACEHOLDER"}\n'''
          if marker not in text:
              raise SystemExit('env bool marker not found')
          text = text.replace(marker, replacement, 1)

          start = text.index('_unleash_refresh_s =')
          new_tail = '''_unleash_refresh_s = int(os.environ.get("UNLEASH_REFRESH_INTERVAL", "60"))\n_unleash_metrics_s = int(os.environ.get("UNLEASH_METRICS_INTERVAL", "90"))\n_unleash_timeout_s = int(os.environ.get("UNLEASH_REQUEST_TIMEOUT", "45"))\n_unleash_retries = int(os.environ.get("UNLEASH_REQUEST_RETRIES", "4"))\n\n_unleash_enabled = _env_bool(\n    "UNLEASH_ENABLED",\n    _configured_feature_flag_key(UNLEASH_INSTANCE_ID),\n)\nclient: UnleashClient | None = None\nif _unleash_enabled:\n    client = UnleashClient(\n        url=UNLEASH_API_URL.rstrip("/"),\n        app_name=UNLEASH_APP_NAME,\n        instance_id=UNLEASH_INSTANCE_ID,\n        refresh_interval=_unleash_refresh_s,\n        metrics_interval=_unleash_metrics_s,\n        request_timeout=_unleash_timeout_s,\n        request_retries=_unleash_retries,\n        custom_options=_unleash_requests_kwargs(),\n        disable_metrics=_env_bool("UNLEASH_DISABLE_METRICS", False),\n    )\n    client.initialize_client()\n\n_statsig_enabled = _env_bool(\n    "STATSIG_ENABLED",\n    _configured_feature_flag_key(STATSIG_API_KEY),\n)\nstatsig: Statsig | None = None\nif _statsig_enabled:\n    options = StatsigOptions()\n    options.environment = os.environ.get("STATSIG_ENVIRONMENT", "development")\n    statsig = Statsig(STATSIG_API_KEY, options)\n    statsig.initialize().wait()\n'''
          text = text[:start] + new_tail
          path.write_text(text)
          PY
      - name: Add direct runtime logger dependency
        run: uv add 'structlog>=25.4.0'
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nabla/config_settings.py pyproject.toml uv.lock
          git commit -m 'fix(runtime): isolate feature flags and add structlog'
          git push origin HEAD:feat/mcp-streamable-http-outbound
