name: Temporary deterministic autofix

on:
  push:

permissions:
  contents: write

jobs:
  autofix:
    if: contains(github.event.head_commit.message, '[agent-autofix]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          # The job pushes the autofix commit with the checkout token; no
          # artifact is uploaded, so persisted credentials cannot leak.
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: false
          python-version: "3.13"

      - name: Install minimal prek runtime
        shell: bash
        run: |
          uv venv --python 3.13
          uv pip install --python .venv/bin/python prek==0.5.10

      - name: Converge deterministic hooks
        shell: bash
        env:
          UV_NO_SYNC: "1"
          SKIP: "pytest-collect"
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR origin/master...HEAD)
          if ((${#files[@]} == 0)); then
            exit 0
          fi
          for pass in 1 2 3; do
            set +e
            uv run prek run --hook-stage pre-commit --files "${files[@]}" --show-diff-on-failure
            rc=$?
            set -e
            if ((rc == 0)); then
              echo "deterministic hooks converged in ${pass} pass(es)"
              break
            fi
            if ((pass == 3)); then
              exit "${rc}"
            fi
          done

      - name: Commit deterministic rewrites
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No deterministic rewrite required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: apply deterministic quality autofix"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  lockfix:
    if: github.ref_name == 'fix/health-state-coherence-20261116' && contains(github.event.head_commit.message, '[agent-lockfix]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Regenerate npm lockfile and validate only known bundled residuals
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          const violations = [];
          const residuals = [];
          const npmIsDevOnly = lock.packages['node_modules/npm']?.dev === true;
          for (const [path, entry] of Object.entries(lock.packages ?? {})) {
            const version = String(entry.version ?? '');
            const name = path.split('/').at(-1);
            const parts = version.split('.').map(Number);
            const [major, minor, patch] = parts;
            const unsafeGlob = name === 'glob' && ((major >= 9 && major < 14) ||
              (major === 14 && minor === 0 && patch < 2));
            const unsafeMinimatch = name === 'minimatch' && ((major >= 7 && major < 11) ||
              (major === 11 && minor === 0 && patch < 1));
            if (!unsafeGlob && !unsafeMinimatch) continue;
            const allow = npmIsDevOnly && path.startsWith('node_modules/npm/node_modules/') && entry.inBundle === true;
            (allow ? residuals : violations).push(path + '@' + version);
          }
          console.log('Bundled npm CLI residuals:', residuals);
          console.log('Unexpected vulnerable deps:', violations);
          if (violations.length) throw new Error('unpatched non-bundled glob/minimatch dependency');
          JS
          npm ci --ignore-scripts --no-audit --no-fund
          npm ls --depth=0
      - name: Commit regenerated lock
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo 'No lock update required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'fix(deps): upgrade vulnerable glob and minimatch transitive dependencies'
          git push origin "HEAD:${GITHUB_REF_NAME}"
