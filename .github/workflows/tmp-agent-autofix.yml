name: Temporary deterministic autofix

on:
  push:

permissions:
  contents: write

jobs:
  autofix:
    if: contains(github.event.head_commit.message, '[agent-autofix]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          # The job pushes the autofix commit with the checkout token; no
          # artifact is uploaded, so persisted credentials cannot leak.
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: false
          python-version: "3.13"

      - name: Install minimal prek runtime
        shell: bash
        run: |
          uv venv --python 3.13
          uv pip install --python .venv/bin/python prek==0.5.10

      - name: Converge deterministic hooks
        shell: bash
        env:
          UV_NO_SYNC: "1"
          SKIP: "pytest-collect"
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR origin/master...HEAD)
          if ((${#files[@]} == 0)); then
            exit 0
          fi
          for pass in 1 2 3; do
            set +e
            uv run prek run --hook-stage pre-commit --files "${files[@]}" --show-diff-on-failure
            rc=$?
            set -e
            if ((rc == 0)); then
              echo "deterministic hooks converged in ${pass} pass(es)"
              break
            fi
            if ((pass == 3)); then
              exit "${rc}"
            fi
          done

      - name: Commit deterministic rewrites
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No deterministic rewrite required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: apply deterministic quality autofix"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  # One-time lockfile regeneration, restricted to this PR branch and marker.
  lockfix:
    if: github.ref_name == 'fix/health-state-coherence-20261116' && contains(github.event.head_commit.message, '[agent-lockfix]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout target branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Regenerate consistent npm lockfile from scoped security overrides
        shell: bash
        run: |
          set -euo pipefail
          # npm install alone can retain lock-only orphaned bundled CLI entries.
          # Remove the unused release plugin and explicitly prune its vendored npm tree.
          npm uninstall @semantic-release/npm --package-lock-only --ignore-scripts --no-audit --no-fund
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm prune --package-lock-only --ignore-scripts --no-audit --no-fund
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          for (const [path, entry] of Object.entries(lock.packages ?? {})) {
            const version = String(entry.version ?? '');
            const packageName = path.split('/').at(-1);
            const major = Number(version.split('.')[0]);
            if ((packageName === 'glob' && major >= 9 && major <= 13) ||
                (packageName === 'minimatch' && major >= 7 && major <= 10) ||
                path === 'node_modules/npm') {
              throw new Error(`vulnerable dependency retained: ${path}@${version}`);
            }
          }
          if (lock.version !== lock.packages['']?.version) throw new Error('root version mismatch');
          JS
      - name: Commit lockfile on existing branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo 'No lockfile rewrite required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'fix(deps): resolve vulnerable npm glob and minimatch transitives'
          git push origin "HEAD:${GITHUB_REF_NAME}"
