---
name: Production Smoke

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: production-smoke-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  production-smoke:
    name: Production API and UI smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRODUCTION_ROOT_URL: https://fastapi-sample.fastapicloud.dev
      PRODUCTION_API_URL: https://fastapi-sample.fastapicloud.dev/api

    steps:
      - name: Checkout smoke-test code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check production homelab status
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            --retry 3 \
            --retry-delay 5 \
            --retry-all-errors \
            "${PRODUCTION_API_URL}/homelab/status" \
            | jq .

      - name: Check production runtime topology
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            --retry 3 \
            --retry-delay 5 \
            --retry-all-errors \
            "${PRODUCTION_API_URL}/runtime/topology" \
            > /tmp/runtime-topology.json
          jq . /tmp/runtime-topology.json
          jq -e '
            (.observed_instance_count | type == "number" and . >= 1) and
            (.instances | type == "array" and length >= 1) and
            (.active_egress_ips | type == "array") and
            (.recent_egress_ips | type == "array") and
            .platform_replica_count_available == false and
            (.count_semantics | type == "string" and length > 0)
          ' /tmp/runtime-topology.json >/dev/null

      - name: Verify deployed FastAPI Cloud identity and Redis usage
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            --retry 3 \
            --retry-delay 5 \
            --retry-all-errors \
            "${PRODUCTION_API_URL}/runtime/topology" \
            > /tmp/runtime-topology-deployed.json

          echo "::group::FastAPI Cloud runtime identity"
          jq '{
            provider,
            runtime_mode,
            observed_instance_count,
            active_egress_ips,
            aggregation,
            redis
          }' /tmp/runtime-topology-deployed.json
          echo "::endgroup::"

          jq -e '
            .provider == "FastAPI Cloud" and
            .runtime_mode == "fastapi_cloud" and
            (.observed_instance_count | type == "number" and . >= 1) and
            .redis.configured == true and
            .redis.available == true and
            (.redis.telemetry_available | type == "boolean") and
            (if .redis.telemetry_available == true then
              (.redis.used_memory_bytes | type == "number" and . >= 0) and
              (.redis.keys | type == "number" and . >= 0) and
              (.redis.connected_clients | type == "number" and . >= 0)
            else
              (.redis.reason | type == "string" and length > 0) and
              .redis.failure_stage == "info"
            end)
          ' /tmp/runtime-topology-deployed.json >/dev/null

      - name: Check production pfSense observability
        shell: bash
        run: |
          set -euo pipefail

          fetch_json() {
            local url="$1"
            local output="$2"
            curl --fail --silent --show-error \
              --connect-timeout 10 \
              --max-time 30 \
              --retry 3 \
              --retry-delay 5 \
              --retry-all-errors \
              "${url}" >"${output}"
          }

          fetch_json "${PRODUCTION_ROOT_URL}/healthz" /tmp/healthz.json
          fetch_json "${PRODUCTION_API_URL}/homelab/health" /tmp/homelab-health.json
          fetch_json "${PRODUCTION_API_URL}/homelab/status" /tmp/homelab-status.json

          echo "::group::pfSense direct liveness"
          jq '.checks.pfsense' /tmp/healthz.json
          echo "::endgroup::"

          echo "::group::pfSense credential inventory"
          jq '.providerCredentials | {pfsense, pfsense_security}' /tmp/homelab-status.json
          echo "::endgroup::"

          echo "::group::pfSense ingress/Snort telemetry"
          jq '.pfsense.dns | {
            configured,
            reachable,
            policy_state,
            reason,
            error_stage,
            error,
            ingress_block,
            security_filters
          }' /tmp/homelab-health.json
          echo "::endgroup::"

          # A transient classified transport failure is diagnostic evidence, not
          # a failed deployment. Require either a live response or a complete
          # failure classification from the dedicated posture probe.
          jq -e '
            .checks.pfsense.credential_mode == "dedicated_posture" and
            (
              (
                .checks.pfsense.reachable == true and
                (.checks.pfsense.http_status >= 200 and .checks.pfsense.http_status < 300)
              ) or
              (
                .checks.pfsense.reachable == false and
                (.checks.pfsense.error_kind | type == "string" and length > 0) and
                (.checks.pfsense.failure_stage | type == "string" and length > 0) and
                (.checks.pfsense.attempts | type == "number" and . >= 1)
              )
            )
          ' /tmp/healthz.json >/dev/null

          jq -e '
            .providerCredentials.pfsense.configured == true and
            .providerCredentials.pfsense.credential_mode == "dedicated" and
            .providerCredentials.pfsense_security.configured == true and
            .providerCredentials.pfsense_security.credential_mode == "dedicated"
          ' /tmp/homelab-status.json >/dev/null

          # Validate the security telemetry contract rather than requiring the
          # WAN management path to be reachable at this exact instant. Fresh
          # clear/blocked verdicts remain authoritative; stale/unavailable states
          # must carry enough evidence to explain why attribution is withheld.
          jq -e '
            (.pfsense.dns.security_filters | type == "array" and length > 0) and
            (.pfsense.dns.ingress_block | type == "object") and
            (.pfsense.dns.ingress_block.state as $state |
              ["clear", "blocked", "attribution_unavailable", "telemetry_stale", "telemetry_unavailable"] | index($state) != null) and
            (if .pfsense.dns.ingress_block.state == "telemetry_stale" then
              .pfsense.dns.ingress_block.stale == true and
              .pfsense.dns.ingress_block.attribution_available == false and
              (.pfsense.dns.ingress_block.last_success_at | type == "string" and length > 0)
            elif .pfsense.dns.ingress_block.state == "telemetry_unavailable" then
              .pfsense.dns.ingress_block.telemetry_available == false and
              (.pfsense.dns.ingress_block.failure_stage | type == "string" and length > 0) and
              (.pfsense.dns.ingress_block.error_kind | type == "string" and length > 0)
            else true end)
          ' /tmp/homelab-health.json >/dev/null

      - name: Set up Node.js for deployed UI smoke
        if: github.event_name != 'pull_request'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install Playwright headless smoke runtime
        if: github.event_name != 'pull_request'
        timeout-minutes: 6
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts --omit=dev --no-audit --no-fund playwright@1.55.0
          npx --no-install playwright install --with-deps --only-shell chromium

      - name: Check production UI version matches source revision
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          expected="$(jq -r '.version' package.json)"
          test -n "${expected}" && test "${expected}" != "null"
          echo "Expected source version: ${expected}"
          EXPECTED_VERSION="${expected}" node scripts/check-production-api-ui.mjs
