---
name: Deploy to FastAPI Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fastapi-cloud-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate production candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEYCLOAK_CLIENT_ID: test
      KEYCLOAK_CLIENT_SECRET: test-secret
      KEYCLOAK_REALM: test
      KEYCLOAK_SERVER_URL: http://localhost:8080
      METRICS_ENABLED: "false"
      LOGFIRE_ENABLED: "false"
      LOGFIRE_ENVIRONMENT: test
      LOGFIRE_TOKEN: ""
      PYTHON_VERSION: "3.13"
      SENTRY_ENABLED: "false"
      SENTRY_DSN: ""
      SENTRY_ENVIRONMENT: test
      SENTRY_RELEASE: ci-${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}
          version: "0.12.1"

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Check release version consistency
        run: uv run python scripts/check_versions.py

      - name: Run critical static checks
        run: uv run ruff check server_app.py nabla --select=E9,F63,F7,F82

      - name: Run test suite
        run: uv run pytest --junit-xml=junit.xml

      - name: Build production package
        run: uv build

  deploy:
    name: Deploy production
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20

    steps:
      - name: Checkout validated revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"

      - name: Verify FastAPI Cloud configuration
        env:
          FASTAPI_CLOUD_APP_ID: ${{ secrets.FASTAPI_CLOUD_APP_ID }}
          FASTAPI_CLOUD_TOKEN: ${{ secrets.FASTAPI_CLOUD_TOKEN }}
        run: |
          test -n "${FASTAPI_CLOUD_APP_ID}" || {
            echo "FASTAPI_CLOUD_APP_ID is not configured" >&2
            exit 1
          }
          test -n "${FASTAPI_CLOUD_TOKEN}" || {
            echo "FASTAPI_CLOUD_TOKEN is not configured" >&2
            exit 1
          }

      - name: Deploy and wait for FastAPI Cloud verification
        env:
          FASTAPI_CLOUD_APP_ID: ${{ secrets.FASTAPI_CLOUD_APP_ID }}
          FASTAPI_CLOUD_TOKEN: ${{ secrets.FASTAPI_CLOUD_TOKEN }}
        run: uvx fastapi-cloud-cli fastapi deploy

      - name: Verify production health
        run: >-
          curl --fail --show-error --silent
          --retry 10
          --retry-delay 10
          --retry-all-errors
          https://fastapi-sample.fastapicloud.dev/health
