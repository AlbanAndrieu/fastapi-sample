---
name: OWASP ZAP Web and API

on:
  workflow_call:
    secrets:
      CF_ACCESS_CLIENT_ID:
        required: false
      CF_ACCESS_CLIENT_SECRET:
        required: false
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zap-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  dast:
    name: ZAP production Web + OpenAPI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TRUENAS_ROOT_URL: https://sample.albandrieu.com/
      TRUENAS_API_URL: https://sample.albandrieu.com/api
      TRUENAS_OPENAPI_URL: https://sample.albandrieu.com/openapi.json
      CLOUD_API_URL: https://fastapi-sample.fastapicloud.dev/api
      CLOUD_OPENAPI_URL: https://fastapi-sample.fastapicloud.dev/openapi.json
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      ZAP_AUTH_HEADER: CF-Access-Client-Id
      ZAP_AUTH_HEADER_VALUE: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      ZAP_AUTH_HEADER_SITE: sample.albandrieu.com

    steps:
      - name: Checkout exact source SHA and ZAP policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify authorized production DAST surfaces
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${CF_ACCESS_CLIENT_ID}" || -z "${CF_ACCESS_CLIENT_SECRET}" ]]; then
            echo "::error::Cloudflare Access service-token secrets are required to scan sample.albandrieu.com behind Access."
            exit 1
          fi

          cf_headers=(
            -H "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}"
            -H "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}"
          )

          curl --fail --silent --show-error --location \
            --connect-timeout 8 --max-time 20 --retry 2 --retry-all-errors \
            "${cf_headers[@]}" "${TRUENAS_ROOT_URL}" >/dev/null
          curl --fail --silent --show-error --location \
            --connect-timeout 8 --max-time 20 --retry 2 --retry-all-errors \
            "${cf_headers[@]}" "${TRUENAS_API_URL}" | jq -e 'type == "object"' >/dev/null
          curl --fail --silent --show-error --location \
            --connect-timeout 8 --max-time 20 --retry 2 --retry-all-errors \
            "${cf_headers[@]}" "${TRUENAS_OPENAPI_URL}" | jq -e '.openapi | type == "string"' >/dev/null
          curl --fail --silent --show-error --location \
            --connect-timeout 8 --max-time 20 --retry 2 --retry-all-errors \
            "${CLOUD_API_URL}" | jq -e 'type == "object"' >/dev/null
          curl --fail --silent --show-error --location \
            --connect-timeout 8 --max-time 20 --retry 2 --retry-all-errors \
            "${CLOUD_OPENAPI_URL}" | jq -e '.openapi | type == "string"' >/dev/null

      - name: ZAP Web baseline · TrueNAS root
        id: zap_web_truenas_root
        continue-on-error: true
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          docker_name: ghcr.io/zaproxy/zaproxy:2.17.0
          target: ${{ env.TRUENAS_ROOT_URL }}
          rules_file_name: ".zap/web-rules.tsv"
          allow_issue_writing: false
          fail_action: true
          artifact_name: zap-web-truenas-root
          cmd_options: >-
            -I -T 4 -s
            -z "-config replacer.full_list\(0\).description=cf-access-client-secret
            -config replacer.full_list\(0\).enabled=true
            -config replacer.full_list\(0\).matchtype=REQ_HEADER
            -config replacer.full_list\(0\).matchstr=CF-Access-Client-Secret
            -config replacer.full_list\(0\).regex=false
            -config replacer.full_list\(0\).replacement=${{ secrets.CF_ACCESS_CLIENT_SECRET }}"

      - name: ZAP Web baseline · TrueNAS API
        id: zap_web_truenas_api
        continue-on-error: true
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          docker_name: ghcr.io/zaproxy/zaproxy:2.17.0
          target: ${{ env.TRUENAS_API_URL }}
          rules_file_name: ".zap/web-rules.tsv"
          allow_issue_writing: false
          fail_action: true
          artifact_name: zap-web-truenas-api
          cmd_options: >-
            -I -T 4 -s
            -z "-config replacer.full_list\(0\).description=cf-access-client-secret
            -config replacer.full_list\(0\).enabled=true
            -config replacer.full_list\(0\).matchtype=REQ_HEADER
            -config replacer.full_list\(0\).matchstr=CF-Access-Client-Secret
            -config replacer.full_list\(0\).regex=false
            -config replacer.full_list\(0\).replacement=${{ secrets.CF_ACCESS_CLIENT_SECRET }}"

      - name: ZAP Web baseline · FastAPI Cloud API
        id: zap_web_cloud_api
        continue-on-error: true
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          docker_name: ghcr.io/zaproxy/zaproxy:2.17.0
          target: ${{ env.CLOUD_API_URL }}
          rules_file_name: ".zap/web-rules.tsv"
          allow_issue_writing: false
          fail_action: true
          artifact_name: zap-web-fastapi-cloud-api
          cmd_options: "-I -T 4 -s"

      - name: ZAP OpenAPI active scan · TrueNAS
        id: zap_api_truenas
        continue-on-error: true
        uses: zaproxy/action-api-scan@5158fe4d9d8fcc75ea204db81317cce7f9e5453d # v0.10.0
        with:
          docker_name: ghcr.io/zaproxy/zaproxy:2.17.0
          target: ${{ env.TRUENAS_OPENAPI_URL }}
          format: openapi
          rules_file_name: ".zap/api-rules.tsv"
          allow_issue_writing: false
          fail_action: true
          artifact_name: zap-api-truenas
          cmd_options: >-
            -I -T 4 -s
            -z "-config replacer.full_list\(0\).description=cf-access-client-secret
            -config replacer.full_list\(0\).enabled=true
            -config replacer.full_list\(0\).matchtype=REQ_HEADER
            -config replacer.full_list\(0\).matchstr=CF-Access-Client-Secret
            -config replacer.full_list\(0\).regex=false
            -config replacer.full_list\(0\).replacement=${{ secrets.CF_ACCESS_CLIENT_SECRET }}"

      - name: ZAP OpenAPI active scan · FastAPI Cloud
        id: zap_api_cloud
        continue-on-error: true
        uses: zaproxy/action-api-scan@5158fe4d9d8fcc75ea204db81317cce7f9e5453d # v0.10.0
        with:
          docker_name: ghcr.io/zaproxy/zaproxy:2.17.0
          target: ${{ env.CLOUD_OPENAPI_URL }}
          format: openapi
          rules_file_name: ".zap/api-rules.tsv"
          allow_issue_writing: false
          fail_action: true
          artifact_name: zap-api-fastapi-cloud
          cmd_options: "-I -T 4 -s"

      - name: Summarize ZAP outcomes
        if: always()
        env:
          TRUENAS_ROOT_OUTCOME: ${{ steps.zap_web_truenas_root.outcome }}
          TRUENAS_API_OUTCOME: ${{ steps.zap_web_truenas_api.outcome }}
          CLOUD_WEB_OUTCOME: ${{ steps.zap_web_cloud_api.outcome }}
          TRUENAS_OPENAPI_OUTCOME: ${{ steps.zap_api_truenas.outcome }}
          CLOUD_OPENAPI_OUTCOME: ${{ steps.zap_api_cloud.outcome }}
        shell: bash
        run: |
          {
            echo "## OWASP ZAP post-deployment DAST"
            echo
            echo "- Source SHA: ${GITHUB_SHA}"
            echo "- TrueNAS Web root: **${TRUENAS_ROOT_OUTCOME:-not-run}** · ${TRUENAS_ROOT_URL}"
            echo "- TrueNAS Web API: **${TRUENAS_API_OUTCOME:-not-run}** · ${TRUENAS_API_URL}"
            echo "- FastAPI Cloud Web API: **${CLOUD_WEB_OUTCOME:-not-run}** · ${CLOUD_API_URL}"
            echo "- TrueNAS OpenAPI active scan: **${TRUENAS_OPENAPI_OUTCOME:-not-run}**"
            echo "- FastAPI Cloud OpenAPI active scan: **${CLOUD_OPENAPI_OUTCOME:-not-run}**"
            echo "- Policy: configured FAIL findings block; WARN findings stay visible in artifacts via -I."
            echo "- Management APIs for pfSense and TrueNAS are intentionally excluded."
            echo "- Artifacts are split by production surface for remediation."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce ZAP production policy
        if: always()
        env:
          TRUENAS_ROOT_OUTCOME: ${{ steps.zap_web_truenas_root.outcome }}
          TRUENAS_API_OUTCOME: ${{ steps.zap_web_truenas_api.outcome }}
          CLOUD_WEB_OUTCOME: ${{ steps.zap_web_cloud_api.outcome }}
          TRUENAS_OPENAPI_OUTCOME: ${{ steps.zap_api_truenas.outcome }}
          CLOUD_OPENAPI_OUTCOME: ${{ steps.zap_api_cloud.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          outcomes=(
            "${TRUENAS_ROOT_OUTCOME:-not-run}"
            "${TRUENAS_API_OUTCOME:-not-run}"
            "${CLOUD_WEB_OUTCOME:-not-run}"
            "${TRUENAS_OPENAPI_OUTCOME:-not-run}"
            "${CLOUD_OPENAPI_OUTCOME:-not-run}"
          )
          for outcome in "${outcomes[@]}"; do
            if [[ "${outcome}" != "success" ]]; then
              echo "::error::At least one production ZAP Web/OpenAPI scan did not satisfy the blocking policy. Inspect the per-surface artifacts."
              exit 1
            fi
          done
