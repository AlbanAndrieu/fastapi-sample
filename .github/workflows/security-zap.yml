---
name: OWASP ZAP Web and API

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "nabla/**"
      - "server_all.py"
      - "templates/**"
      - ".zap/**"
      - ".github/workflows/security-zap.yml"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  statuses: read

concurrency:
  group: zap-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: true

jobs:
  preview-gate:
    name: Require successful Vercel preview
    runs-on: ubuntu-latest
    timeout-minutes: 6
    outputs:
      ready: ${{ steps.preview.outputs.ready }}
      reason: ${{ steps.preview.outputs.reason }}
    steps:
      - name: Check Vercel deployment status before starting DAST
        id: preview
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            if (context.eventName !== "pull_request") {
              core.setOutput("ready", "true");
              core.setOutput("reason", "non-PR invocation");
              return;
            }

            const sha = context.payload.pull_request?.head?.sha;
            if (!sha) {
              core.setOutput("ready", "false");
              core.setOutput("reason", "pull request head SHA unavailable");
              return;
            }

            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            const terminalFailure = new Set(["failure", "error"]);
            for (let attempt = 1; attempt <= 24; attempt += 1) {
              const response = await github.rest.repos.getCombinedStatusForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: sha,
              });
              const vercel = response.data.statuses.find(
                (status) => String(status.context || "").toLowerCase() === "vercel",
              );

              if (vercel?.state === "success") {
                core.info(`Vercel preview succeeded for ${sha}. DAST may start.`);
                core.setOutput("ready", "true");
                core.setOutput("reason", "Vercel preview succeeded");
                return;
              }
              if (vercel && terminalFailure.has(vercel.state)) {
                core.warning(`Vercel preview is ${vercel.state}; ZAP will not start.`);
                core.setOutput("ready", "false");
                core.setOutput("reason", `Vercel preview ${vercel.state}`);
                return;
              }

              core.info(
                `Vercel preview not successful yet (${vercel?.state || "not reported"}); attempt ${attempt}/24.`,
              );
              if (attempt < 24) await sleep(10000);
            }

            core.warning("Vercel preview did not reach success within the preview gate window; ZAP will not start.");
            core.setOutput("ready", "false");
            core.setOutput("reason", "Vercel preview not confirmed successful");

      - name: Summarize preview gate
        if: always()
        env:
          READY: ${{ steps.preview.outputs.ready }}
          REASON: ${{ steps.preview.outputs.reason }}
        shell: bash
        run: |
          {
            echo "## Vercel preview gate"
            echo
            echo "- DAST allowed: **${READY:-false}**"
            echo "- Reason: ${REASON:-unknown}"
            echo "- ZAP is never started for a PR until the Vercel status context is successful."
          } >> "$GITHUB_STEP_SUMMARY"

  dast:
    name: ZAP Web + OpenAPI on ephemeral runtime
    needs: preview-gate
    if: ${{ needs.preview-gate.outputs.ready == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHON_VERSION: "3.13"
      BASE_URL: "http://127.0.0.1:8080"
      KEYCLOAK_SERVER_URL: http://localhost:18080
      KEYCLOAK_REALM: test
      KEYCLOAK_CLIENT_ID: test
      KEYCLOAK_CLIENT_SECRET: test-secret
      OAUTH_TOKEN_SECRET: mocked-oauth-token-secret
      FASTAPI_RUNTIME_MODE: local
      SICKZ_INTERNAL_NETWORK: "true"
      HOMELAB_INTERNAL_PROBES_ENABLED: "false"
      METRICS_ENABLED: "false"
      LOGFIRE_ENABLED: "false"
      LOGFIRE_TOKEN: ""
      SENTRY_ENABLED: "false"
      SENTRY_DSN: ""
      DATADOG_ENABLED: "false"
      DD_TRACE_ENABLED: "false"
      DD_PROFILING_ENABLED: "false"
      DD_LOGS_INJECTION: "false"
      DD_APPSEC_ENABLED: "false"
      DD_IAST_ENABLED: "false"
      UNLEASH_ENABLED: "false"
      STATSIG_ENABLED: "false"

    steps:
      - name: Checkout exact source SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}
          version: "0.12.1"

      - name: Install locked runtime dependencies
        run: uv sync --frozen --no-default-groups

      - name: Start isolated FastAPI runtime
        shell: bash
        run: |
          set -euo pipefail
          nohup uv run --no-sync uvicorn server_all:app \
            --host 127.0.0.1 \
            --port 8080 \
            --lifespan off \
            > /tmp/fastapi-zap.log 2>&1 &
          pid="$!"
          echo "${pid}" > /tmp/fastapi-zap.pid

          for attempt in $(seq 1 60); do
            if ! kill -0 "${pid}" 2>/dev/null; then
              cat /tmp/fastapi-zap.log
              echo "::error::FastAPI DAST target exited before becoming ready."
              exit 1
            fi

            if curl --fail --silent --show-error "$BASE_URL/api" >/dev/null \
              && curl --fail --silent --show-error "$BASE_URL/openapi.json" >/dev/null; then
              echo "FastAPI DAST targets ready after ${attempt}s."
              exit 0
            fi
            sleep 1
          done

          cat /tmp/fastapi-zap.log
          echo "::error::FastAPI DAST targets did not become ready."
          exit 1

      - name: OWASP ZAP Web baseline
        id: zap_web
        continue-on-error: true
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          docker_name: ghcr.io/zaproxy/zaproxy:2.17.0
          target: ${{ env.BASE_URL }}/api
          rules_file_name: ".zap/web-rules.tsv"
          allow_issue_writing: false
          fail_action: true
          artifact_name: zap-web-report
          cmd_options: "-I -T 5 -c .zap/web-rules.tsv"

      - name: OWASP ZAP OpenAPI active scan
        id: zap_api
        continue-on-error: true
        uses: zaproxy/action-api-scan@5158fe4d9d8fcc75ea204db81317cce7f9e5453d # v0.10.0
        with:
          docker_name: ghcr.io/zaproxy/zaproxy:2.17.0
          target: ${{ env.BASE_URL }}/openapi.json
          format: openapi
          rules_file_name: ".zap/api-rules.tsv"
          allow_issue_writing: false
          fail_action: true
          artifact_name: zap-api-report
          cmd_options: "-I -T 5 -c .zap/api-rules.tsv"

      - name: Summarize ZAP outcomes
        if: always()
        env:
          WEB_OUTCOME: ${{ steps.zap_web.outcome }}
          API_OUTCOME: ${{ steps.zap_api.outcome }}
        shell: bash
        run: |
          {
            echo "## OWASP ZAP DAST"
            echo
            echo "- Exact source SHA: ${GITHUB_SHA}"
            echo "- Web baseline: **${WEB_OUTCOME:-not-run}** · /api"
            echo "- OpenAPI active scan: **${API_OUTCOME:-not-run}** · /openapi.json"
            echo "- Target: isolated runner-local FastAPI process; no production/TrueNAS/pfSense target is attacked."
            echo "- Lifespan: disabled so DAST surface validation is independent from PostgreSQL/Redis/MCP startup."
            echo "- Artifacts: zap-web-report, zap-api-report"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce ZAP Web and API policy
        if: always()
        env:
          WEB_OUTCOME: ${{ steps.zap_web.outcome }}
          API_OUTCOME: ${{ steps.zap_api.outcome }}
        shell: bash
        run: |
          if [[ "$WEB_OUTCOME" != "success" || "$API_OUTCOME" != "success" ]]; then
            echo "::error::ZAP Web/API DAST did not satisfy the blocking policy. Inspect both report artifacts."
            exit 1
          fi

      - name: Show application log on failure
        if: failure()
        shell: bash
        run: cat /tmp/fastapi-zap.log || true

      - name: Stop isolated FastAPI runtime
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/fastapi-zap.pid ]]; then
            kill "$(cat /tmp/fastapi-zap.pid)" 2>/dev/null || true
          fi
