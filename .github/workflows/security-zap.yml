---
name: OWASP ZAP Web and API

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zap-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  dast_truenas:
    name: ZAP production · TrueNAS via Access
    if: ${{ github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dast-truenas
    env:
      TRUENAS_ROOT_URL: https://fastapi-sample.albandrieu.com/
      TRUENAS_API_URL: https://fastapi-sample.albandrieu.com/api
      TRUENAS_OPENAPI_URL: https://fastapi-sample.albandrieu.com/openapi.json
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

    steps:
      - name: Checkout exact source SHA and ZAP policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify authorized TrueNAS DAST surfaces
        id: preflight_truenas
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${CF_ACCESS_CLIENT_ID}" || -z "${CF_ACCESS_CLIENT_SECRET}" ]]; then
            echo "::error::Cloudflare Access service-token secrets are required to scan fastapi-sample.albandrieu.com behind Access."
            exit 1
          fi

          cf_headers=(
            -H "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}"
            -H "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}"
          )

          curl --fail --silent --show-error --max-redirs 0 \
            --connect-timeout 8 --max-time 20 --retry 2 --retry-connrefused \
            "${cf_headers[@]}" "${TRUENAS_ROOT_URL}" >/dev/null
          curl --fail --silent --show-error --max-redirs 0 \
            --connect-timeout 8 --max-time 20 --retry 2 --retry-connrefused \
            "${cf_headers[@]}" "${TRUENAS_API_URL}" | grep -F 'id="health-board"' >/dev/null
          curl --fail --silent --show-error --max-redirs 0 \
            --connect-timeout 8 --max-time 20 --retry 2 --retry-connrefused \
            "${cf_headers[@]}" "${TRUENAS_OPENAPI_URL}" | jq -e '.openapi | type == "string"' >/dev/null


      - name: Materialize exact-host ZAP auth rules
        id: auth_rules
        if: ${{ steps.preflight_truenas.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          keys = ("CF_ACCESS_CLIENT_ID", "CF_ACCESS_CLIENT_SECRET")
          headers = ("CF-Access-Client-Id", "CF-Access-Client-Secret")
          lines = []
          for i, (key, header) in enumerate(zip(keys, headers, strict=True)):
              value = os.environ[key]
              if not re.fullmatch(r"[A-Za-z0-9_.-]+", value):
                  raise SystemExit(f"Invalid service token format: {key}")
              prefix = f"replacer.full_list({i})"
              lines.extend([
                  f"{prefix}.description=cloudflare-access-{i}",
                  f"{prefix}.enabled=true",
                  f"{prefix}.url=^https://fastapi-sample[.]albandrieu[.]com(?::443)?/.*$",
                  f"{prefix}.matchtype=REQ_HEADER",
                  f"{prefix}.matchstr={header}",
                  f"{prefix}.regex=false",
                  f"{prefix}.replacement={value}",
              ])
          path = Path(".zap/.dast-auth.properties")
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          # The pinned Docker action runs as a separate UID on this ephemeral runner.
          path.chmod(0o444)
          PY

      - name: ZAP Web baseline · TrueNAS root
        id: zap_web_truenas_root
        if: ${{ steps.auth_rules.outcome == 'success' }}
        continue-on-error: true
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          docker_name: ghcr.io/zaproxy/zaproxy:2.17.0
          target: ${{ env.TRUENAS_ROOT_URL }}
          rules_file_name: ".zap/web-rules.tsv"
          allow_issue_writing: false
          fail_action: true
          artifact_name: zap-web-truenas-root
          cmd_options: >-
            -I -T 4 -s
            -z "-configfile /zap/wrk/.zap/.dast-auth.properties"

      - name: ZAP Web baseline · TrueNAS API
        id: zap_web_truenas_api
        if: ${{ steps.auth_rules.outcome == 'success' }}
        continue-on-error: true
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          docker_name: ghcr.io/zaproxy/zaproxy:2.17.0
          target: ${{ env.TRUENAS_API_URL }}
          rules_file_name: ".zap/web-rules.tsv"
          allow_issue_writing: false
          fail_action: true
          artifact_name: zap-web-truenas-api
          cmd_options: >-
            -I -T 4 -s
            -z "-configfile /zap/wrk/.zap/.dast-auth.properties"

      - name: ZAP OpenAPI active scan · TrueNAS
        id: zap_api_truenas
        if: ${{ steps.auth_rules.outcome == 'success' }}
        continue-on-error: true
        uses: zaproxy/action-api-scan@5158fe4d9d8fcc75ea204db81317cce7f9e5453d # v0.10.0
        with:
          docker_name: ghcr.io/zaproxy/zaproxy:2.17.0
          target: ${{ env.TRUENAS_OPENAPI_URL }}
          format: openapi
          rules_file_name: ".zap/api-rules.tsv"
          allow_issue_writing: false
          fail_action: true
          artifact_name: zap-api-truenas
          cmd_options: >-
            -I -T 4 -s
            -z "-configfile /zap/wrk/.zap/.dast-auth.properties"


      - name: Remove temporary ZAP credentials
        if: always()
        shell: bash
        run: rm -f .zap/.dast-auth.properties

      - name: Enforce TrueNAS ZAP production policy
        if: always()
        env:
          TRUENAS_PREFLIGHT: ${{ steps.preflight_truenas.outcome }}
          AUTH_RULES_OUTCOME: ${{ steps.auth_rules.outcome }}
          TRUENAS_ROOT_OUTCOME: ${{ steps.zap_web_truenas_root.outcome }}
          TRUENAS_API_OUTCOME: ${{ steps.zap_web_truenas_api.outcome }}
          TRUENAS_OPENAPI_OUTCOME: ${{ steps.zap_api_truenas.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## TrueNAS ZAP evidence"
            echo "- Source SHA: ${GITHUB_SHA}"
            echo "- TRUENAS_PREFLIGHT: **${TRUENAS_PREFLIGHT:-not-run}**"
            echo "- AUTH_RULES_OUTCOME: **${AUTH_RULES_OUTCOME:-not-run}**"
            echo "- TRUENAS_ROOT_OUTCOME: **${TRUENAS_ROOT_OUTCOME:-not-run}**"
            echo "- TRUENAS_API_OUTCOME: **${TRUENAS_API_OUTCOME:-not-run}**"
            echo "- TRUENAS_OPENAPI_OUTCOME: **${TRUENAS_OPENAPI_OUTCOME:-not-run}**"
            echo "- Management APIs for pfSense and TrueNAS are intentionally excluded."
          } >> "$GITHUB_STEP_SUMMARY"
          for outcome in "${TRUENAS_PREFLIGHT:-not-run}" "${AUTH_RULES_OUTCOME:-not-run}" "${TRUENAS_ROOT_OUTCOME:-not-run}" "${TRUENAS_API_OUTCOME:-not-run}" "${TRUENAS_OPENAPI_OUTCOME:-not-run}"; do
            if [[ "${outcome}" != "success" ]]; then
              echo "::error::At least one production ZAP Web/OpenAPI scan did not satisfy the blocking policy"
              exit 1
            fi
          done

  dast_cloud:
    name: ZAP production · FastAPI Cloud
    if: ${{ github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUD_API_URL: https://fastapi-sample.fastapicloud.dev/api
      CLOUD_OPENAPI_URL: https://fastapi-sample.fastapicloud.dev/openapi.json

    steps:
      - name: Checkout exact source SHA and ZAP policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify FastAPI Cloud DAST surfaces
        id: preflight_cloud
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-redirs 0 \
            --connect-timeout 8 --max-time 20 --retry 2 --retry-connrefused \
            "${CLOUD_API_URL}" | grep -F 'id="health-board"' >/dev/null
          curl --fail --silent --show-error --max-redirs 0 \
            --connect-timeout 8 --max-time 20 --retry 2 --retry-connrefused \
            "${CLOUD_OPENAPI_URL}" | jq -e '.openapi | type == "string"' >/dev/null

      - name: ZAP Web baseline · FastAPI Cloud API
        id: zap_web_cloud_api
        if: ${{ steps.preflight_cloud.outcome == 'success' }}
        continue-on-error: true
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          docker_name: ghcr.io/zaproxy/zaproxy:2.17.0
          target: ${{ env.CLOUD_API_URL }}
          rules_file_name: ".zap/web-rules.tsv"
          allow_issue_writing: false
          fail_action: true
          artifact_name: zap-web-fastapi-cloud-api
          cmd_options: "-I -T 4 -s"

      - name: ZAP OpenAPI active scan · FastAPI Cloud
        id: zap_api_cloud
        if: ${{ steps.preflight_cloud.outcome == 'success' }}
        continue-on-error: true
        uses: zaproxy/action-api-scan@5158fe4d9d8fcc75ea204db81317cce7f9e5453d # v0.10.0
        with:
          docker_name: ghcr.io/zaproxy/zaproxy:2.17.0
          target: ${{ env.CLOUD_OPENAPI_URL }}
          format: openapi
          rules_file_name: ".zap/api-rules.tsv"
          allow_issue_writing: false
          fail_action: true
          artifact_name: zap-api-fastapi-cloud
          cmd_options: "-I -T 4 -s"

      - name: Enforce Cloud ZAP production policy
        if: always()
        env:
          CLOUD_PREFLIGHT: ${{ steps.preflight_cloud.outcome }}
          CLOUD_WEB_OUTCOME: ${{ steps.zap_web_cloud_api.outcome }}
          CLOUD_OPENAPI_OUTCOME: ${{ steps.zap_api_cloud.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Cloud ZAP evidence"
            echo "- Source SHA: ${GITHUB_SHA}"
            echo "- CLOUD_PREFLIGHT: **${CLOUD_PREFLIGHT:-not-run}**"
            echo "- CLOUD_WEB_OUTCOME: **${CLOUD_WEB_OUTCOME:-not-run}**"
            echo "- CLOUD_OPENAPI_OUTCOME: **${CLOUD_OPENAPI_OUTCOME:-not-run}**"
            echo "- Management APIs for pfSense and TrueNAS are intentionally excluded."
          } >> "$GITHUB_STEP_SUMMARY"
          for outcome in "${CLOUD_PREFLIGHT:-not-run}" "${CLOUD_WEB_OUTCOME:-not-run}" "${CLOUD_OPENAPI_OUTCOME:-not-run}"; do
            if [[ "${outcome}" != "success" ]]; then
              echo "::error::At least one production ZAP Web/OpenAPI scan did not satisfy the blocking policy"
              exit 1
            fi
          done

