---
name: Compatibility tests

on:
  schedule:
    # Full cross-platform compatibility suite once a week.
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Compatibility (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.13"]
    env:
      METRICS_ENABLED: "false"
      LOGFIRE_ENABLED: "false"
      LOGFIRE_TOKEN: ""
      SENTRY_ENABLED: "false"
      SENTRY_DSN: ""
      DATADOG_ENABLED: "false"
      DD_TRACE_ENABLED: "false"
      DD_PROFILING_ENABLED: "false"
      DD_LOGS_INJECTION: "false"
      DD_APPSEC_ENABLED: "false"
      DD_IAST_ENABLED: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
          version: "0.12.1"

      - name: Install project dependencies
        run: uv sync --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest --junit-xml=junit.xml

      - name: Build package
        run: uv build
