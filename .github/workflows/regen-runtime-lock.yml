name: Regenerate runtime lock

on:
  push:
    branches:
      - feat/mcp-streamable-http-outbound
    paths:
      - .github/workflows/regen-runtime-lock.yml

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feat/mcp-streamable-http-outbound
          persist-credentials: true
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          python-version: "3.12"
      - name: Add runtime LangChain Core dependency
        run: uv add 'langchain-core>=1.3.0'
      - name: Commit regenerated runtime lock
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pyproject.toml uv.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix(runtime): install langchain-core on FastAPI Cloud'
          git push origin HEAD:feat/mcp-streamable-http-outbound
