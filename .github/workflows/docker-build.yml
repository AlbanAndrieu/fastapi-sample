---
name: Docker CI

permissions:
  contents: read
  packages: write
  security-events: write

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    branches: [main]
    paths-ignore: ["**.md"]
  schedule:
    - cron: "0 6 * * 3"

env:
  IMAGE_NAME: pgclient

jobs:
  build-template:
    name: Build Docker
    runs-on: ubuntu-latest
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      READ_NPM_TOKEN: ${{ secrets.READ_NPM_TOKEN }}
      READ_PACKAGE_TOKEN: ${{ secrets.CI_PIP_GITLABNABLA_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request' && env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != ''
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image metadata and build secrets
        id: meta
        shell: bash
        run: |
          owner_lc="${GITHUB_REPOSITORY_OWNER,,}"
          echo "ghcr_tag=ghcr.io/${owner_lc}/${IMAGE_NAME}:latest" >> "$GITHUB_OUTPUT"
          printf '%s' "${READ_NPM_TOKEN:-not-configured}" > /tmp/read-npm-token
          printf '%s' "${READ_PACKAGE_TOKEN:-not-configured}" > /tmp/read-package-token

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          tags: ${{ steps.meta.outputs.ghcr_tag }}
          build-args: |
            PG_MAJOR=18
            GIT_SHA=${{ github.sha }}
          secret-files: |
            read-npm-token=/tmp/read-npm-token
            read-package-token=/tmp/read-package-token
          load: true
          push: false

      - name: Push image to GHCR
        if: github.event_name != 'pull_request'
        env:
          GHCR_TAG: ${{ steps.meta.outputs.ghcr_tag }}
        run: docker push "${GHCR_TAG}"

      - name: Push image to Docker Hub
        if: github.event_name != 'pull_request' && env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != ''
        env:
          GHCR_TAG: ${{ steps.meta.outputs.ghcr_tag }}
        shell: bash
        run: |
          dockerhub_tag="${DOCKER_USERNAME,,}/${IMAGE_NAME}:latest"
          docker tag "${GHCR_TAG}" "${dockerhub_tag}"
          docker push "${dockerhub_tag}"

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.ghcr_tag }}
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Upload Trivy scan results
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3.37.6
        with:
          sarif_file: trivy-results.sarif
