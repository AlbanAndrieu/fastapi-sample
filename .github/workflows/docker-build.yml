---
name: Docker CI

permissions:
  contents: read
  packages: write
  security-events: write

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    branches: [main]
    paths-ignore: ["**.md"]
  schedule:
    - cron: "0 6 * * 3"

env:
  IMAGE_NAME: pgclient

jobs:
  build-template:
    name: Build Docker
    runs-on: ubuntu-latest
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request' && env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image metadata
        id: meta
        shell: bash
        run: |
          owner_lc="${GITHUB_REPOSITORY_OWNER,,}"
          echo "ghcr_tag=ghcr.io/${owner_lc}/${IMAGE_NAME}:latest" >> "$GITHUB_OUTPUT"

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: ${{ steps.meta.outputs.ghcr_tag }}
          build-args: |
            PG_MAJOR=18
            GIT_SHA=${{ github.sha }}
          load: true
          push: false

      - name: Push image to GHCR
        if: github.event_name != 'pull_request'
        run: docker push "${{ steps.meta.outputs.ghcr_tag }}"

      - name: Push image to Docker Hub
        if: github.event_name != 'pull_request' && env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != ''
        shell: bash
        run: |
          dockerhub_tag="${DOCKER_USERNAME,,}/${IMAGE_NAME}:latest"
          docker tag "${{ steps.meta.outputs.ghcr_tag }}" "${dockerhub_tag}"
          docker push "${dockerhub_tag}"

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.ghcr_tag }}
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Upload Trivy scan results
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
