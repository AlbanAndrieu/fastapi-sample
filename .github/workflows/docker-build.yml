---
name: Docker CI

permissions:
  contents: read

on:
  workflow_call:
    secrets:
      DOCKER_USERNAME:
        required: false
      DOCKER_PASSWORD:
        required: false
      CI_PIP_GITLABNABLA_TOKEN:
        required: false
  schedule:
    - cron: "0 6 * * 3"

env:
  IMAGE_NAME: fastapi-sample

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-template:
    name: Build Docker
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
      security-events: write
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      READ_PACKAGE_TOKEN: ${{ secrets.CI_PIP_GITLABNABLA_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to Docker Hub
        if: github.event_name == 'schedule' && env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != ''
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Login to GitHub Container Registry
        if: github.event_name == 'schedule'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare metadata and build secret
        id: meta
        shell: bash
        run: |
          owner_lc="${GITHUB_REPOSITORY_OWNER,,}"
          echo "ghcr_tag=ghcr.io/${owner_lc}/${IMAGE_NAME}:latest" >> "$GITHUB_OUTPUT"
          printf '%s' "${READ_PACKAGE_TOKEN:-not-configured}" > /tmp/read-package-token

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: production
          tags: ${{ steps.meta.outputs.ghcr_tag }}
          secret-files: |
            read-package-token=/tmp/read-package-token
          load: true
          push: false
          cache-from: type=gha,scope=production
          cache-to: type=gha,mode=max,scope=production

      - name: Show production image size
        env:
          GHCR_TAG: ${{ steps.meta.outputs.ghcr_tag }}
        run: docker image inspect "${GHCR_TAG}" --format='{{.Size}} bytes'

      - name: Push image to GHCR
        if: github.event_name == 'schedule'
        env:
          GHCR_TAG: ${{ steps.meta.outputs.ghcr_tag }}
        run: docker push "${GHCR_TAG}"

      - name: Push image to Docker Hub
        if: github.event_name == 'schedule' && env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != ''
        env:
          GHCR_TAG: ${{ steps.meta.outputs.ghcr_tag }}
        shell: bash
        run: |
          dockerhub_tag="${DOCKER_USERNAME,,}/${IMAGE_NAME}:latest"
          docker tag "${GHCR_TAG}" "${dockerhub_tag}"
          docker push "${dockerhub_tag}"

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.71.2
          image-ref: ${{ steps.meta.outputs.ghcr_tag }}
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Upload Trivy scan results
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy-results.sarif
