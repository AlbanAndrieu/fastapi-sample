name: Temporary homelab deadline fix

on:
  push:
    branches:
      - fix/homelab-deadline-cloudflare-unknown

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Apply deterministic source changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected block not found in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          # /healthz must not launch a second all-service homelab fan-out. The
          # dedicated homelab probe endpoint already owns sampled/cached service
          # evidence; legacy global health keeps only the primary TrueNAS check.
          p = Path("nabla/api/homelab_catalog.py")
          text = p.read_text()
          pattern = re.compile(
              r"async def homelab_healthz_probe_rows\(\) -> list\[tuple\[str, str, str, str \| None\]\]:\n"
              r".*?\n    return rows\n\n\n",
              re.S,
          )
          replacement = '''async def homelab_healthz_probe_rows() -> list[tuple[str, str, str, str | None]]:\n    \"\"\"Return only the primary TrueNAS HTTPS check for legacy global health.\n\n    Per-service homelab reachability is sampled, cached and reconciled by\n    ``build_homelab_health_payload``. Re-probing every public homelab endpoint\n    here made those services compete with core dependencies for one 8-second\n    aggregate budget and produced false ``deadline`` failures.\n    \"\"\"\n    configured_truenas_url = truenas_url().rstrip(\"/\") + \"/\"\n    return [\n        (\"albandrieu_truenas\", configured_truenas_url, \"TrueNAS HTTPS\", None),\n    ]\n\n\n'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit("homelab_healthz_probe_rows block not replaced")
          p.write_text(text)

          # Bound Cloudflare Tunnel + Access inventory independently from the
          # aggregate homelab deadline.
          replace_once(
              "nabla/api/homelab_exposure.py",
              '_CLOUDFLARE_EXPOSURE_CACHE_KEY = "cloudflare:exposure"\n',
              '_CLOUDFLARE_EXPOSURE_CACHE_KEY = "cloudflare:exposure"\n_CLOUDFLARE_OBSERVER_TIMEOUT_SEC = 4.0\n',
          )
          replace_once(
              "nabla/api/homelab_exposure.py",
              '            return tuple(await asyncio.to_thread(observe_cloudflare_tunnels)), None\n',
              '            observed = await asyncio.wait_for(\n                asyncio.to_thread(observe_cloudflare_tunnels),\n                timeout=_CLOUDFLARE_OBSERVER_TIMEOUT_SEC,\n            )\n            return tuple(observed), None\n',
          )
          replace_once(
              "nabla/api/homelab_exposure.py",
              '            observed = await asyncio.to_thread(observe_cloudflare_access_applications)\n            return tuple(observed), None\n',
              '            observed = await asyncio.wait_for(\n                asyncio.to_thread(observe_cloudflare_access_applications),\n                timeout=_CLOUDFLARE_OBSERVER_TIMEOUT_SEC,\n            )\n            return tuple(observed), None\n',
          )

          # Explicitly expose whether Cloudflare global state could be confirmed.
          replace_once(
              "nabla/api/homelab_exposure.py",
              '    def summary(self) -> dict[str, Any]:\n        return {\n',
              '    def summary(self) -> dict[str, Any]:\n        status_confirmed = bool(\n            self.configured\n            and not self.tunnel_error\n            and not self.access_error\n            and not self.stale\n        )\n        warning = (\n            None\n            if status_confirmed or not self.configured\n            else \"⚠️ Cloudflare global status could not be confirmed\"\n        )\n        return {\n            \"status_confirmed\": status_confirmed,\n            \"warning\": warning,\n',
          )

          # Cloudflare transport/response uncertainty is diagnostic evidence,
          # not proof that tunnels are down.
          insert_after = '''def _cloudflare_api_error(response: httpx.Response) -> dict[str, Any]:\n'''
          platform = Path("nabla/api/platform_health.py")
          text = platform.read_text()
          marker = '\n\nasync def check_cloudflare_tunnels() -> dict[str, Any]:\n'
          if marker not in text:
              raise SystemExit("Cloudflare check marker missing")
          helper = '''\n\ndef _cloudflare_unconfirmed(\n    reason: str,\n    *,\n    error_kind: str,\n    api_reachable: bool | None,\n    http_status: int | None = None,\n) -> dict[str, Any]:\n    \"\"\"Return non-degrading provider uncertainty with an explicit warning.\"\"\"\n    result: dict[str, Any] = {\n        \"reachable\": None,\n        \"api_reachable\": api_reachable,\n        \"state\": \"unknown\",\n        \"status_confirmed\": False,\n        \"warning\": f\"⚠️ Cloudflare global status could not be confirmed: {reason}\",\n        \"error\": reason,\n        \"error_kind\": error_kind,\n        \"probe\": \"cloudflare_tunnel_api\",\n    }\n    if http_status is not None:\n        result[\"http_status\"] = http_status\n    return result\n'''
          text = text.replace(marker, helper + marker, 1)
          platform.write_text(text)

          replace_once(
              "nabla/api/platform_health.py",
              '''    except (httpx.HTTPError, OSError) as exc:\n        return {\n            \"reachable\": False,\n            \"api_reachable\": False,\n            \"error\": _short_error(exc),\n            \"probe\": \"cloudflare_tunnel_api\",\n        }\n''',
              '''    except (httpx.HTTPError, OSError) as exc:\n        return _cloudflare_unconfirmed(\n            _short_error(exc),\n            error_kind=_http_error_kind(exc),\n            api_reachable=False,\n        )\n''',
          )
          replace_once(
              "nabla/api/platform_health.py",
              '''    except ValueError as exc:\n        return {\n            \"reachable\": False,\n            \"api_reachable\": True,\n            \"http_status\": response.status_code,\n            \"error\": _short_error(exc),\n            \"probe\": \"cloudflare_tunnel_api\",\n        }\n''',
              '''    except ValueError:\n        return _cloudflare_unconfirmed(\n            \"Cloudflare Tunnel API returned invalid JSON\",\n            error_kind=\"invalid_response\",\n            api_reachable=True,\n            http_status=response.status_code,\n        )\n''',
          )
          replace_once(
              "nabla/api/platform_health.py",
              '''    if not isinstance(tunnels, list):\n        return {\n            \"reachable\": False,\n            \"api_reachable\": True,\n            \"error\": \"Cloudflare Tunnel API returned an unexpected payload\",\n            \"probe\": \"cloudflare_tunnel_api\",\n        }\n\n    statuses = [str(tunnel.get(\"status\") or \"unknown\").lower() for tunnel in tunnels if isinstance(tunnel, dict)]\n''',
              '''    if not isinstance(tunnels, list):\n        return _cloudflare_unconfirmed(\n            \"Cloudflare Tunnel API returned an unexpected payload\",\n            error_kind=\"invalid_response\",\n            api_reachable=True,\n            http_status=response.status_code,\n        )\n\n    statuses = [str(tunnel.get(\"status\") or \"unknown\").lower() for tunnel in tunnels if isinstance(tunnel, dict)]\n    if not statuses:\n        return _cloudflare_unconfirmed(\n            \"Cloudflare Tunnel API returned no tunnel inventory\",\n            error_kind=\"empty_inventory\",\n            api_reachable=True,\n            http_status=response.status_code,\n        )\n''',
          )
          replace_once(
              "nabla/api/platform_health.py",
              '''        \"probe\": \"cloudflare_tunnel_api\",\n        \"tunnel_count\": len(statuses),\n''',
              '''        \"probe\": \"cloudflare_tunnel_api\",\n        \"state\": \"warn\" if unhealthy else \"ok\",\n        \"status_confirmed\": True,\n        \"tunnel_count\": len(statuses),\n''',
          )
          replace_once(
              "nabla/api/platform_health.py",
              '''async def get_cloudflare_tunnels_snapshot() -> dict[str, Any]:\n    \"\"\"Use L1/Redis L2 cache for the Cloudflare control-plane query.\"\"\"\n    cached = await get_or_refresh_probe(\n        _CLOUDFLARE_CACHE_KEY,\n        check_cloudflare_tunnels,\n        is_success=lambda value: value.get(\"api_reachable\") is True,\n        policy=_CLOUDFLARE_CACHE_POLICY,\n    )\n    return _cache_with_stale_evidence(cached)\n''',
              '''async def get_cloudflare_tunnels_snapshot() -> dict[str, Any]:\n    \"\"\"Use L1/Redis L2 cache without turning refresh uncertainty into downtime.\"\"\"\n    cached = await get_or_refresh_probe(\n        _CLOUDFLARE_CACHE_KEY,\n        check_cloudflare_tunnels,\n        is_success=lambda value: value.get(\"status_confirmed\") is True,\n        policy=_CLOUDFLARE_CACHE_POLICY,\n    )\n    result = _cache_with_stale_evidence(cached)\n    current = cached.value\n    if current.get(\"status_confirmed\") is False:\n        last_known_reachable = result.get(\"reachable\")\n        result.update(\n            {\n                \"reachable\": None,\n                \"api_reachable\": current.get(\"api_reachable\"),\n                \"state\": \"unknown\",\n                \"status_confirmed\": False,\n                \"warning\": current.get(\"warning\")\n                or \"⚠️ Cloudflare global status could not be confirmed\",\n                \"error\": current.get(\"error\"),\n                \"error_kind\": current.get(\"error_kind\"),\n            }\n        )\n        if last_known_reachable is not None:\n            result[\"last_known_reachable\"] = last_known_reachable\n    return result\n''',
          )

          # An unconfirmed optional Cloudflare provider must not degrade the
          # platform component status, even when last-good evidence is stale.
          replace_once(
              "nabla/api/component_health.py",
              '''    for key in PLATFORM_COMPONENT_KEYS:\n        check = components.get(key, {})\n        if check.get(\"skipped\") is True:\n            continue\n        if check.get(\"reachable\") is False or check.get(\"state\") == \"warn\" or check.get(\"stale\") is True or check.get(\"tls_trusted\") is False:\n            return \"degraded\"\n''',
              '''    for key in PLATFORM_COMPONENT_KEYS:\n        check = components.get(key, {})\n        if check.get(\"skipped\") is True:\n            continue\n        if key == \"cloudflare\" and check.get(\"status_confirmed\") is False:\n            continue\n        if check.get(\"reachable\") is False or check.get(\"state\") == \"warn\" or check.get(\"stale\") is True or check.get(\"tls_trusted\") is False:\n            return \"degraded\"\n''',
          )

          # The optional enrichment wrapper has its own deadline. Preserve the
          # same Cloudflare uncertainty semantics there as well.
          replace_once(
              "nabla/api/health_board.py",
              '''def _failed_optional_check(\n''',
              '''def _cloudflare_unconfirmed_check(\n    *,\n    error: str,\n    error_kind: str,\n    timed_out: bool = False,\n) -> dict[str, Any]:\n    return {\n        \"reachable\": None,\n        \"api_reachable\": None,\n        \"state\": \"unknown\",\n        \"status_confirmed\": False,\n        \"warning\": f\"⚠️ Cloudflare global status could not be confirmed: {error}\",\n        \"timed_out\": timed_out,\n        \"error\": error,\n        \"error_kind\": error_kind,\n        \"probe\": \"cloudflare\",\n    }\n\n\ndef _failed_optional_check(\n''',
          )
          replace_once(
              "nabla/api/health_board.py",
              '''            return {\n                \"cloudflare\": _deadline_check(\"cloudflare\"),\n                \"pfsense\": _deadline_check(\"pfsense\"),\n            }\n''',
              '''            return {\n                \"cloudflare\": _cloudflare_unconfirmed_check(\n                    error=\"optional diagnostic enrichment deadline exceeded\",\n                    error_kind=\"deadline\",\n                    timed_out=True,\n                ),\n                \"pfsense\": _deadline_check(\"pfsense\"),\n            }\n''',
          )
          replace_once(
              "nabla/api/health_board.py",
              '''            return {\n                \"cloudflare\": _failed_optional_check(\"cloudflare\", exc),\n                \"pfsense\": _failed_optional_check(\"pfsense\", exc),\n            }\n''',
              '''            return {\n                \"cloudflare\": _cloudflare_unconfirmed_check(\n                    error=\"optional diagnostic enrichment failed\",\n                    error_kind=\"probe_error\",\n                ),\n                \"pfsense\": _failed_optional_check(\"pfsense\", exc),\n            }\n''',
          )

          # Render the explicit warning text instead of a misleading generic
          # unreachable label while retaining a neutral/unknown health state.
          replace_once(
              "nabla/api/assets/api-health-core.js",
              '''function baseDetailText(key, check) {\n  if (check.skipped)\n    return check.reason || \"Not configured (intentionally disabled).\";\n''',
              '''function baseDetailText(key, check) {\n  if (check.skipped)\n    return check.reason || \"Not configured (intentionally disabled).\";\n  if (check.warning) return String(check.warning);\n''',
          )

          # Regression tests for transport uncertainty and the removed duplicate
          # healthz fan-out.
          test = Path("tests/unit/test_cloudflare_uncertainty.py")
          test.write_text('''\"\"\"Regression tests for non-degrading Cloudflare uncertainty.\"\"\"\n\nimport asyncio\n\nimport httpx\nimport pytest\n\nfrom nabla.api import component_health, health_board, homelab_catalog, homelab_exposure, platform_health\n\n\n@pytest.mark.asyncio\nasync def test_cloudflare_transport_failure_is_unknown_warning(monkeypatch) -> None:\n    monkeypatch.setenv(\"CLOUDFLARE_ACCOUNT_ID\", \"account\")\n    monkeypatch.setenv(\"CLOUDFLARE_API_TOKEN\", \"token\")\n\n    def handler(request: httpx.Request) -> httpx.Response:\n        raise httpx.ConnectTimeout(\"Cloudflare connect timeout\", request=request)\n\n    class FakeAsyncClient(httpx.AsyncClient):\n        def __init__(self, *args, **kwargs) -> None:\n            kwargs[\"transport\"] = httpx.MockTransport(handler)\n            super().__init__(*args, **kwargs)\n\n    monkeypatch.setattr(httpx, \"AsyncClient\", FakeAsyncClient)\n    result = await platform_health.check_cloudflare_tunnels()\n\n    assert result[\"reachable\"] is None\n    assert result[\"state\"] == \"unknown\"\n    assert result[\"status_confirmed\"] is False\n    assert result[\"warning\"].startswith(\"⚠️ Cloudflare global status could not be confirmed\")\n\n\n@pytest.mark.asyncio\nasync def test_cloudflare_empty_inventory_is_unknown_not_down(monkeypatch) -> None:\n    monkeypatch.setenv(\"CLOUDFLARE_ACCOUNT_ID\", \"account\")\n    monkeypatch.setenv(\"CLOUDFLARE_API_TOKEN\", \"token\")\n\n    def handler(request: httpx.Request) -> httpx.Response:\n        return httpx.Response(200, request=request, json={\"success\": True, \"result\": []})\n\n    class FakeAsyncClient(httpx.AsyncClient):\n        def __init__(self, *args, **kwargs) -> None:\n            kwargs[\"transport\"] = httpx.MockTransport(handler)\n            super().__init__(*args, **kwargs)\n\n    monkeypatch.setattr(httpx, \"AsyncClient\", FakeAsyncClient)\n    result = await platform_health.check_cloudflare_tunnels()\n\n    assert result[\"reachable\"] is None\n    assert result[\"error_kind\"] == \"empty_inventory\"\n    assert result[\"status_confirmed\"] is False\n\n\ndef test_unconfirmed_cloudflare_does_not_degrade_platform() -> None:\n    components = {\n        \"postgres\": {\"reachable\": True},\n        \"redis\": {\"reachable\": True},\n        \"supabase\": {\"reachable\": True},\n        \"truenas\": {\"reachable\": True, \"state\": \"ok\", \"tls_trusted\": True},\n        \"cloudflare\": {\n            \"reachable\": None,\n            \"state\": \"unknown\",\n            \"status_confirmed\": False,\n            \"stale\": True,\n        },\n        \"pfsense\": {\"reachable\": True},\n    }\n\n    assert component_health.component_status(components) == \"healthy\"\n\n\ndef test_cloudflare_optional_deadline_is_non_degrading_unknown() -> None:\n    result = health_board._cloudflare_unconfirmed_check(\n        error=\"optional diagnostic enrichment deadline exceeded\",\n        error_kind=\"deadline\",\n        timed_out=True,\n    )\n\n    assert result[\"reachable\"] is None\n    assert result[\"status_confirmed\"] is False\n    assert result[\"timed_out\"] is True\n\n\n@pytest.mark.asyncio\nasync def test_cloudflare_exposure_observers_have_independent_timeout(monkeypatch) -> None:\n    monkeypatch.setattr(homelab_exposure, \"_CLOUDFLARE_OBSERVER_TIMEOUT_SEC\", 0.01)\n\n    async def slow_to_thread(*_args, **_kwargs):\n        await asyncio.sleep(1)\n        return []\n\n    monkeypatch.setattr(homelab_exposure.asyncio, \"to_thread\", slow_to_thread)\n    payload = await homelab_exposure._observe_cloudflare_exposure_origin()\n\n    assert payload[\"tunnel_error\"] == \"TimeoutError\"\n    assert payload[\"access_error\"] == \"TimeoutError\"\n\n\n@pytest.mark.asyncio\nasync def test_legacy_healthz_homelab_rows_only_probe_primary_truenas(monkeypatch) -> None:\n    async def should_not_fetch_services():\n        raise AssertionError(\"global /healthz must not enumerate homelab services\")\n\n    monkeypatch.setattr(homelab_catalog, \"fetch_homelab_services\", should_not_fetch_services)\n    rows = await homelab_catalog.homelab_healthz_probe_rows()\n\n    assert rows == [\n        (\n            \"albandrieu_truenas\",\n            \"https://truenas.albandrieu.com:7000/\",\n            \"TrueNAS HTTPS\",\n            None,\n        )\n    ]\n''')
          PY
      - name: Remove temporary workflow from resulting commit
        run: git rm .github/workflows/tmp-homelab-deadline-fix.yml
      - name: Format and run targeted tests
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --quiet uv
          uv sync --frozen
          uv run pre-commit run ruff-format --files \
            nabla/api/homelab_catalog.py \
            nabla/api/homelab_exposure.py \
            nabla/api/platform_health.py \
            nabla/api/component_health.py \
            nabla/api/health_board.py \
            tests/unit/test_cloudflare_uncertainty.py || true
          uv run pre-commit run prettier --files nabla/api/assets/api-health-core.js || true
          uv run pytest -q \
            tests/unit/test_cloudflare_uncertainty.py \
            tests/unit/test_platform_health.py \
            tests/unit/test_component_health.py \
            tests/unit/test_health_board_stability.py \
            tests/unit/test_homelab_health.py
      - name: Commit and push fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(health): bound homelab probes and Cloudflare uncertainty"
          git push
