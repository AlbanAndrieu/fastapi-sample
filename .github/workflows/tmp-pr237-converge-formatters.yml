---
name: Temporary PR237 formatter convergence

on:
  push:
    branches:
      - fix/generic-service-restricted-security
    paths:
      - .github/workflows/tmp-pr237-converge-formatters.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  converge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/generic-service-restricted-security
          fetch-depth: 0

      - name: Fix known EOF formatter mutation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("docs/engineering-roadmap.md")
          text = path.read_text(encoding="utf-8")
          path.write_text(text.rstrip("\n") + "\n", encoding="utf-8")
          PY
          git diff --check
          git config user.name openai-agent
          git config user.email openai-agent@users.noreply.github.com
          git add docs/engineering-roadmap.md
          if git diff --cached --quiet; then
            echo "Roadmap EOF already canonical."
            exit 0
          fi
          git commit -m "chore(ci): normalize roadmap EOF"
          git push origin HEAD:fix/generic-service-restricted-security
