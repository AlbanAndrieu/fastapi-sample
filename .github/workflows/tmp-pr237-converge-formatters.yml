---
name: Temporary PR237 formatter convergence

on:
  push:
    branches:
      - fix/generic-service-restricted-security
    paths:
      - .github/workflows/tmp-pr237-converge-formatters.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  converge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/generic-service-restricted-security
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.1"
          python-version: "3.13"
          enable-cache: true

      - name: Converge auto-fixable canonical hooks
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen
          uv pip install pre-commit==4.6.2
          mapfile -t changed < <(git diff --name-only origin/master...HEAD | grep -v '^\.github/workflows/tmp-pr237-converge-formatters\.yml$')
          if (( ${#changed[@]} == 0 )); then
            exit 0
          fi
          for pass in 1 2 3; do
            echo "formatter pass ${pass}"
            pre-commit run --files "${changed[@]}" || true
            git diff --check || true
          done
          git config user.name openai-agent
          git config user.email openai-agent@users.noreply.github.com
          git add -- "${changed[@]}"
          if git diff --cached --quiet; then
            echo "No formatter mutations to publish."
            exit 0
          fi
          git commit -m "chore(ci): converge canonical PR237 formatters"
          git push origin HEAD:fix/generic-service-restricted-security
