name: Temporary finish health UI

on:
  push:
    branches:
      - fix/functional-probe-runtime-ui

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/functional-probe-runtime-ui
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.1"
          enable-cache: true
      - name: Add dynamic runtime version comparison
        shell: bash
        run: |
          cat > nabla/api/runtime_version.py <<'PY'
          """Non-blocking local-runtime comparison against FastAPI Cloud."""

          from __future__ import annotations

          import os
          import re
          from typing import Any

          import httpx
          from packaging.version import InvalidVersion, Version

          _DEFAULT_CLOUD_LIVEZ = "https://fastapi-sample.fastapicloud.dev/livez"
          _VERSION_RE = re.compile(r"(?P<version>\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?)")
          _VERSION_TIMEOUT_SEC = 2.5


          def normalized_version(value: object) -> str | None:
              raw = str(value or "").strip()
              match = _VERSION_RE.search(raw)
              return match.group("version") if match else None


          def version_is_behind(local: object, remote: object) -> bool | None:
              local_value = normalized_version(local)
              remote_value = normalized_version(remote)
              if local_value is None or remote_value is None:
                  return None
              try:
                  return Version(local_value) < Version(remote_value)
              except InvalidVersion:
                  return None


          async def fetch_cloud_version_status(local_version: object) -> dict[str, Any]:
              target = (
                  os.getenv("FASTAPI_CLOUD_LIVEZ_URL", _DEFAULT_CLOUD_LIVEZ).strip()
                  or _DEFAULT_CLOUD_LIVEZ
              )
              local = normalized_version(local_version) or str(local_version)
              try:
                  timeout = httpx.Timeout(_VERSION_TIMEOUT_SEC)
                  async with httpx.AsyncClient(
                      timeout=timeout,
                      follow_redirects=True,
                  ) as client:
                      response = await client.get(
                          target,
                          headers={"Accept": "application/json"},
                      )
                      response.raise_for_status()
                      payload = response.json()
              except (httpx.HTTPError, OSError, ValueError) as exc:
                  return {
                      "local_version": local,
                      "cloud_version": None,
                      "behind": None,
                      "status_confirmed": False,
                      "warning": "FastAPI Cloud version could not be confirmed",
                      "error_kind": type(exc).__name__,
                  }

              cloud_raw = payload.get("version") if isinstance(payload, dict) else None
              cloud = normalized_version(cloud_raw)
              behind = version_is_behind(local, cloud)
              return {
                  "local_version": local,
                  "cloud_version": cloud,
                  "behind": behind,
                  "status_confirmed": cloud is not None and behind is not None,
                  "update_recommended": behind is True,
              }
          PY

          cat > nabla/api/assets/api-runtime-version.js <<'JS'
          const VERSION_REFRESH_MS = 5 * 60 * 1000;

          function warningElement() {
            return document.getElementById("runtime-version-warning");
          }

          export async function loadRuntimeVersionStatus() {
            const warning = warningElement();
            if (!warning) return;
            try {
              const response = await fetch("/api/runtime/version-status", {
                cache: "no-store",
                headers: { Accept: "application/json" },
              });
              if (!response.ok) throw new Error(`HTTP ${response.status}`);
              const data = await response.json();
              if (data?.behind === true && data?.cloud_version) {
                warning.hidden = false;
                warning.textContent = "⚠️";
                warning.title = `Local service ${data.local_version} is behind FastAPI Cloud ${data.cloud_version}. Update the TrueNAS service.`;
                warning.setAttribute("aria-label", warning.title);
                return;
              }
              warning.hidden = true;
              warning.removeAttribute("title");
              warning.removeAttribute("aria-label");
            } catch {
              warning.hidden = true;
            }
          }

          export function startRuntimeVersionMonitor() {
            loadRuntimeVersionStatus();
            window.setInterval(loadRuntimeVersionStatus, VERSION_REFRESH_MS);
          }
          JS

          cat > tests/unit/test_runtime_version.py <<'PY'
          import httpx
          import pytest

          from nabla.api import runtime_version


          def test_version_comparison_normalizes_runtime_prefix() -> None:
              assert runtime_version.normalized_version("v0+1.13.15") == "1.13.15"
              assert runtime_version.version_is_behind("1.13.12", "v0+1.13.15") is True
              assert runtime_version.version_is_behind("1.13.15", "v0+1.13.15") is False


          @pytest.mark.asyncio
          async def test_cloud_version_failure_is_non_blocking(monkeypatch) -> None:
              class Client:
                  async def __aenter__(self):
                      return self

                  async def __aexit__(self, *_args):
                      return None

                  async def get(self, *_args, **_kwargs):
                      raise httpx.ConnectTimeout("timeout")

              monkeypatch.setattr(
                  runtime_version.httpx,
                  "AsyncClient",
                  lambda **_kwargs: Client(),
              )
              result = await runtime_version.fetch_cloud_version_status("1.13.12")
              assert result["behind"] is None
              assert result["status_confirmed"] is False
              assert result["warning"]
          PY

          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = 1) -> None:
              target = Path(path)
              text = target.read_text()
              assert old in text, f"missing anchor in {path}: {old[:120]!r}"
              target.write_text(text.replace(old, new, count))

          path = "nabla/api/health_routes.py"
          anchor = '    @app.get(\n        "/api/runtime/topology",\n'
          route = '''    @app.get(\n        "/api/runtime/version-status",\n        tags=["Health", "Runtime"],\n        summary="Compare this runtime with FastAPI Cloud",\n    )\n    async def get_runtime_version_status(response: Response) -> dict[str, Any]:\n        from nabla.api.runtime_version import fetch_cloud_version_status\n\n        response.headers.update(_NO_STORE_HEADERS)\n        return await fetch_cloud_version_status(app.version)\n\n'''
          replace(path, anchor, route + anchor)

          path = "nabla/api/ui.py"
          replace(
              path,
              '<p class="subtitle">FastAPI runtime · version <strong>{app_version}</strong></p>',
              '<p class="subtitle">FastAPI runtime · version <strong id="runtime-version-value">{app_version}</strong> <span class="runtime-version-warning" id="runtime-version-warning" hidden>⚠️</span></p>',
          )

          path = "nabla/api/assets/api-health.js"
          replace(
              path,
              'import { loadRuntimeTopology } from "./api-runtime.js";\n',
              'import { loadRuntimeTopology } from "./api-runtime.js";\nimport { startRuntimeVersionMonitor } from "./api-runtime-version.js";\n',
          )
          replace(
              path,
              "startProbeAgeTicker();\nloadHealthBoards();\n",
              "startProbeAgeTicker();\nstartRuntimeVersionMonitor();\nloadHealthBoards();\n",
          )
          PY
      - name: Wire per-service runtime and probe evidence
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("nabla/api/assets/api-service-groups.js")
          text = path.read_text()
          import_anchor = '} from "./api-service-classification.js";\n'
          assert import_anchor in text
          text = text.replace(
              import_anchor,
              import_anchor + 'import { decorateServiceProbeEvidence } from "./api-service-probes.js";\n',
              1,
          )
          text = text.replace(
              "function assignRows(rows, checks, topologyData) {",
              "function assignRows(rows, checks, topologyData, platformMetrics = null) {",
              1,
          )
          old = "    decorateRow(row, presentation, check);\n"
          new = '''    decorateRow(row, presentation, check);\n    decorateServiceProbeEvidence(row, check, {\n      serviceId: node?.id || candidateIdFromKey(key),\n      platformMetrics,\n    });\n'''
          assert old in text
          text = text.replace(old, new, 1)
          text = text.replace(
              "  const buckets = assignRows(rows, data?.checks || {}, topologyData);",
              "  const buckets = assignRows(\n    rows,\n    data?.checks || {},\n    topologyData,\n    platformMetrics,\n  );",
              1,
          )
          path.write_text(text)
          PY

          cat >> nabla/api/assets/api-service-probes.css <<'CSS'

          .runtime-version-warning {
            display: inline-flex;
            align-items: center;
            margin-left: 0.2rem;
            cursor: help;
            color: #ffd966;
            font-size: 0.9em;
            vertical-align: baseline;
          }
          CSS
      - name: Enrich TrueNAS traffic flow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("nabla/api/assets/api-truenas.js")
          text = path.read_text()
          text = text.replace(
              '''function stageClass(stage) {\n  if (stage?.state === "ok") return "ok";\n  if (stage?.state === "fail") return "fail";\n  return "blocked";\n}\n\nfunction stageIcon(stage) {\n  if (stage?.state === "ok") return "●";\n  if (stage?.state === "fail") return "💀";\n  return "⊘";\n}\n''',
              '''function stageClass(stage) {\n  if (stage?.state === "ok") return "ok";\n  if (stage?.state === "fail") return "fail";\n  if (stage?.state === "warn") return "warn";\n  return "blocked";\n}\n\nfunction stageIcon(stage) {\n  if (stage?.state === "ok") return "●";\n  if (stage?.state === "fail") return "💀";\n  if (stage?.state === "warn") return "⚠";\n  return "⊘";\n}\n''',
              1,
          )
          text = text.replace(
              '  const broken = left?.state !== "ok" || right?.state !== "ok";\n',
              '  const broken = [left?.state, right?.state].some((state) => state === "fail" || state === "blocked");\n',
              1,
          )
          start = text.index("function targetText(truenas) {")
          end = text.index("\n\nfunction filterIcon", start)
          target_helpers = '''function normalizedTarget(value) {\n  const target = String(value || "").trim();\n  if (!target) return "";\n  return /^https?:\\/\\//i.test(target) ? target : `https://${target}`;\n}\n\nfunction dnsResolved(diagnostics) {\n  const dns = Array.isArray(diagnostics?.stages)\n    ? diagnostics.stages.find((stage) => stage?.id === "dns")\n    : null;\n  return Array.isArray(dns?.resolved) ? dns.resolved.filter(Boolean) : [];\n}\n\nfunction targetText(truenas) {\n  const diagnostics = truenas?.diagnostics;\n  const configuredTarget = normalizedTarget(\n    diagnostics?.target || truenas?.public?.url || "TrueNAS",\n  );\n  const resolved = dnsResolved(diagnostics);\n  const resolution = resolved.length ? ` → ${resolved.join(", ")}` : "";\n  if (diagnostics?.path_mode === "direct_lan") {\n    return `${configuredTarget}${resolution} · direct LAN / runtime host resolution · hostname retained for TLS/SNI`;\n  }\n  const wan = diagnostics?.wan;\n  if (!wan?.ipv4)\n    return `${configuredTarget}${resolution} · TrueNAS HTTPS listener + TrueNAS API (WebSocket /api/current)`;\n  const provider = wan?.provider ? ` · ${wan.provider}` : "";\n  const addressKind = wan?.static ? " static IPv4" : " IPv4";\n  return `${configuredTarget}${resolution} · public API path via pfSense/HAProxy · ${wan.ipv4}${provider}${addressKind}`;\n}\n\nfunction targetStage(data, measuredStages) {\n  const diagnostics = data?.truenas?.diagnostics || {};\n  const configuredTarget = normalizedTarget(\n    diagnostics?.target || data?.truenas?.public?.url || "",\n  );\n  const dns = measuredStages.find((stage) => stage?.id === "dns");\n  const resolved = Array.isArray(dns?.resolved) ? dns.resolved.filter(Boolean) : [];\n  const direct = diagnostics?.path_mode === "direct_lan";\n  return {\n    id: "target_url",\n    label: "TrueNAS target URL",\n    state: configuredTarget ? (dns?.state === "fail" ? "fail" : "ok") : "warn",\n    detail: [\n      configuredTarget || "target not configured",\n      resolved.length ? `resolved ${resolved.join(", ")}` : "resolution not confirmed",\n      direct\n        ? "direct LAN/runtime host resolution; no Cloudflare DNS or pfSense WAN hop"\n        : "public WAN path",\n    ].join(" · "),\n  };\n}\n\nfunction pfsenseControlStage(data) {\n  const posture = data?.pfsense?.dns || {};\n  const services = Array.isArray(posture?.services) ? posture.services : [];\n  const resolver = posture?.resolver || {};\n  const serviceSummary = services\n    .slice(0, 8)\n    .map((row) => `${row?.identity || "service"} ${row?.runtime_state || "unknown"}`)\n    .join(", ");\n  const hasPolicyEvidence =\n    posture?.policy_state && posture.policy_state !== "unknown";\n  const state =\n    posture?.reachable === true\n      ? "ok"\n      : hasPolicyEvidence || services.length > 0 || resolver?.running != null\n        ? "warn"\n        : "warn";\n  const liveness =\n    posture?.reachable === true\n      ? "API liveness reachable"\n      : posture?.reachable === false\n        ? `API liveness failed${posture?.error ? `: ${posture.error}` : ""}`\n        : "API liveness not confirmed";\n  const unbound =\n    resolver?.running === true\n      ? "Unbound running"\n      : resolver?.running === false\n        ? "Unbound stopped"\n        : "Unbound unknown";\n  return {\n    id: "pfsense_lan_control",\n    label: "pfSense LAN control + DNS",\n    state,\n    detail: [\n      posture?.target || "pfSense target unavailable",\n      liveness,\n      unbound,\n      serviceSummary,\n      "out of path for direct TrueNAS LAN traffic",\n    ]\n      .filter(Boolean)\n      .join(" · "),\n  };\n}\n\nfunction cloudflareTunnelStage(data) {\n  const rows = Array.isArray(data?.services) ? data.services : [];\n  const truenas = rows.find((row) => {\n    const id = String(row?.id || "").toLowerCase();\n    const name = String(row?.name || "").toLowerCase();\n    return id === "truenas" || name === "truenas";\n  });\n  const status = String(truenas?.tunnel_status || "").trim();\n  const normalized = status.toUpperCase();\n  const healthy = ["HEALTHY", "ACTIVE", "UP", "CONNECTED", "RUNNING"].includes(normalized);\n  const down = ["DOWN", "INACTIVE", "STOPPED", "FAILED", "UNHEALTHY"].includes(normalized);\n  const stale = truenas?.tunnel_stale === true;\n  return {\n    id: "cloudflare_tunnel",\n    label: "Cloudflare Tunnel",\n    state: stale || !status ? "warn" : healthy ? "ok" : down ? "fail" : "warn",\n    detail: !status\n      ? "Cloudflare tunnel status not confirmed; optional observation, no TrueNAS downgrade"\n      : `${truenas?.tunnel_name || "tunnel"} · ${status}${stale ? " · stale" : ""}${data?.truenas?.diagnostics?.path_mode === "direct_lan" ? " · out of path for direct LAN" : ""}`,\n  };\n}\n'''
          text = text[:start] + target_helpers + text[end:]

          start = text.index("function trafficStages(data, stages) {")
          end = text.index("\n\nfunction ensureIngressBlock", start)
          traffic = '''function trafficStages(data, stages) {\n  const pathMode = data?.truenas?.diagnostics?.path_mode;\n  const output = [targetStage(data, stages)];\n  if (pathMode === "direct_lan") {\n    output.push(...stages);\n    output.push(pfsenseControlStage(data));\n    output.push(cloudflareTunnelStage(data));\n    return output;\n  }\n\n  let inserted = false;\n  for (const stage of stages) {\n    output.push(stage);\n    if (!inserted && stage?.id === "dns") {\n      output.push(ingressPolicyStage(data, stages));\n      inserted = true;\n    }\n  }\n  if (!inserted) output.splice(1, 0, ingressPolicyStage(data, stages));\n  output.push(cloudflareTunnelStage(data));\n  return output;\n}\n'''
          text = text[:start] + traffic + text[end:]

          render_anchor = "function render(data) {\n"
          helpers = '''function pfsenseServiceTone(state) {\n  const value = String(state || "").toLowerCase();\n  if (["running", "up", "active", "healthy"].includes(value)) return "ok";\n  if (["stopped", "down", "failed", "unhealthy"].includes(value)) return "fail";\n  return "warn";\n}\n\nfunction ensurePfsenseServices(pipeline) {\n  let container = document.getElementById("truenas-pfsense-services");\n  if (container || !pipeline) return container;\n  container = document.createElement("div");\n  container.id = "truenas-pfsense-services";\n  container.className = "truenas-pfsense-services";\n  pipeline.insertAdjacentElement("afterend", container);\n  return container;\n}\n\nfunction renderPfsenseServices(data, pipeline) {\n  const container = ensurePfsenseServices(pipeline);\n  if (!container) return;\n  const posture = data?.pfsense?.dns || {};\n  const services = Array.isArray(posture?.services) ? posture.services : [];\n  const resolver = posture?.resolver || {};\n  const rows = [...services];\n  if (!rows.some((row) => String(row?.identity || "").toLowerCase().includes("unbound"))) {\n    rows.unshift({\n      identity: "Unbound / DNS Resolver",\n      runtime_state:\n        resolver?.running === true\n          ? "running"\n          : resolver?.running === false\n            ? "stopped"\n            : "unknown",\n    });\n  }\n  if (rows.length === 0 && posture?.configured !== true) {\n    container.hidden = true;\n    container.innerHTML = "";\n    return;\n  }\n  container.hidden = false;\n  const chips = rows\n    .map((row) => {\n      const value = row?.runtime_state || "unknown";\n      const tone = pfsenseServiceTone(value);\n      return `<span class="truenas-pfsense-service truenas-pfsense-service--${tone}">${escapeText(row?.identity || "service")} · ${escapeText(value)}</span>`;\n    })\n    .join("");\n  const warning = posture?.warning || posture?.error;\n  container.innerHTML =\n    `<strong>🧱 pfSense services / DNS</strong>` +\n    `<div class="truenas-pfsense-service-list">${chips}</div>` +\n    (warning ? `<span class="truenas-pfsense-service-warning">⚠ ${escapeText(warning)}</span>` : "");\n}\n\n'''
          assert render_anchor in text
          text = text.replace(render_anchor, helpers + render_anchor, 1)
          text = text.replace(
              "  renderProbeFanout(data);\n",
              "  renderProbeFanout(data);\n  renderPfsenseServices(data, pipeline);\n",
              1,
          )
          text = text.replace(
              '  if (ingressBlock?.state === "blocked") {\n',
              '  const ingressIsInline = truenas?.diagnostics?.path_mode !== "direct_lan";\n  if (ingressIsInline && ingressBlock?.state === "blocked") {\n',
              1,
          )
          text = text.replace(
              '''    probe_summary: probes?.probe_summary || aggregate?.probe_summary,\n    internal_services:\n''',
              '''    probe_summary: probes?.probe_summary || aggregate?.probe_summary,\n    pfsense:\n      aggregate?.pfsense?.dns != null\n        ? aggregate.pfsense\n        : probes?.pfsense || aggregate?.pfsense,\n    internal_services:\n''',
              1,
          )
          path.write_text(text)
          PY

          cat >> nabla/api/assets/api-truenas.css <<'CSS'

          .truenas-stage--warn {
            border-color: rgba(255, 204, 51, 0.5);
            background: rgba(255, 204, 51, 0.05);
          }

          .truenas-stage--warn .truenas-stage-icon,
          .truenas-stage--warn .truenas-stage-label {
            color: #ffd966;
          }

          .truenas-pfsense-services {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.45rem;
            margin: 0.65rem 0;
            padding: 0.55rem 0.65rem;
            border: 1px solid #303030;
            border-radius: 8px;
            background: #0b0b0b;
            font-size: 0.65rem;
          }

          .truenas-pfsense-service-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem;
          }

          .truenas-pfsense-service {
            padding: 0.1rem 0.35rem;
            border: 1px solid #3b3b3b;
            border-radius: 999px;
          }

          .truenas-pfsense-service--ok { color: #72f5b5; border-color: rgba(0, 255, 136, 0.42); }
          .truenas-pfsense-service--warn { color: #ffd966; border-color: rgba(255, 204, 51, 0.48); }
          .truenas-pfsense-service--fail { color: #ff8b8b; border-color: rgba(255, 68, 68, 0.55); }
          .truenas-pfsense-service-warning { flex-basis: 100%; color: #ffd966; }
          CSS
      - name: Add UI contract tests
        shell: bash
        run: |
          cat > tests/unit/test_runtime_version_ui_contract.py <<'PY'
          from pathlib import Path


          def test_runtime_version_warning_is_dynamic_and_non_blocking() -> None:
              ui = Path("nabla/api/ui.py").read_text()
              javascript = Path("nabla/api/assets/api-runtime-version.js").read_text()
              health = Path("nabla/api/assets/api-health.js").read_text()
              routes = Path("nabla/api/health_routes.py").read_text()

              assert 'id="runtime-version-warning"' in ui
              assert "/api/runtime/version-status" in javascript
              assert "behind === true" in javascript
              assert "Update the TrueNAS service" in javascript
              assert "startRuntimeVersionMonitor" in health
              assert '"/api/runtime/version-status"' in routes


          def test_truenas_flow_shows_target_pfsense_services_and_cloudflare_last() -> None:
              javascript = Path("nabla/api/assets/api-truenas.js").read_text()
              assert 'label: "TrueNAS target URL"' in javascript
              assert 'label: "pfSense LAN control + DNS"' in javascript
              assert 'label: "Cloudflare Tunnel"' in javascript
              assert "renderPfsenseServices" in javascript
              assert 'output.push(cloudflareTunnelStage(data));' in javascript
              assert "no Cloudflare DNS or pfSense WAN hop" in javascript
          PY

          cat >> tests/unit/test_service_probe_ui_contract.py <<'PY'


          def test_service_grouping_wires_probe_evidence_decorator() -> None:
              javascript = Path("nabla/api/assets/api-service-groups.js").read_text()
              assert "decorateServiceProbeEvidence" in javascript
              assert "platformMetrics" in javascript
          PY
      - name: Format and targeted tests
        shell: bash
        run: |
          uv sync --frozen
          uv run ruff format \
            nabla/api/runtime_version.py \
            nabla/api/health_routes.py \
            tests/unit/test_runtime_version.py \
            tests/unit/test_runtime_version_ui_contract.py \
            tests/unit/test_service_probe_ui_contract.py
          uv run ruff check --fix \
            nabla/api/runtime_version.py \
            nabla/api/health_routes.py \
            tests/unit/test_runtime_version.py \
            tests/unit/test_runtime_version_ui_contract.py \
            tests/unit/test_service_probe_ui_contract.py
          uv run pytest -q \
            tests/unit/test_runtime_version.py \
            tests/unit/test_runtime_version_ui_contract.py \
            tests/unit/test_service_probe_ui_contract.py \
            tests/unit/test_homelab_monitoring.py \
            tests/unit/test_runtime_container_evidence.py \
            tests/unit/test_pfsense_dns_observer.py \
            tests/unit/test_homelab_health.py
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/tmp-finish-health-ui.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat(health): finish probe evidence and runtime flow UI"
          git push
