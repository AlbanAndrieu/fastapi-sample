name: Regenerate runtime observability dependencies

on:
  push:
    branches:
      - feat/mcp-streamable-http-outbound
    paths:
      - .github/workflows/regen-runtime-otel.yml

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feat/mcp-streamable-http-outbound
          persist-credentials: true
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          python-version: "3.12"
      - name: Promote direct observability imports
        run: >-
          uv add
          'psutil>=7.0.0'
          'prometheus-client>=0.21.1'
          'opentelemetry-api>=1.33.1'
          'opentelemetry-sdk>=1.33.1'
          'opentelemetry-exporter-otlp-proto-grpc>=1.33.1'
          'opentelemetry-instrumentation-fastapi>=0.49b1'
          'opentelemetry-instrumentation-logging>=0.49b1'
      - name: Commit runtime manifest and lock
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pyproject.toml uv.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix(runtime): declare direct observability dependencies'
          git push origin HEAD:feat/mcp-streamable-http-outbound
