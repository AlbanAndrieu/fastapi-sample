name: Temporary pre-commit YAML formatting

on:
  push:
    branches:
      - fix/truenas-runtime-binding-evidence

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install pre-commit
        run: python -m pip install --disable-pip-version-check --quiet pre-commit==4.6.2
      - name: Apply canonical Prettier hook to pre-commit config
        continue-on-error: true
        run: pre-commit run prettier --files .pre-commit-config.yaml
      - name: Commit canonical formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .pre-commit-config.yaml
          git commit -m "style(ci): canonicalize pre-commit YAML"
          git push
