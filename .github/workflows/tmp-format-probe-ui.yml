name: Temporary converge probe UI formatters

on:
  push:
    branches:
      - fix/homelab-probe-budget-cloudflare-unknown

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/homelab-probe-budget-cloudflare-unknown
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.1"
          enable-cache: true
      - name: Install quality environment
        run: |
          uv sync --frozen
          uv pip install pre-commit==4.6.2
      - name: Apply repository quality fixes
        continue-on-error: true
        run: bash scripts/agent-quality-gate.sh --fix
      - name: Remove temporary workflow
        run: git rm .github/workflows/tmp-format-probe-ui.yml
      - name: Commit canonical formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git commit -m "style(health): converge probe telemetry formatters"
          git push
