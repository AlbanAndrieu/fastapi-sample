name: Prepare release 1.4.0 locks

on:
  push:
    branches:
      - chore/prepare-1.4.0-release

permissions:
  contents: write

jobs:
  sync-locks:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: chore/prepare-1.4.0-release
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.1'
          python-version: '3.13'

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'

      - name: Regenerate Python lock metadata
        run: uv lock

      - name: Regenerate npm lock metadata
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -s package-lock.json ]]; then
            rm -f package-lock.json
          fi
          npm install --package-lock-only --ignore-scripts

      - name: Commit synchronized lock files
        shell: bash
        run: |
          set -euo pipefail
          git add uv.lock package-lock.json
          if git diff --cached --quiet; then
            echo 'Lock files already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(release): sync 1.4.0 lock metadata [skip ci]'
          git push origin HEAD:chore/prepare-1.4.0-release
