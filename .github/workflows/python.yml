---
name: Python package

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: python-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build Python package
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: "3.12"
      TRUNK_API_TOKEN: ${{ secrets.TRUNK_API_TOKEN }}
      KEYCLOAK_SERVER_URL: http://localhost:8080
      KEYCLOAK_REALM: test
      KEYCLOAK_CLIENT_ID: test
      KEYCLOAK_CLIENT_SECRET: test-secret
      OAUTH_TOKEN_SECRET: mocked-oauth-token-secret
      METRICS_ENABLED: "false"
      LOGFIRE_ENABLED: "false"
      LOGFIRE_ENVIRONMENT: test
      LOGFIRE_TOKEN: ""
      SENTRY_ENABLED: "false"
      SENTRY_DSN: ""
      SENTRY_ENVIRONMENT: test
      SENTRY_RELEASE: ci-${{ github.sha }}
      DATADOG_ENABLED: "false"
      DD_TRACE_ENABLED: "false"
      DD_PROFILING_ENABLED: "false"
      DD_LOGS_INJECTION: "false"
      DD_APPSEC_ENABLED: "false"
      DD_IAST_ENABLED: "false"
      UNLEASH_ENABLED: "false"
      STATSIG_ENABLED: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feat/mcp-streamable-http-outbound
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Check modified Python file sizes
        shell: bash
        run: |
          mapfile -t changed_python < <(
            git diff --name-only --diff-filter=ACMR "origin/${GITHUB_BASE_REF}...HEAD" -- '*.py'
          )
          if (( ${#changed_python[@]} )); then
            python scripts/check_code_size.py \
              --baseline-ref "origin/${GITHUB_BASE_REF}" \
              "${changed_python[@]}"
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}
          version: "0.12.1"

      - name: Repair runtime manifest
        shell: bash
        run: |
          git checkout 1c39809dfdba629b99280ced5659816d9eca0e79 -- nabla/config_settings.py
          uv add \
            'structlog>=25.4.0' \
            'fastapi-featureflags>=0.4.7' \
            'slowapi>=0.1.9' \
            'plotly>=6.0.0' \
            'polars>=1.31.0' \
            'psycopg[pool]>=3.2.0' \
            'sqlmodel>=0.0.24' \
            'passlib[bcrypt]>=1.7.4' \
            'pyjwt>=2.7.0' \
            'langfuse==2.59.7' \
            'pyroscope-io>=0.8.5' \
            'pytz>=2025.2' \
            'gunicorn>=23.0.0'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nabla/config_settings.py pyproject.toml uv.lock
          if ! git diff --cached --quiet; then
            git commit -m 'fix(runtime): declare direct startup dependencies'
            git push origin HEAD:feat/mcp-streamable-http-outbound
          fi

      - name: Validate minimal FastAPI Cloud runtime
        env:
          UV_PROJECT_ENVIRONMENT: .venv-runtime
        run: |
          uv sync --frozen --no-default-groups
          .venv-runtime/bin/python -c "import nabla.main"

      - name: Resolve and install project dependencies
        run: uv sync

      - name: Check release version consistency
        run: uv run python scripts/check_versions.py

      - name: Ruff critical checks
        run: uv run ruff check server_app.py nabla --select=E9,F63,F7,F82

      - name: Pylint quality gate
        run: >-
          uv run pylint
          --fail-under=9.5
          --disable=E1701,E0102,E1003
          server_app.py nabla

      - name: Bandit security report
        run: uv run bandit -r nabla server_app.py --exit-zero

      - name: Run tests
        run: uv run pytest --junit-xml=junit.xml

      - name: Build package
        run: uv build

      - name: Upload test results to Trunk.io
        if: ${{ !cancelled() && env.TRUNK_API_TOKEN != '' }}
        continue-on-error: true
        uses: trunk-io/analytics-uploader@0e6c416c9d47c105654657984e5e4f0506dd84aa # v1
        with:
          junit-paths: "**/junit.xml"
          org-slug: alban
          token: ${{ env.TRUNK_API_TOKEN }}

  sonarcloud:
    name: Scan with SonarCloud
    needs: build
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: SonarCloud Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}

  docker:
    name: Docker CI
    needs: build
    permissions:
      contents: read
      packages: write
      security-events: write
    uses: ./.github/workflows/docker-build.yml
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      CI_PIP_GITLABNABLA_TOKEN: ${{ secrets.CI_PIP_GITLABNABLA_TOKEN }}

  mega-linter:
    name: MegaLinter
    needs: build
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
      issues: write
      statuses: write
      security-events: write
    uses: ./.github/workflows/mega-linter.yml
