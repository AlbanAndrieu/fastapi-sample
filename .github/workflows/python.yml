---
name: Python package

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: "3.12"
      TRUNK_API_TOKEN: ${{ secrets.TRUNK_API_TOKEN }}
      KEYCLOAK_SERVER_URL: http://localhost:8080
      KEYCLOAK_REALM: test
      KEYCLOAK_CLIENT_ID: test
      KEYCLOAK_CLIENT_SECRET: test-secret
      METRICS_ENABLED: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}
          version: "0.12.1"

      - name: Resolve and install project dependencies
        run: uv sync

      - name: Check release version consistency
        run: uv run python scripts/check_versions.py

      - name: Ruff critical checks
        run: uv run ruff check server_app.py nabla --select=E9,F63,F7,F82

      - name: Pylint quality gate
        run: >-
          uv run pylint
          --fail-under=9.5
          --disable=E1701,E0102,E1003
          server_app.py nabla

      - name: Bandit security report
        run: uv run bandit -r nabla server_app.py --exit-zero

      - name: Run tests
        run: uv run pytest --junit-xml=junit.xml

      - name: Build package
        run: uv build

      - name: Upload test results to Trunk.io
        if: ${{ !cancelled() && env.TRUNK_API_TOKEN != '' }}
        continue-on-error: true
        uses: trunk-io/analytics-uploader@0e6c416c9d47c105654657984e5e4f0506dd84aa # v1
        with:
          junit-paths: "**/junit.xml"
          org-slug: alban
          token: ${{ env.TRUNK_API_TOKEN }}

  sonarcloud:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: SonarCloud Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
