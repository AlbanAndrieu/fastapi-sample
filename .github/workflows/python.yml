---
name: Python package

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: python-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build Python package
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: "3.13"
      TRUNK_API_TOKEN: ${{ secrets.TRUNK_API_TOKEN }}
      KEYCLOAK_SERVER_URL: http://localhost:8080
      KEYCLOAK_REALM: test
      KEYCLOAK_CLIENT_ID: test
      KEYCLOAK_CLIENT_SECRET: test-secret
      OAUTH_TOKEN_SECRET: mocked-oauth-token-secret
      METRICS_ENABLED: "false"
      LOGFIRE_ENABLED: "false"
      LOGFIRE_ENVIRONMENT: test
      LOGFIRE_TOKEN: ""
      SENTRY_ENABLED: "false"
      SENTRY_DSN: ""
      SENTRY_ENVIRONMENT: test
      SENTRY_RELEASE: ci-${{ github.sha }}
      DATADOG_ENABLED: "false"
      DD_TRACE_ENABLED: "false"
      DD_PROFILING_ENABLED: "false"
      DD_LOGS_INJECTION: "false"
      DD_APPSEC_ENABLED: "false"
      DD_IAST_ENABLED: "false"
      UNLEASH_ENABLED: "false"
      STATSIG_ENABLED: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Check modified Python file sizes
        shell: bash
        run: |
          mapfile -t changed_python < <(
            git diff --name-only --diff-filter=ACMR "origin/${GITHUB_BASE_REF}...HEAD" -- '*.py'
          )
          if (( ${#changed_python[@]} )); then
            python scripts/check_code_size.py \
              --baseline-ref "origin/${GITHUB_BASE_REF}" \
              "${changed_python[@]}"
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}
          version: "0.12.1"

      - name: Refresh Python 3.13 lock
        if: github.head_ref == 'fix/fastapi-cloud-python-313'
        env:
          UV_PYTHON: "3.13"
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("pyproject.toml")
          path.write_text(path.read_text().rstrip("\n") + "\n")
          PY
          uv lock --upgrade-package numpy
          uv lock --check
          python - <<'PY'
          import re
          from pathlib import Path

          text = Path("uv.lock").read_text()
          match = re.search(r'\[\[package\]\]\nname = "numpy"\nversion = "([^"]+)"', text)
          if not match:
              raise SystemExit("NumPy entry not found in uv.lock")
          major, minor = (int(part) for part in match.group(1).split(".")[:2])
          if (major, minor) < (2, 1):
              raise SystemExit(f"NumPy {match.group(1)} is incompatible with Python 3.13 wheels")
          print(f"Locked NumPy {match.group(1)} for Python 3.13")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uv.lock pyproject.toml
          if ! git diff --cached --quiet; then
            git commit -m 'fix: refresh uv lock for Python 3.13'
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi

      - name: Validate minimal FastAPI Cloud runtime
        env:
          UV_PROJECT_ENVIRONMENT: .venv-runtime
        run: |
          uv sync --frozen --no-default-groups
          .venv-runtime/bin/python -c "import nabla.main; assert nabla.main.app is not None"
          rm -rf .venv-runtime

      - name: Resolve and install project dependencies
        run: uv sync

      - name: Check release version consistency
        run: uv run python scripts/check_versions.py

      - name: FastAPI startup smoke test
        run: |
          uv run python - <<'PY'
          from fastapi.testclient import TestClient
          from nabla.main import app

          client = TestClient(app)
          response = client.get("/api")
          assert response.status_code == 200, response.text
          assert any(getattr(route, "path", None) == "/mcp" or getattr(route, "path", None) == "/" for route in app.routes)
          PY

      - name: Ruff critical checks
        run: uv run ruff check server_app.py nabla --select=E9,F63,F7,F82

      - name: Pylint quality gate
        run: >-
          uv run pylint
          --fail-under=9.5
          --disable=E1701,E0102,E1003
          server_app.py nabla

      - name: Bandit security report
        run: uv run bandit -r nabla server_app.py --exit-zero

      - name: Run tests
        run: uv run pytest --junit-xml=junit.xml

      - name: Build package
        run: uv build

      - name: Upload test results to Trunk.io
        if: ${{ !cancelled() && env.TRUNK_API_TOKEN != '' }}
        continue-on-error: true
        uses: trunk-io/analytics-uploader@0e6c416c9d47c105654657984e5e4f0506dd84aa # v1
        with:
          junit-paths: "**/junit.xml"
          org-slug: alban
          token: ${{ env.TRUNK_API_TOKEN }}

  sonarcloud:
    name: Scan with SonarCloud
    needs: build
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: SonarCloud Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}

  docker:
    name: Docker CI
    needs: build
    permissions:
      contents: read
      packages: write
      security-events: write
    uses: ./.github/workflows/docker-build.yml
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      CI_PIP_GITLABNABLA_TOKEN: ${{ secrets.CI_PIP_GITLABNABLA_TOKEN }}

  mega-linter:
    name: MegaLinter
    needs: build
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
      issues: write
      statuses: write
      security-events: write
    uses: ./.github/workflows/mega-linter.yml
