            margin-top: 0.85rem;
          }

          .service-group-list {
            margin-top: 0;
          }

          .service-group-shell {
            list-style: none;
            padding: 0;
            border: 0;
          }

          .service-group-shell > .service-group {
            margin-top: 0.7rem;
          }

