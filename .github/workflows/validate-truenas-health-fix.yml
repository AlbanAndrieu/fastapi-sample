---
name: Validate TrueNAS health fix

on:
  push:
    branches:
      - fix/truenas-health-api-labels
    paths:
      - .github/workflows/validate-truenas-health-fix.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      OAUTH_TOKEN_SECRET: mocked-oauth-token-secret
      KEYCLOAK_SERVER_URL: http://localhost:8080
      KEYCLOAK_REALM: test
      KEYCLOAK_CLIENT_ID: test
      KEYCLOAK_CLIENT_SECRET: test-secret
      METRICS_ENABLED: "false"
      LOGFIRE_ENABLED: "false"
      LOGFIRE_TOKEN: ""
      SENTRY_ENABLED: "false"
      SENTRY_DSN: ""
      DATADOG_ENABLED: "false"
      UNLEASH_ENABLED: "false"
      STATSIG_ENABLED: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.13"
          version: "0.12.1"

      - name: Update focused regression assertions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          ui_test = Path("tests/unit/test_api_ui_assets.py")
          text = ui_test.read_text()
          text = text.replace(
              'assert \'albandrieu_truenas: "TrueNAS"\' in script',
              'assert \'albandrieu_truenas: "TrueNAS HTTPS"\' in script\n    assert \'truenas_api: "TrueNAS API"\' in script',
          )
          ui_test.write_text(text)

          catalog_test = Path("tests/unit/test_homelab_catalog.py")
          text = catalog_test.read_text()
          marker = '    garage = by_name["Garage"]\n'
          insert = (
              '    truenas = by_name["TrueNAS"]\n'
              '    assert truenas.tunnel_url == "https://truenas.albandrieu.com:7000"\n'
              '    assert truenas.public_https_probe_url == "https://truenas.albandrieu.com:7000/"\n'
              '    assert truenas.external is True\n'
              '    assert truenas.tunnel_secure is False\n\n'
          )
          if insert not in text:
              text = text.replace(marker, insert + marker)
          catalog_test.write_text(text)
          PY

      - name: Validate JavaScript syntax
        run: node --check nabla/api/assets/api-health-core.js

      - name: Run focused tests
        run: |
          uv sync --frozen
          uv run pytest -q tests/unit/test_api_ui_assets.py tests/unit/test_homelab_catalog.py

      - name: Commit regression tests
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/test_api_ui_assets.py tests/unit/test_homelab_catalog.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "test(health): cover TrueNAS HTTPS and API distinction"
          git push origin HEAD
