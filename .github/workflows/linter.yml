---
name: Lint using super-linter

on: [pull_request]

permissions: {}

jobs:
  lint:
    name: Lint using super-linter
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      statuses: write

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Super-linter
        uses: super-linter/super-linter@4ce20838b8ab83717e78138c5b3a1407148e0918 # v8.7.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: main
          IGNORE_GENERATED_FILES: true
          IGNORE_GITIGNORED_FILES: true
          SAVE_SUPER_LINTER_SUMMARY: true
          VALIDATE_ALL_CODEBASE: false
          # An explicit allowlist avoids unrelated repository-wide formatters
          # when configuration files change, while keeping security checks on.
          VALIDATE_CHECKOV: true
          VALIDATE_GITHUB_ACTIONS: true
          VALIDATE_GITHUB_ACTIONS_ZIZMOR: true
          VALIDATE_GITLEAKS: true
          VALIDATE_GIT_MERGE_CONFLICT_MARKERS: true
          VALIDATE_JSON: true
          VALIDATE_MARKDOWN: true
          VALIDATE_PYTHON_RUFF: true
          VALIDATE_YAML: true
          VALIDATE_YAML_PRETTIER: true
          VALIDATE_PYTHON_BLACK: false
          VALIDATE_PYTHON_ISORT: false
          # Canonical Python linting and typing use Ruff and the dedicated
          # Pylint workflow; legacy files do not satisfy competing defaults.
          VALIDATE_PYTHON_PYLINT: false
          VALIDATE_PYTHON_FLAKE8: false
          VALIDATE_PYTHON_MYPY: false
          VALIDATE_PYTHON_RUFF_FORMAT: false
          # Preserve project-native npm indentation and historical prose while
          # still validating JSON, Markdown structure, YAML, and Ruff rules.
          VALIDATE_JSON_PRETTIER: false
          VALIDATE_MARKDOWN_PRETTIER: false
          VALIDATE_NATURAL_LANGUAGE: false
          VALIDATE_SPELL_CODESPELL: false
          # JSCPD is covered by the canonical MegaLinter workflow. Super-linter
          # v8.7.0 currently passes an unsupported option to its bundled JSCPD.
          VALIDATE_JSCPD: false
          # Repository/image scanning is covered by dedicated workflows.
          VALIDATE_TRIVY: false
          # Never lint Git metadata or tools installed in .git (for example
          # Trivy templates, which otherwise get misdetected as PHP sources).
          FILTER_REGEX_EXCLUDE: >-
            ((^|/)\.git/|report/|megalinter-reports/|open-webui/|(^|/)README\.md$|(^|/)uv\.lock$|(^|/)Pipfile\.lock$|(^|/)trivy-sbom\.json$)
          JSON_FILTER_REGEX_EXCLUDE: >-
            (^|/)(\.vscode/|\.devcontainer/)
