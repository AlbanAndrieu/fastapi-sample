---
name: Lint using super-linter

on: [pull_request]

permissions: {}

jobs:
  lint:
    name: Lint using super-linter
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      statuses: write

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Super-linter
        uses: super-linter/super-linter@4ce20838b8ab83717e78138c5b3a1407148e0918 # v8.7.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: main
          IGNORE_GENERATED_FILES: true
          IGNORE_GITIGNORED_FILES: true
          SAVE_SUPER_LINTER_SUMMARY: true
          VALIDATE_ALL_CODEBASE: false
          # An explicit allowlist avoids unrelated repository-wide formatters
          # when configuration files change, while keeping security checks on.
          VALIDATE_CHECKOV: true
          VALIDATE_GITHUB_ACTIONS: true
          VALIDATE_GITHUB_ACTIONS_ZIZMOR: true
          VALIDATE_GITLEAKS: true
          VALIDATE_GIT_MERGE_CONFLICT_MARKERS: true
          VALIDATE_JSON: true
          VALIDATE_MARKDOWN: true
          VALIDATE_PYTHON_RUFF: true
          VALIDATE_YAML: true
          VALIDATE_YAML_PRETTIER: true
          # Never lint Git metadata or tools installed in .git (for example
          # Trivy templates, which otherwise get misdetected as PHP sources).
          FILTER_REGEX_EXCLUDE: >-
            ((^|/)\.git/|report/|megalinter-reports/|open-webui/|(^|/)README\.md$|(^|/)uv\.lock$|(^|/)Pipfile\.lock$|(^|/)trivy-sbom\.json$)
          JSON_FILTER_REGEX_EXCLUDE: >-
            (^|/)(\.vscode/|\.devcontainer/)
