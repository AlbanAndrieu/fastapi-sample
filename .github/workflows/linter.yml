---
name: Lint using super-linter

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  statuses: write
  pull-requests: write
  issues: write

jobs:
  lint:
    name: Lint using super-linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      # Super-linter v8.7.0 passes an option unsupported by its bundled JSCPD.
      - name: JSCPD
        run: npx --yes jscpd@4.0.8 --config .jscpd.json .

      - name: Super-linter
        uses: super-linter/super-linter@4ce20838b8ab83717e78138c5b3a1407148e0918 # v8.7.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: main
          IGNORE_GENERATED_FILES: true
          IGNORE_GITIGNORED_FILES: true
          VALIDATE_ALL_CODEBASE: false
          VALIDATE_PYTHON_ISORT: false
          VALIDATE_JSCPD: false
          # Repository/image scans run in dedicated workflows; Super-linter's
          # repository-wide Trivy invocation ignores its diff filter.
          VALIDATE_TRIVY: false
          FILTER_REGEX_EXCLUDE: >-
            (report/|megalinter-reports/|open-webui/|(^|/)uv\.lock$|(^|/)Pipfile\.lock$|(^|/)trivy-sbom\.json$)
