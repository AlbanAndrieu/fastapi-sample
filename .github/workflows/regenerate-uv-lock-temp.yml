name: Regenerate uv.lock (temporary)

on:
  push:
    branches:
      - chore/regenerate-uv-lock-20260820

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"

      - name: Regenerate lockfile
        run: uv lock --upgrade

      - name: Commit lockfile if changed
        shell: bash
        run: |
          if git diff --quiet -- uv.lock; then
            echo "uv.lock already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore(deps): regenerate uv.lock"
          git push
