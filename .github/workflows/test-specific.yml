---
name: test-specific

on:
  workflow_dispatch:
    inputs:
      expression:
        description: "Pytest expression to filter for"
        required: true
        default: ""
        type: string
      python-version:
        description: "Python version"
        required: true
        type: choice
        default: "3.13"
        options:
          - "3.13"
      os:
        description: "Operating system"
        required: true
        type: choice
        default: ubuntu-latest
        options:
          - ubuntu-latest
          - macos-latest
          - windows-latest

permissions:
  contents: read

concurrency:
  group: test-specific-${{ github.ref }}-${{ inputs.os }}-${{ inputs.python-version }}
  cancel-in-progress: true

jobs:
  tests-specific:
    name: Tests (${{ inputs.os }}, Python ${{ inputs.python-version }})
    runs-on: ${{ inputs.os }}
    timeout-minutes: 30
    env:
      METRICS_ENABLED: "false"
      LOGFIRE_ENABLED: "false"
      LOGFIRE_TOKEN: ""
      SENTRY_ENABLED: "false"
      SENTRY_DSN: ""
      DATADOG_ENABLED: "false"
      DD_TRACE_ENABLED: "false"
      DD_PROFILING_ENABLED: "false"
      DD_LOGS_INJECTION: "false"
      DD_APPSEC_ENABLED: "false"
      DD_IAST_ENABLED: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: ${{ inputs.python-version }}
          version: "0.12.1"

      - name: Install project dependencies
        run: uv sync --python ${{ inputs.python-version }}

      - name: Run selected tests
        shell: bash
        run: |
          if [[ -n "${{ inputs.expression }}" ]]; then
            uv run --python "${{ inputs.python-version }}" pytest -k "${{ inputs.expression }}"
          else
            uv run --python "${{ inputs.python-version }}" pytest
          fi
