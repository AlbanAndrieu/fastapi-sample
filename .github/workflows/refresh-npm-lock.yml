---
name: Refresh npm lockfile

on:
  push:
    branches:
      - feat/github-semantic-release

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: feat/github-semantic-release
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm

      - name: Refresh lockfile from package manifest
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit refreshed lockfile
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh auth setup-git
          git add package-lock.json
          git commit -m "fix(security): refresh npm lockfile [skip ci]"
          git push origin HEAD:feat/github-semantic-release
