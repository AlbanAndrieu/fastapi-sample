name: Temporary trailing-comma convergence PR 234

on:
  push:
    branches:
      - fix/homelab-deadline-cloudflare-unknown

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Apply canonical trailing-comma hook
        run: |
          python -m pip install --disable-pip-version-check --quiet pre-commit==4.6.2
          pre-commit run add-trailing-comma --files \
            nabla/api/homelab_exposure.py \
            nabla/api/platform_health.py \
            tests/unit/test_cloudflare_uncertainty.py || true
      - name: Remove temporary workflow
        run: git rm .github/workflows/tmp-trailing-comma-234.yml
      - name: Commit canonical hook output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style(health): converge trailing-comma hook"
          git push
