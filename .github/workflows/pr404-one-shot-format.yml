---
name: PR404 targeted one-shot formatting
on:
  push:
    branches: [feat/home-resource-observability-20261109]
    paths:
      - .github/workflows/pr404-one-shot-format.yml
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'AlbanAndrieu/fastapi-sample'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: true
      - name: Format only changed home assets with pinned Biome
        shell: bash
        run: |
          set -euo pipefail
          npm exec --yes --package=@biomejs/biome@2.2.6 -- biome check --write \
            nabla/api/assets/home-operations-model.js \
            nabla/api/assets/home-operations.css \
            nabla/api/assets/home-operations.js \
            tests/js/home-operations-model.test.mjs
          git diff --check
          if ! git diff --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              add -A nabla/api/assets/home-operations-model.js nabla/api/assets/home-operations.css \
                nabla/api/assets/home-operations.js tests/js/home-operations-model.test.mjs
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'style(home): apply pinned Biome formatting to dashboard assets'
            git push origin HEAD:refs/heads/feat/home-resource-observability-20261109
          fi
