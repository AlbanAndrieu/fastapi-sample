name: Regenerate minimal runtime dependencies

on:
  push:
    branches:
      - feat/mcp-streamable-http-outbound
    paths:
      - .github/workflows/regen-runtime-deps.yml

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feat/mcp-streamable-http-outbound
          persist-credentials: true
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          python-version: "3.12"
      - name: Promote direct startup dependencies
        run: >-
          uv add
          'fastmcp>=2.12.2'
          'mcp>=1.28.1'
          'pybreaker>=1.4.0'
          'prometheus-fastapi-instrumentator>=7.1.0'
          'sqladmin[full]>=0.21.0'
          'python-keycloak>=4.4.0'
          'pydantic-settings>=2.12.0'
          'statsig-python-core>=0.12.0'
          'fastapi-users[sqlalchemy]>=14.0.1'
          'fastapi-cache2[redis]>=0.0.1'
          'databases>=0.5.3'
          'redis>=4.6.0'
          'deepagents>=0.5.3'
          'langchain-openai>=0.3.32'
          'python-dotenv>=1.0.0'
          'tenacity>=9.0.0'
          'httpx>=0.28.1'
          'sqlalchemy[asyncio]>=2.0.20'
          'asyncpg>=0.27.0'
          'a2a-sdk>=1.0.0'
      - name: Commit runtime manifest and lock
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pyproject.toml uv.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix(runtime): declare direct FastAPI Cloud dependencies'
          git push origin HEAD:feat/mcp-streamable-http-outbound
