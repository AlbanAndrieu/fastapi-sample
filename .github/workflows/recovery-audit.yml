---
name: Recovery audit

on:
  push:
    branches:
      - recovery/pr-63-66-68-70
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Fetch historical PR heads
        run: |
          git fetch origin \
            refs/pull/63/head:refs/remotes/origin/recovery-pr63 \
            refs/pull/66/head:refs/remotes/origin/recovery-pr66
      - name: Show unique histories
        run: |
          echo '=== PR63 unique commits since #70 merge ==='
          git log --reverse --oneline 901c86c9f0e62c082b94194ff1e03cf9bab4905b..origin/recovery-pr63
          echo '=== PR66 unique commits since #70 merge ==='
          git log --reverse --oneline 901c86c9f0e62c082b94194ff1e03cf9bab4905b..origin/recovery-pr66

  dry-run-pr63:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Test transplant of PR63 commits preserving restored conflict files
        shell: bash
        run: |
          set -u
          git config user.name recovery-audit
          git config user.email recovery-audit@users.noreply.github.com
          git checkout -B recovery-scratch origin/main

          if ! git cherry-pick 46f85e5; then
            conflicts=(
              nabla/api/db/database.py
              nabla/api/health_checks.py
              nabla/main.py
              nabla/middleware.py
              nabla/utils/logger.py
              nabla/utils/sentry_config.py
              package-lock.json
              package.json
              pytest.ini
              tests/test_sentry_config.py
              tests/unit/test_api.py
              tests/unit/test_mcp_a2a.py
            )
            for path in "${conflicts[@]}"; do
              git checkout --ours -- "$path"
              git add "$path"
            done
            git cherry-pick --continue
          fi

          echo '=== cherry-pick 615ae51; keep restored Pylint workflow on conflict ==='
          if ! git cherry-pick 615ae51; then
            git checkout --ours -- .github/workflows/pylint.yml
            git add .github/workflows/pylint.yml
            git cherry-pick --continue
          fi

          commits=(0940ee0 987e31f b85cceb 06a8fc0)
          for commit in "${commits[@]}"; do
            echo "=== cherry-pick ${commit} ==="
            if ! git cherry-pick "${commit}"; then
              echo "=== conflicts for ${commit} ==="
              git status --short
              echo '=== unmerged files ==='
              git diff --name-only --diff-filter=U
              exit 1
            fi
          done
          echo '=== PR63 transplant succeeded ==='
          git log --oneline origin/main..HEAD
