---
name: Temporary PR237 trailing comma convergence
on:
  push:
    branches: [fix/generic-service-restricted-security]
    paths: [.github/workflows/tmp-pr237-trailing-comma.yml]
permissions:
  contents: write
jobs:
  converge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/generic-service-restricted-security
          fetch-depth: 0
      - name: Apply canonical trailing commas
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/diagnose-local-runtime-dependencies.py')
          s = p.read_text()
          replacements = {
              '        and not row["stale"]\n    )': '        and not row["stale"],\n    )',
              '        and not status_confirmed\n    )': '        and not status_confirmed,\n    )',
              '        and summary.get("signals_available", 0) > 0\n    )': '        and summary.get("signals_available", 0) > 0,\n    )',
              '        f"{\'app\':<6} {\'stale\':<6} {\'state\':<22} error_stage"\n    )': '        f"{\'app\':<6} {\'stale\':<6} {\'state\':<22} error_stage",\n    )',
              '            f"{_fmt(row.get(\'operational_state\')):<22} {_fmt(row.get(\'error_stage\'))}"\n        )': '            f"{_fmt(row.get(\'operational_state\')):<22} {_fmt(row.get(\'error_stage\'))}",\n        )',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing formatter pattern: {old!r}')
              s = s.replace(old, new)
          p.write_text(s)
          PY
          git diff --check
          git config user.name openai-agent
          git config user.email openai-agent@users.noreply.github.com
          git add scripts/diagnose-local-runtime-dependencies.py
          git commit -m 'chore(ci): converge diagnostic trailing commas'
          git push origin HEAD:fix/generic-service-restricted-security
