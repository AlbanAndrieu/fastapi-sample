name: release

on:
  # Kept for releases created manually or with a non-GITHUB_TOKEN credential.
  release:
    types:
      - published
  # semantic-release uses GITHUB_TOKEN; repository_dispatch is the reliable
  # GitHub-supported way to start this downstream workflow from that run.
  repository_dispatch:
    types:
      - semantic-release-published
  # Manual recovery publishes the latest existing GitHub Release. No free-form
  # tag input is accepted, so a user parameter cannot alter the build source.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.client_payload.tag || github.event.release.tag_name || github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish new release
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
      id-token: write # Required for PyPI Trusted Publishing (OIDC).

    steps:
      - name: Resolve immutable release tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISPATCH_TAG: ${{ github.event.client_payload.tag }}
          RELEASE_EVENT_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [[ -n "${DISPATCH_TAG}" ]]; then
            release_tag="${DISPATCH_TAG}"
          elif [[ -n "${RELEASE_EVENT_TAG}" ]]; then
            release_tag="${RELEASE_EVENT_TAG}"
          else
            release_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')"
          fi
          if [[ -z "${release_tag}" ]]; then
            echo "Unable to resolve a GitHub Release tag" >&2
            exit 1
          fi
          echo "RELEASE_TAG=${release_tag}" >> "${GITHUB_ENV}"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
          version: "0.12.1"

      - name: Check that versions match release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/check_versions.py
          PACKAGE_VERSION=$(uv run python -c \
            "from nabla import __version__; print(__version__)")
          RELEASE_VERSION="${RELEASE_TAG#v}"
          test "${RELEASE_VERSION}" = "${PACKAGE_VERSION}"
          echo "major_minor_version=v${PACKAGE_VERSION%.*}" >> "${GITHUB_OUTPUT}"

      - name: Build package
        run: uv build

      - name: Publish to Test PyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
        with:
          repository_url: https://test.pypi.org/legacy/
          skip_existing: true

      - name: Publish to Production PyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
        with:
          skip_existing: false
