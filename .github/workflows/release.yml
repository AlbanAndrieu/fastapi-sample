name: release

on:
  # semantic-release is the only automatic release producer. It emits this
  # repository dispatch after the GitHub Release exists, avoiding duplicate
  # package publication when a GitHub App token also emits release events.
  repository_dispatch:
    types:
      - semantic-release-published
  # Manual recovery republishes assets for the latest existing GitHub Release.
  # No free-form tag input is accepted, so a user parameter cannot alter source.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.client_payload.tag || github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release_ref.outputs.tag }}
      pypi_allowed: ${{ steps.publication_policy.outputs.pypi_allowed }}

    steps:
      - name: Resolve immutable release tag
        id: release_ref
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISPATCH_TAG: ${{ github.event.client_payload.tag }}
        run: |
          set -euo pipefail
          if [[ -n "${DISPATCH_TAG}" ]]; then
            release_tag="${DISPATCH_TAG}"
          else
            release_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')"
          fi
          if [[ ! "${release_tag}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid stable release tag: ${release_tag}" >&2
            exit 1
          fi
          gh release view "${release_tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null
          echo "tag=${release_tag}" >> "${GITHUB_OUTPUT}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ steps.release_ref.outputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
          python-version: "3.13"
          version: "0.12.1"

      - name: Check that versions match release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release_ref.outputs.tag }}
        run: |
          set -euo pipefail
          uv run python scripts/check_versions.py
          PACKAGE_VERSION=$(uv run python -c \
            "from nabla import __version__; print(__version__)")
          RELEASE_VERSION="${RELEASE_TAG#v}"
          test "${RELEASE_VERSION}" = "${PACKAGE_VERSION}"

      - name: Determine package publication policy
        id: publication_policy
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "${GITHUB_OUTPUT}"
          import tomllib
          from pathlib import Path

          with Path("pyproject.toml").open("rb") as stream:
              classifiers = tomllib.load(stream)["project"].get("classifiers", [])
          blocked = any(str(value).startswith("Private ::") for value in classifiers)
          print(f"pypi_allowed={'false' if blocked else 'true'}")
          PY

      - name: Build package
        run: uv build

      - name: Upload immutable distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish_github:
    name: Attach distributions to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        shell: bash
        run: gh release upload "${RELEASE_TAG}" dist/* --clobber --repo "${GITHUB_REPOSITORY}"

  publish_testpypi:
    name: Publish to TestPyPI
    needs: build
    if: needs.build.outputs.pypi_allowed == 'true'
    runs-on: ubuntu-latest
    # Trusted Publisher registration is repository/workflow scoped and does not
    # include a GitHub environment claim. Keep OIDC isolated to this job without
    # changing the subject expected by TestPyPI.
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download release distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish_pypi:
    name: Publish to PyPI
    needs:
      - build
      - publish_testpypi
    if: needs.build.outputs.pypi_allowed == 'true'
    runs-on: ubuntu-latest
    # Match the existing PyPI Trusted Publisher subject while keeping OIDC
    # unavailable to the build job and every unrelated workflow step.
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download release distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to Production PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true
