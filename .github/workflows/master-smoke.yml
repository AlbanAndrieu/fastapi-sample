---
name: Production Smoke

on:
  pull_request:
    types: [opened, ready_for_review]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: production-smoke-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  production-smoke:
    name: Production API and UI smoke
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRODUCTION_ROOT_URL: https://fastapi-sample.fastapicloud.dev
      PRODUCTION_API_URL: https://fastapi-sample.fastapicloud.dev/api

    steps:
      - name: Checkout smoke-test code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check public liveness and version
        shell: bash
        run: |
          set -euo pipefail
          for path in health v2/version; do
            curl --fail --silent --show-error \
              --connect-timeout 10 \
              --max-time 30 \
              --retry 3 \
              --retry-delay 5 \
              --retry-all-errors \
              "${PRODUCTION_ROOT_URL}/${path}" > "${RUNNER_TEMP}/${path//\//-}.json"
          done
          jq -e '.status == "healthy"' "${RUNNER_TEMP}/health.json" >/dev/null
          jq -e '.release_version | type == "string" and test("^[0-9]+[.][0-9]+[.][0-9]+$")' \
            "${RUNNER_TEMP}/v2-version.json" >/dev/null

      # Since #447 these diagnostics are private: an anonymous 200 is a leak.
      - name: Verify private diagnostics refuse anonymous reads
        shell: bash
        run: |
          set -euo pipefail
          for url in \
            "${PRODUCTION_ROOT_URL}/healthz" \
            "${PRODUCTION_API_URL}/runtime/topology" \
            "${PRODUCTION_API_URL}/homelab/status" \
            "${PRODUCTION_API_URL}/homelab/health"; do
            code="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --connect-timeout 10 --max-time 30 "${url}")"
            if [[ "${code}" != 401 ]]; then
              echo "::error::${url} answered HTTP ${code} anonymously; expected 401"
              exit 1
            fi
          done

      - name: Read Node.js version from mise.toml
        id: mise_node
        run: python3 -c 'import tomllib; print("version=" + tomllib.load(open("mise.toml", "rb"))["tools"]["node"])' >> "$GITHUB_OUTPUT"

      - name: Set up Node.js for deployed UI smoke
        if: github.event_name != 'pull_request'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.mise_node.outputs.version }}

      - name: Install Playwright headless smoke runtime
        if: github.event_name != 'pull_request'
        timeout-minutes: 6
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts --omit=dev --no-audit --no-fund playwright@1.55.0
          npx --no-install playwright install --with-deps --only-shell chromium

      - name: Check production UI version matches source revision
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          expected="$(jq -r '.version' package.json)"
          test -n "${expected}" && test "${expected}" != "null"
          echo "Expected source version: ${expected}"
          EXPECTED_VERSION="${expected}" node scripts/check-production-api-ui.mjs

  # Post-deploy only. The read-only key lives in the master-only production-smoke
  # environment, so callers such as master-red pass no secret. The repository is
  # public: assert with jq -e, never print a private payload.
  authenticated-smoke:
    name: Production diagnostics smoke (read-only key)
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-smoke
    env:
      PRODUCTION_ROOT_URL: https://fastapi-sample.fastapicloud.dev
      PRODUCTION_API_URL: https://fastapi-sample.fastapicloud.dev/api

    steps:
      - name: Check production runtime topology
        shell: bash
        env:
          PRODUCTION_SMOKE_ACCESS_KEY: ${{ secrets.PRODUCTION_SMOKE_ACCESS_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${PRODUCTION_SMOKE_ACCESS_KEY}" ]]; then
            echo "::error::PRODUCTION_SMOKE_ACCESS_KEY is missing from the production-smoke environment"
            exit 1
          fi
          curl --fail --silent --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            --retry 3 \
            --retry-delay 5 \
            --retry-all-errors \
            --header "X-Smoke-Key: ${PRODUCTION_SMOKE_ACCESS_KEY}" \
            "${PRODUCTION_API_URL}/runtime/topology" \
            > "${RUNNER_TEMP}/runtime-topology.json"
          jq -e '
            (.observed_instance_count | type == "number" and . >= 1) and
            (.instances | type == "array" and length >= 1) and
            (.active_egress_ips | type == "array") and
            (.recent_egress_ips | type == "array") and
            .platform_replica_count_available == false and
            (.count_semantics | type == "string" and length > 0)
          ' "${RUNNER_TEMP}/runtime-topology.json" >/dev/null

      - name: Verify deployed FastAPI Cloud identity and Redis usage
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            .provider == "FastAPI Cloud" and
            .runtime_mode == "fastapi_cloud" and
            (.observed_instance_count | type == "number" and . >= 1) and
            .redis.configured == true and
            .redis.available == true and
            (.redis.telemetry_available | type == "boolean") and
            (if .redis.telemetry_available == true then
              (.redis.used_memory_bytes | type == "number" and . >= 0) and
              (.redis.keys | type == "number" and . >= 0) and
              (.redis.connected_clients | type == "number" and . >= 0)
            else
              (.redis.reason | type == "string" and length > 0) and
              .redis.failure_stage == "info"
            end)
          ' "${RUNNER_TEMP}/runtime-topology.json" >/dev/null

      - name: Check production pfSense observability
        shell: bash
        env:
          PRODUCTION_SMOKE_ACCESS_KEY: ${{ secrets.PRODUCTION_SMOKE_ACCESS_KEY }}
        run: |
          set -euo pipefail

          fetch_json() {
            local url="$1"
            local output="$2"
            curl --fail --silent --show-error \
              --connect-timeout 10 \
              --max-time 30 \
              --retry 3 \
              --retry-delay 5 \
              --retry-all-errors \
              --header "X-Smoke-Key: ${PRODUCTION_SMOKE_ACCESS_KEY}" \
              "${url}" >"${output}"
          }

          fetch_json "${PRODUCTION_ROOT_URL}/healthz" "${RUNNER_TEMP}/healthz.json"
          fetch_json "${PRODUCTION_API_URL}/homelab/health" "${RUNNER_TEMP}/homelab-health.json"
          fetch_json "${PRODUCTION_API_URL}/homelab/status" "${RUNNER_TEMP}/homelab-status.json"

          # FastAPI Cloud is a transport-only pfSense observer: WAN TCP/10443
          # only accepts PFSENSE_ADMIN_WAN (nabla-compose
          # docs/pfsense-wan-exposure-roadmap.md) and authenticated pfSense
          # probes run on the TrueNAS LAN observer. The smoke accepts that
          # explicit transport-only contract; an authenticated run must still
          # succeed, and a confirmed authentication rejection fails the smoke.
          jq -e '
            (
              .checks.pfsense.credential_mode == "disabled" and
              .checks.pfsense.authenticated_probes_enabled == false and
              .checks.pfsense.observation_mode == "transport_only" and
              .checks.pfsense.skipped == true and
              .checks.pfsense.reachable == null and
              .checks.pfsense.status_confirmed == false and
              .checks.pfsense.state == "unknown" and
              .checks.pfsense.degraded == false and
              .checks.pfsense.vantage_point == "fastapi_cloud"
            ) or
            .checks.pfsense.credential_mode == "dedicated_posture" and
            (
              (
                .checks.pfsense.reachable == true and
                .checks.pfsense.api_authenticated == true and
                .checks.pfsense.status_confirmed == true and
                .checks.pfsense.state == "ok" and
                (.checks.pfsense.http_status >= 200 and .checks.pfsense.http_status < 300)
              ) or
              (
                .checks.pfsense.reachable == null and
                .checks.pfsense.state == "unknown" and
                .checks.pfsense.status_confirmed == false and
                .checks.pfsense.degraded == false and
                .checks.pfsense.vantage_point == "fastapi_cloud" and
                (.checks.pfsense.error_kind | type == "string" and length > 0) and
                (.checks.pfsense.failure_stage | type == "string" and length > 0) and
                (.checks.pfsense.warning | type == "string" and startswith("⚠️"))
              )
            )
          ' "${RUNNER_TEMP}/healthz.json" >/dev/null

          jq -e '
            .providerCredentials.pfsense.configured == true and
            .providerCredentials.pfsense.credential_mode == "dedicated" and
            .providerCredentials.pfsense_security.configured == true and
            .providerCredentials.pfsense_security.credential_mode == "dedicated"
          ' "${RUNNER_TEMP}/homelab-status.json" >/dev/null

          # Post-deploy smoke stays strict: stale data needs last-success evidence.
          jq -e --slurpfile healthz "${RUNNER_TEMP}/healthz.json" '
            (.pfsense.dns.security_filters | type == "array" and length > 0) and
            (.pfsense.dns.ingress_block | type == "object") and
            (.pfsense.dns.ingress_block.state as $state |
              ["clear", "blocked", "attribution_unavailable", "telemetry_stale", "telemetry_unavailable", "telemetry_disabled"] | index($state) != null) and
            (if .pfsense.dns.ingress_block.state == "telemetry_stale" then
              .pfsense.dns.ingress_block.stale == true and
              .pfsense.dns.ingress_block.attribution_available == false and
              (.pfsense.dns.ingress_block.last_success_at | type == "string" and length > 0)
            elif .pfsense.dns.ingress_block.state == "telemetry_disabled" then
              .pfsense.dns.ingress_block.telemetry_available == false and
              .pfsense.dns.ingress_block.attribution_available == false and
              .pfsense.dns.ingress_block.control_path.mode == "disabled" and
              $healthz[0].checks.pfsense.credential_mode == "disabled"
            elif .pfsense.dns.ingress_block.state == "telemetry_unavailable" then
              .pfsense.dns.ingress_block.telemetry_available == false and
              (.pfsense.dns.ingress_block.failure_stage | type == "string" and length > 0) and
              (.pfsense.dns.ingress_block.error_kind | type == "string" and length > 0)
            else true end)
          ' "${RUNNER_TEMP}/homelab-health.json" >/dev/null
