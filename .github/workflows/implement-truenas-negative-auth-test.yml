            border-top: 2px dashed #ff6666;
          }

          @media (max-width: 700px) {
            .truenas-platform-heading { flex-direction: column; }
            .truenas-platform-state { align-self: flex-start; }
          }
          CSS

          cat > tests/unit/test_truenas_health_configuration.py <<'PY'
          """TrueNAS health configuration must fail closed without leaking secret values."""

          import pytest

          from nabla.api import homelab_health


          def _set_username(monkeypatch: pytest.MonkeyPatch) -> None:
              monkeypatch.setenv("TRUENAS_USER", "albandrieu")
              monkeypatch.delenv("TRUENAS_API_USERNAME", raising=False)
              monkeypatch.delenv("TRUENAS_USERNAME", raising=False)


          @pytest.mark.asyncio
          async def test_missing_canonical_api_key_is_explicit_authentication_failure(monkeypatch) -> None:
              _set_username(monkeypatch)
              monkeypatch.delenv("TRUENAS_API_KEY", raising=False)
              monkeypatch.setenv("TRUENAS_MCP_API_KEY", "7-legacy-mcp-key")

              result = await homelab_health._observe_truenas_api()

              assert result["reachable"] is False
              assert result["phase"] == "authentication"
              assert result["stage"] == "missing_api_key"
              assert result["api_key_configured"] is False
              assert "TRUENAS_API_KEY" in result["error"]
              assert "legacy-mcp-key" not in result["error"]


          @pytest.mark.asyncio
          async def test_variable_name_in_api_key_is_rejected_without_echoing_value(monkeypatch) -> None:
              _set_username(monkeypatch)
              monkeypatch.setenv("TRUENAS_API_KEY", "PFSENSE_API_KEY")

              result = await homelab_health._observe_truenas_api()

              assert result["reachable"] is False
              assert result["phase"] == "authentication"
              assert result["stage"] == "invalid_api_key_reference"
              assert result["api_key_configured"] is True
              assert "environment-variable name" in result["error"]
              assert "PFSENSE_API_KEY" not in result["error"]


          @pytest.mark.asyncio
          async def test_malformed_raw_api_key_is_rejected_before_official_client(monkeypatch) -> None:
              _set_username(monkeypatch)
              monkeypatch.setenv("TRUENAS_API_KEY", "not-a-truenas-key")

              result = await homelab_health._observe_truenas_api()

              assert result["stage"] == "invalid_api_key_format"
              assert result["reachable"] is False
          PY

          cat > tests/unit/test_truenas_diagnostics.py <<'PY'
          """Tests for the ordered TrueNAS diagnostic pipeline."""

          from nabla.api.truenas_diagnostics import append_truenas_api_stages


          def _network_ok():
              return {
                  "target": "truenas.example:7000",
                  "stages": [
                      {"id": "dns", "label": "DNS", "state": "ok"},
                      {"id": "socket", "label": "TCP socket", "state": "ok"},
                      {"id": "tls", "label": "TLS handshake", "state": "ok"},
                      {"id": "https", "label": "HTTPS", "state": "ok"},
                      {"id": "websocket", "label": "WebSocket tunnel", "state": "ok"},
                  ],
              }


          def test_missing_api_key_marks_auth_failed_and_api_blocked() -> None:
              result = append_truenas_api_stages(
                  _network_ok(),
                  {
                      "reachable": False,
                      "phase": "authentication",
                      "stage": "missing_api_key",
                      "error": "TRUENAS_API_KEY is missing; authentication cannot be attempted.",
                  },
              )

              auth, api = result["stages"][-2:]
              assert auth["id"] == "authentication"
              assert auth["state"] == "fail"
              assert auth["failure_stage"] == "missing_api_key"
              assert api == {
                  "id": "api",
                  "label": "TrueNAS API",
                  "state": "blocked",
                  "detail": "Blocked by authentication",
              }


          def test_websocket_failure_blocks_authentication() -> None:
              network = _network_ok()
              network["stages"][-1]["state"] = "fail"
              result = append_truenas_api_stages(network, {"reachable": False})

              assert result["stages"][-2]["state"] == "blocked"
              assert result["stages"][-1]["state"] == "blocked"
          PY

      - name: Install test dependencies
        run: uv sync --frozen

      - name: Run focused tests
        run: >-
          uv run pytest -q
          tests/unit/test_truenas_health_configuration.py
          tests/unit/test_truenas_diagnostics.py
          tests/unit/test_truenas_client.py
          tests/unit/test_homelab_health.py

      - name: Commit implementation
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nabla/api/homelab_health.py nabla/api/ui.py nabla/api/assets/api-health-core.js nabla/api/assets/api-health.js nabla/api/assets/api.css nabla/api/assets/api-truenas.js nabla/api/assets/api-truenas.css docs/engineering-roadmap.md tests/unit/test_truenas_health_configuration.py tests/unit/test_truenas_diagnostics.py
          git commit -m 'feat(health): show TrueNAS missing API key stage'
          git push origin HEAD:feat/truenas-health-board
