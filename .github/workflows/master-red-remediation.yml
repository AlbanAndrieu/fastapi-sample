---
name: Master red remediation

on:
  push:
    branches: [master]
  workflow_dispatch:

# Only the newest master SHA matters operationally. Superseded post-merge runs are
# cancelled and must never create remediation noise for a commit that is no longer
# at the tip of master.
concurrency:
  group: master-red-remediation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify post-merge security impact
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      base_sha: ${{ steps.impact.outputs.base_sha }}
      changed_count: ${{ steps.impact.outputs.changed_count }}
      run_codeql: ${{ steps.impact.outputs.run_codeql }}
      run_zap: ${{ steps.impact.outputs.run_zap }}
    steps:
      - name: Checkout current master SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed surface
        id: impact
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          base_sha="${EVENT_BEFORE:-}"
          if [[ -z "${base_sha}" || "${base_sha}" =~ ^0+$ ]] \
            || ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            base_sha="$(git rev-parse "${TARGET_SHA}^" 2>/dev/null || printf '%s' "${TARGET_SHA}")"
          fi

          mapfile -t changed < <(git diff --name-only "${base_sha}" "${TARGET_SHA}")
          run_codeql=false
          run_zap=false

          # A manual run is an explicit full post-merge verification request.
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            run_codeql=true
            run_zap=true
          fi

          for path in "${changed[@]}"; do
            case "${path}" in
              *.py|pyproject.toml|uv.lock|.github/workflows/codeql.yml)
                run_codeql=true
                ;;
            esac
            case "${path}" in
              nabla/*|server_all.py|server_app.py|templates/*|.zap/*|.github/workflows/security-zap.yml)
                run_zap=true
                ;;
            esac
          done

          {
            echo "base_sha=${base_sha}"
            echo "changed_count=${#changed[@]}"
            echo "run_codeql=${run_codeql}"
            echo "run_zap=${run_zap}"
          } >> "${GITHUB_OUTPUT}"

          {
            echo "## Post-merge impact"
            echo
            echo "- Base: \`${base_sha}\`"
            echo "- Target: \`${TARGET_SHA}\`"
            echo "- Changed files: **${#changed[@]}**"
            echo "- CodeQL: **${run_codeql}**"
            echo "- ZAP Web/OpenAPI: **${run_zap}**"
          } >> "${GITHUB_STEP_SUMMARY}"

  python:
    name: Re-run canonical Python/package gates
    needs: classify
    permissions:
      contents: read
      packages: write
      security-events: write
    uses: $/.github/workflows/python.yml
    secrets:
      TRUNK_API_TOKEN: ${{ secrets.TRUNK_API_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      CI_PIP_GITLABNABLA_TOKEN: ${{ secrets.CI_PIP_GITLABNABLA_TOKEN }}

  production-smoke:
    name: Re-run Production Smoke after merge
    needs: classify
    permissions:
      contents: read
    uses: $/.github/workflows/master-smoke.yml

  codeql:
    name: Re-run CodeQL for security-impacting merge
    needs: classify
    if: ${{ needs.classify.outputs.run_codeql == 'true' }}
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: $/.github/workflows/codeql.yml

  zap:
    name: Run ZAP Web and OpenAPI after production smoke
    needs: [classify, production-smoke]
    if: ${{ needs.classify.outputs.run_zap == 'true' && needs.production-smoke.result == 'success' }}
    permissions:
      contents: read
    uses: $/.github/workflows/security-zap.yml
    secrets:
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

  remediate:
    name: Track latest master in one manual-safe status comment
    needs: [classify, python, production-smoke, codeql, zap]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      CLASSIFY_RESULT: ${{ needs.classify.result }}
      PYTHON_RESULT: ${{ needs.python.result }}
      PRODUCTION_SMOKE_RESULT: ${{ needs.production-smoke.result }}
      CODEQL_RESULT: ${{ needs.codeql.result }}
      ZAP_RESULT: ${{ needs.zap.result }}
      REQUIRE_CODEQL: ${{ needs.classify.outputs.run_codeql }}
      REQUIRE_ZAP: ${{ needs.classify.outputs.run_zap }}
    steps:
      - name: Checkout exact master without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Track the newest master only, protect manual edits
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/master_red_issue.py --apply

  keep-master-red-visible:
    name: Keep red master visible until remediation
    needs: [classify, python, production-smoke, codeql, zap, remediate]
    if: >-
      ${{ always() && !cancelled() && (
        needs.classify.result != 'success' ||
        needs.python.result != 'success' ||
        needs.production-smoke.result != 'success' ||
        (needs.codeql.result != 'success' && needs.codeql.result != 'skipped') ||
        (needs.zap.result != 'success' && needs.zap.result != 'skipped')
      ) }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Fail while critical master gates are red
        run: |
          echo "Critical post-merge master gates remain red; single tracker #355 retains the evidence."
          exit 1
