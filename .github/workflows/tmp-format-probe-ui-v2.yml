name: Temporary format probe UI v2

on:
  push:
    branches:
      - fix/homelab-probe-budget-cloudflare-unknown

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/homelab-probe-budget-cloudflare-unknown
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install pre-commit
        run: python -m pip install --disable-pip-version-check --quiet pre-commit==4.6.2
      - name: Apply canonical hooks to changed files
        continue-on-error: true
        run: |
          pre-commit run --files \
            nabla/api/assets/api-health-dependency.js \
            nabla/api/assets/api-health.js \
            nabla/api/assets/api-probe-live.css \
            nabla/api/assets/api-probe-live.js \
            nabla/api/assets/api.css \
            nabla/api/health_checks.py \
            nabla/api/health_contracts.py \
            nabla/api/health_probe_cadence.py \
            nabla/api/homelab_probe_evidence.py \
            nabla/api/homelab_probe_policy.py \
            tests/unit/test_health_contracts.py \
            tests/unit/test_health_probe_cadence.py \
            tests/unit/test_probe_live_ui_contract.py
      - name: Remove temporary workflow
        run: git rm .github/workflows/tmp-format-probe-ui-v2.yml
      - name: Commit canonical formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "style(health): apply canonical probe formatters"
          git push
