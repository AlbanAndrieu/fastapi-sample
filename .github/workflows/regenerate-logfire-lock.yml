name: Regenerate Logfire lock

on:
  push:
    branches:
      - fix/logfire-fastapi-cloud
    paths:
      - .github/workflows/regenerate-logfire-lock.yml

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/logfire-fastapi-cloud
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Enable Logfire system metrics extra and regenerate lock
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('pyproject.toml')
          text = path.read_text()
          old = 'logfire[fastapi]>=4.2.0'
          new = 'logfire[fastapi,system-metrics]>=4.2.0'
          if old not in text and new not in text:
              raise SystemExit('Expected Logfire dependency not found')
          path.write_text(text.replace(old, new))
          PY
          uv lock
          rm .github/workflows/regenerate-logfire-lock.yml
      - name: Commit generated lock
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pyproject.toml uv.lock .github/workflows/regenerate-logfire-lock.yml
          git commit -m 'chore(observability): enable Logfire system metrics dependency'
          git push origin HEAD:fix/logfire-fastapi-cloud
