---
name: Temporary PR237 UI ZAP follow-up

on:
  push:
    branches:
      - fix/generic-service-restricted-security
    paths:
      - .github/workflows/tmp-pr237-ui-zap-followup.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/generic-service-restricted-security
          fetch-depth: 0

      - name: Apply UI stability and dual ZAP patch
        shell: bash
        run: |
          set -euo pipefail
          python scripts/tmp-pr237-ui-zap-followup.py
          # GitHub's workflow GITHUB_TOKEN may not create another workflow.
          # The connector writes security-zap.yml immediately after this patch.
          rm -f .github/workflows/security-zap.yml
          git diff --check
          git config user.name openai-agent
          git config user.email openai-agent@users.noreply.github.com
          git add -A
          git rm scripts/tmp-pr237-ui-zap-followup.py
          git commit -m "fix(ui): stabilize health refresh and prepare dual ZAP DAST"
          git push origin HEAD:fix/generic-service-restricted-security
