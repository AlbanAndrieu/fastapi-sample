name: Temporary functional probe backend

on:
  push:
    branches:
      - fix/functional-probe-runtime-ui

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/functional-probe-runtime-ui
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.1"
          enable-cache: true
      - name: Patch canonical monitoring and runtime evidence
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = 1) -> None:
              target = Path(path)
              text = target.read_text()
              assert old in text, f"missing patch anchor in {path}: {old[:80]!r}"
              target.write_text(text.replace(old, new, count))

          path = "nabla/api/homelab_declared.py"
          needle = "\n\nclass DeclaredService(BaseModel):\n"
          helper = '''\n\nclass MonitoringContract(BaseModel):\n    \"\"\"Canonical functional probe declaration exported from ``x-nabla.monitoring``.\"\"\"\n\n    model_config = ConfigDict(extra="ignore", frozen=True, populate_by_name=True)\n\n    probe_type: Literal["http", "port"] = Field(\n        validation_alias=AliasChoices("type", "probe_type"),\n        serialization_alias="type",\n    )\n    target: str | None = Field(default=None, min_length=1, max_length=2048)\n    url: str | None = Field(default=None, min_length=1, max_length=2048)\n    host: str | None = Field(default=None, min_length=1, max_length=255)\n    port: int | None = Field(default=None, ge=1, le=65535)\n    conditions: list[str] | None = None\n'''
          replace(path, needle, helper + needle)
          replace(
              path,
              "    runtime: RuntimeBinding | None = None\n",
              "    runtime: RuntimeBinding | None = None\n    monitoring: MonitoringContract | None = None\n",
          )

          path = "nabla/api/homelab_health.py"
          replace(
              path,
              "from nabla.api.homelab_catalog import fetch_homelab_services\n",
              "from nabla.api.homelab_catalog import fetch_homelab_services\nfrom nabla.api.homelab_declared import DeclaredService, fetch_declared_service_catalog\nfrom nabla.api.homelab_monitoring import public_monitoring_url\n",
          )
          replace(
              path,
              '            "tls_trusted": True,\n        }\n',
              '            "tls_trusted": True,\n            "probe_kind": "https" if url.lower().startswith("https://") else "http",\n        }\n',
          )
          replace(
              path,
              '            "tls_trusted": False if looks_like_tls_error(error) else None,\n            "error": error,\n        }\n',
              '            "tls_trusted": False if looks_like_tls_error(error) else None,\n            "error": error,\n            "error_kind": (\n                "timeout"\n                if isinstance(exc, (httpx.TimeoutException, TimeoutError))\n                else "tls"\n                if looks_like_tls_error(error)\n                else "transport"\n            ),\n            "probe_kind": "https" if url.lower().startswith("https://") else "http",\n        }\n',
          )
          replace(
              path,
              "async def _probe_public_service(\n    client: httpx.AsyncClient,\n    semaphore: asyncio.Semaphore,\n    service: HomelabService,\n) -> dict[str, Any]:\n    url = service.public_https_probe_url\n",
              "async def _probe_public_service(\n    client: httpx.AsyncClient,\n    semaphore: asyncio.Semaphore,\n    service: HomelabService,\n    declared: DeclaredService | None = None,\n) -> dict[str, Any]:\n    url = public_monitoring_url(service, declared)\n",
          )
          replace(
              path,
              "    if not service.effective_cloudflare_access_required or result.get(\"http_status\") not in _WARNING_HTTP_STATUSES:\n        return result\n",
              "    result[\"probe_kind\"] = \"public_https\"\n    if not service.effective_cloudflare_access_required or result.get(\"http_status\") not in _WARNING_HTTP_STATUSES:\n        return result\n",
          )
          replace(
              path,
              '            "reachable": True,\n            "state": "ok",\n        }\n',
              '            "reachable": True,\n            "state": "ok",\n            "probe_kind": "tcp",\n        }\n',
          )
          replace(
              path,
              '            "reachable": False,\n            "state": "fail",\n            "error": _short_error(exc),\n        }\n',
              '            "reachable": False,\n            "state": "fail",\n            "error": _short_error(exc),\n            "error_kind": "timeout" if isinstance(exc, TimeoutError) else "connect_failed",\n            "probe_kind": "tcp",\n        }\n',
          )
          old_services = '''        services = (\n            list(catalog_services)\n            if catalog_services is not None\n            else await fetch_homelab_services()\n        )\n'''
          new_services = '''        if catalog_services is not None:\n            services = list(catalog_services)\n            declared_catalog = await fetch_declared_service_catalog()\n        else:\n            services, declared_catalog = await asyncio.gather(\n                fetch_homelab_services(),\n                fetch_declared_service_catalog(),\n            )\n        declared_by_id = {\n            item.service_id: item for item in declared_catalog.services\n        }\n'''
          replace(path, old_services, new_services)
          replace(
              path,
              "                        _probe_public_service(client, service_semaphore, service),\n",
              "                        _probe_public_service(\n                            client,\n                            service_semaphore,\n                            service,\n                            declared_by_id.get(service.service_id),\n                        ),\n",
          )

          path = "nabla/api/homelab_runtime.py"
          replace(
              path,
              "    state: str | None = None\n\n\nclass ObservedApp",
              "    state: str | None = None\n    health: str | None = None\n\n\nclass ObservedApp",
          )
          helper_anchor = "\ndef _observed_app(raw: dict[str, Any]) -> ObservedApp:\n"
          helper = '''\ndef _container_health(raw: dict[str, Any]) -> str | None:\n    \"\"\"Return Docker health when TrueNAS exposes it; otherwise keep it unknown.\"\"\"\n    value = raw.get("health_status")\n    if value is None:\n        value = raw.get("health")\n    if isinstance(value, dict):\n        value = value.get("status") or value.get("state")\n    return str(value) if value is not None else None\n\n'''
          replace(path, helper_anchor, helper + helper_anchor)
          replace(
              path,
              '            state=(str(container.get("state")) if container.get("state") is not None else None),\n',
              '            state=(str(container.get("state")) if container.get("state") is not None else None),\n            health=_container_health(container),\n',
          )

          path = "nabla/api/homelab_health_evidence.py"
          replace(
              path,
              "    direct_by_url = {normalized: result for result in public_results if (normalized := _normalized_url(str(result.get(\"url\") or \"\"))) is not None}\n",
              "    direct_by_id = {str(result.get(\"id\")): result for result in public_results if result.get(\"id\")}\n    direct_by_url = {normalized: result for result in public_results if (normalized := _normalized_url(str(result.get(\"url\") or \"\"))) is not None}\n",
          )
          replace(
              path,
              "        direct_result = direct_by_url.get(url) if url is not None else None\n",
              "        direct_result = direct_by_id.get(service.service_id)\n        if direct_result is None and url is not None:\n            direct_result = direct_by_url.get(url)\n",
          )
          replace(
              path,
              "        app = _runtime_app_for_service(service, runtime, binding)\n        runtime_health =",
              "        app = _runtime_app_for_service(service, runtime, binding)\n        runtime_containers: list[dict[str, Any]] = []\n        if app is not None:\n            containers = app.containers\n            if binding is not None and binding.container_service:\n                matching = [\n                    container\n                    for container in containers\n                    if (container.service_name or \"\").casefold()\n                    == binding.container_service.casefold()\n                ]\n                if matching:\n                    containers = matching\n            runtime_containers = [\n                container.model_dump(exclude_none=True) for container in containers\n            ]\n        runtime_health =",
          )
          replace(
              path,
              '        if service.health_note:\n            row["health_note"] = service.health_note\n',
              '        if direct_result is not None:\n            row["direct_probe_kind"] = direct_result.get("probe_kind")\n            row["direct_probe_error_kind"] = direct_result.get("error_kind")\n            row["direct_probe_url"] = direct_result.get("url")\n        if internal_result is not None:\n            row["internal_probe_kind"] = internal_result.get("probe_kind")\n            row["internal_probe_error_kind"] = internal_result.get("error_kind")\n        if runtime_containers:\n            row["runtime_containers"] = runtime_containers\n        if service.health_note:\n            row["health_note"] = service.health_note\n',
          )
          replace(
              path,
              '            for key in ("latency_ms", "error", "application_error"):\n                if key in direct_result:\n                    row[key] = direct_result[key]\n',
              '            for key in (\n                "latency_ms",\n                "error",\n                "error_kind",\n                "application_error",\n                "probe_kind",\n                "public_probe_auth_mode",\n            ):\n                if key in direct_result:\n                    row[key] = direct_result[key]\n            for key, value in direct_result.items():\n                if key.startswith("cloudflare_"):\n                    row[key] = value\n',
          )

          path = "nabla/api/assets/api-health-dependency.js"
          replace(path, '  "direct_probe_refresh_error",\n', '  "direct_probe_refresh_error",\n  "direct_probe_kind",\n  "direct_probe_error_kind",\n  "direct_probe_url",\n')
          replace(path, '  "internal_probe_refresh_error",\n', '  "internal_probe_refresh_error",\n  "internal_probe_kind",\n  "internal_probe_error_kind",\n')
          replace(path, '  "runtime_app",\n', '  "runtime_app",\n  "runtime_containers",\n  "runtime_stale",\n')
          replace(
              path,
              '  "tunnel_name",\n];\n',
              '  "tunnel_name",\n  "tunnel_stale",\n  "tls_trusted",\n  "http_status",\n  "probe_kind",\n  "error_kind",\n  "public_probe_auth_mode",\n  "cloudflare_service_auth_attempted",\n  "cloudflare_service_token_access_passed",\n  "cloudflare_service_token_http_status",\n  "cloudflare_service_token_error_kind",\n];\n',
          )
          PY

          cat > tests/unit/test_homelab_monitoring.py <<'PY'
          from nabla.api.homelab_declared import DeclaredService
          from nabla.api.homelab_models import HomelabService
          from nabla.api.homelab_monitoring import public_monitoring_url


          def test_public_monitoring_url_reuses_canonical_path_and_query() -> None:
              service = HomelabService(
                  name="Language Tool",
                  tunnelUrl="https://languagetool.albandrieu.com",
                  tunnelSecure=True,
                  external=True,
              )
              declared = DeclaredService(
                  id="languagetool",
                  name="LanguageTool",
                  kind="language-service",
                  category="productivity",
                  sourcePath="apps/languagetool/compose.yml",
                  composeService="languagetool",
                  monitoring={
                      "type": "http",
                      "target": "http://172.17.0.24:8010/v2/check?language=en-US&text=healthcheck",
                  },
              )
              assert public_monitoring_url(service, declared) == (
                  "https://languagetool.albandrieu.com/v2/check?language=en-US&text=healthcheck"
              )


          def test_public_monitoring_url_falls_back_to_public_root_without_contract() -> None:
              service = HomelabService(
                  name="Example",
                  tunnelUrl="https://example.albandrieu.com",
                  tunnelSecure=True,
                  external=True,
              )
              assert public_monitoring_url(service, None) == "https://example.albandrieu.com/"
          PY

          cat > tests/unit/test_runtime_container_evidence.py <<'PY'
          from nabla.api.homelab_declared import RuntimeBinding
          from nabla.api.homelab_health_evidence import build_reconciled_service_health
          from nabla.api.homelab_models import HomelabService
          from nabla.api.homelab_runtime import TrueNASRuntimeSnapshot, _observed_app


          def test_truenas_container_state_and_health_are_preserved() -> None:
              app = _observed_app(
                  {
                      "id": "languagetool",
                      "name": "languagetool",
                      "state": "RUNNING",
                      "active_workloads": {
                          "container_details": [
                              {
                                  "service_name": "languagetool",
                                  "state": "running",
                                  "health": {"status": "healthy"},
                              }
                          ]
                      },
                  }
              )
              assert app.containers[0].state == "running"
              assert app.containers[0].health == "healthy"

              service = HomelabService(name="Language Tool", external=False)
              rows = build_reconciled_service_health(
                  [service],
                  public_results=[],
                  internal_results=[],
                  runtime=TrueNASRuntimeSnapshot(
                      observed_at="2026-09-10T17:00:00Z",
                      configured=True,
                      reachable=True,
                      apps=[app],
                  ),
                  tunnels=[],
                  runtime_bindings={
                      service.service_id: RuntimeBinding(
                          provider="truenas-app",
                          appId="languagetool",
                          containerService="languagetool",
                      )
                  },
              )
              assert rows[0]["runtime_state"] == "RUNNING"
              assert rows[0]["runtime_containers"] == [
                  {
                      "service_name": "languagetool",
                      "state": "running",
                      "health": "healthy",
                  }
              ]
          PY
      - name: Format and test backend changes
        run: |
          uv sync --frozen
          uv pip install pre-commit==4.6.2
          uv run pre-commit run --files \
            nabla/api/homelab_declared.py \
            nabla/api/homelab_health.py \
            nabla/api/homelab_health_evidence.py \
            nabla/api/homelab_monitoring.py \
            nabla/api/homelab_runtime.py \
            nabla/api/assets/api-health-dependency.js \
            tests/unit/test_homelab_monitoring.py \
            tests/unit/test_runtime_container_evidence.py || true
          uv run pytest -q \
            tests/unit/test_homelab_monitoring.py \
            tests/unit/test_runtime_container_evidence.py \
            tests/unit/test_homelab_health.py \
            tests/unit/test_homelab_health_evidence.py
      - name: Remove temporary workflow and commit
        run: |
          git rm .github/workflows/tmp-functional-probe-backend.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix(health): use canonical functional probe evidence"
          git push