name: Semantic Release

# The one-time 1.4.1 recovery completed successfully. From this baseline onward,
# releases follow the normal Conventional Commit semantic-release flow and the
# historical 1.4.0 tag remains immutable.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: semantic-release-master
  cancel-in-progress: false

jobs:
  release:
    name: Version, changelog and GitHub release
    runs-on: ubuntu-latest
    env:
      RELEASE_APP_CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create dedicated release App token
        id: release_app_token
        if: env.RELEASE_APP_CLIENT_ID != '' && env.RELEASE_APP_PRIVATE_KEY != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ env.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ env.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install semantic-release dependencies
        run: npm ci --ignore-scripts

      - name: Verify versions before release
        run: python scripts/check_versions.py

      - name: Verify published release baseline
        env:
          GH_TOKEN: ${{ steps.release_app_token.outputs.token || secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          LATEST_RELEASE_TAG="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')"
          python scripts/check_release_baseline.py "${LATEST_RELEASE_TAG}"

      - name: Run semantic-release
        id: semantic_release
        env:
          GITHUB_TOKEN: ${{ steps.release_app_token.outputs.token || secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ steps.release_app_token.outputs.token || secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          BEFORE_HEAD="$(git rev-parse HEAD)"

          # Let git use gh as its credential helper only for the release step.
          gh auth setup-git
          npx semantic-release

          AFTER_HEAD="$(git rev-parse HEAD)"
          if [[ "${AFTER_HEAD}" == "${BEFORE_HEAD}" ]]; then
            echo "published=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          RELEASE_TAG="$(git tag --points-at "${AFTER_HEAD}" --sort=-version:refname | head -n 1)"
          if [[ -z "${RELEASE_TAG}" ]]; then
            echo "semantic-release changed HEAD but no release tag points at it" >&2
            exit 1
          fi

          gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null
          echo "published=true" >> "${GITHUB_OUTPUT}"
          echo "tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${RELEASE_TAG#v}" >> "${GITHUB_OUTPUT}"

      - name: Verify synchronized release files
        if: steps.semantic_release.outputs.published == 'true'
        run: python scripts/check_versions.py

      # repository_dispatch is explicitly supported for workflow chaining and
      # provides one deterministic trigger for package publication and deploy.
      - name: Trigger package publishing and production deployment
        if: steps.semantic_release.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ steps.release_app_token.outputs.token || secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.semantic_release.outputs.tag }}
        shell: bash
        run: |
          jq -n --arg tag "${RELEASE_TAG}" \
            '{event_type:"semantic-release-published",client_payload:{tag:$tag}}' \
            | gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" --input -
