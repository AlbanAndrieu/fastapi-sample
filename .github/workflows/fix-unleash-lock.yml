name: Fix Unleash runtime dependency

on:
  push:
    branches:
      - fix/logfire-fastapi-cloud

permissions:
  contents: write

jobs:
  update-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/logfire-fastapi-cloud
      - uses: astral-sh/setup-uv@v6
      - name: Promote UnleashClient to runtime dependencies
        run: uv add 'UnleashClient>=6.3.0'
      - name: Remove temporary workflow and commit lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-unleash-lock.yml
          git add pyproject.toml uv.lock
          git commit -m 'fix(deps): install UnleashClient in FastAPI Cloud runtime'
          git push origin HEAD:fix/logfire-fastapi-cloud
