name: PR238 convergence normalization

on:
  push:
    branches:
      - fix/production-gate-ui-operator

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Normalize convergence input
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/pr238-rebase-check.yml')
          text = path.read_text()
          marker = '          python -m pip install --disable-pip-version-check ruff==0.16.3\n'
          replacement = "          sed -i 's/×/x/g' tests/unit/test_probe_fanout_dashboard_ui_contract.py\n" + marker
          if replacement not in text:
              if marker not in text:
                  raise SystemExit('normalization marker not found')
              path.write_text(text.replace(marker, replacement, 1))
          PY
          git config user.name "AlbanAndrieu"
          git config user.email "alban.andrieu@free.fr"
          git add .github/workflows/pr238-rebase-check.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(ci): normalize PR238 convergence input"
          git push origin HEAD:fix/production-gate-ui-operator
