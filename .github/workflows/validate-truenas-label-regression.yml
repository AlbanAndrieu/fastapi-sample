---
name: Validate TrueNAS label regression

on:
  push:
    branches:
      - fix/truenas-https-label-regression
    paths:
      - .github/workflows/validate-truenas-label-regression.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      OAUTH_TOKEN_SECRET: mocked-oauth-token-secret
      KEYCLOAK_SERVER_URL: http://localhost:8080
      KEYCLOAK_REALM: test
      KEYCLOAK_CLIENT_ID: test
      KEYCLOAK_CLIENT_SECRET: test-secret
      METRICS_ENABLED: "false"
      LOGFIRE_ENABLED: "false"
      LOGFIRE_TOKEN: ""
      SENTRY_ENABLED: "false"
      SENTRY_DSN: ""
      DATADOG_ENABLED: "false"
      UNLEASH_ENABLED: "false"
      STATSIG_ENABLED: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Align stale TrueNAS health label assertion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/unit/test_homelab_health.py")
          text = path.read_text(encoding="utf-8")
          old = '''    assert rows[0][:3] == (\n        "albandrieu_truenas",\n        "https://truenas.albandrieu.com:7000/",\n        "TrueNAS",\n    )'''
          new = '''    assert rows[0][:3] == (\n        "albandrieu_truenas",\n        "https://truenas.albandrieu.com:7000/",\n        "TrueNAS HTTPS",\n    )'''
          if old not in text:
              raise SystemExit("Expected stale TrueNAS assertion not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.13"
          version: "0.12.1"

      - name: Run focused regression test
        run: |
          uv sync --frozen
          uv run pytest -q tests/unit/test_homelab_health.py::test_global_health_rows_always_include_truenas

      - name: Commit regression fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/test_homelab_health.py
          git commit -m "test(health): expect TrueNAS HTTPS label"
          git push origin HEAD
