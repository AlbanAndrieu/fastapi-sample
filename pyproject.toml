[tool.uv]
# Use copy when cache and project live on different volumes (Docker, NFS, some CI); avoids
# "Failed to hardlink files; falling back to full copy" noise and extra work retrying hardlinks.
link-mode = "copy"
default-groups = [
    "base",
    "api",
    "api-cli",
    "ai",
    "cpu",
    "db",
    "deployment",
    "utils",
    "encryption",
    "open_telemetry",
    "panda",
    "dev",
]
# conflicts = [
#   [
#     { extra = "numpy-1" },
#     { extra = "numpy-2" },
#   ],
#   [
#     { extra = "cpu" },
#     { extra = "cu128" },
#   ],
# ]
no-build-isolation-package = ["flash-attn"]

[[tool.uv.dependency-metadata]]
name = "flash-attn"
version = "1.0.0"
requires-dist = ["torch", "einops"]

[[tool.uv.index]]
name = "gitlab-ds"
# poetry config http-basic.gitlab-ds __token__ ${GITLAB_FULL_PRIVATE_TOKEN}
# export POETRY_GITLAB_TOKEN_GITLAB=${GITLAB_FULL_PRIVATE_TOKEN}
url = "https://gitlab.com/api/v4/groups/7364654/-/packages/pypi/simple"
explicit = true

[[tool.uv.index]]
name = "pytorch-gpu"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.build-backend]
module-name = ["nabla"]
module-root = ""

[tool.uv.sources]
truenas-api-client = { git = "https://github.com/truenas/api_client.git", rev = "TS-26.0.0-BETA.1" }

[tool.pytest.ini_options]
testpaths = "tests/"

[tool.sqlfluff.core]
templater = "jinja"
sql_file_exts = ".sql,.sql.j2,.dml,.ddl"

[tool.sqlfluff.indentation]
indented_joins = false
indented_using_on = true
template_blocks_indent = false

[tool.sqlfluff.templater]
unwrap_wrapped_queries = true

[tool.sqlfluff.templater.jinja]
apply_dbt_builtins = true

# For rule specific configuration, use dots between the names exactly
# as you would in .sqlfluff. In the background, SQLFluff will unpack the
# configuration paths accordingly.
[tool.sqlfluff.rules.capitalisation.keywords]
capitalisation_policy = "upper"

[tool.bandit]
skips = ["B101", "B311"]

[tool.black]
line-length = 88
target-version = ["py313"]
include = "/(tests|nabla)"

[tool.pyright]
include = ["nabla"]
exclude = ["**/node_modules",
    "**/__pycache__",
    "nabla/experimental",
    "nabla/typestubs"
]
venvPath = "."
venv = ".venv"

reportMissingImports = "error"
reportMissingTypeStubs = false

pythonVersion = "3.13"
pythonPlatform = "Linux"

[tool.ruff]
# Enable the pycodestyle (`E`) and Pyflakes (`F`) rules by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
lint.select = ["E", "F"]
lint.ignore = ["E501", "E203", "RUF012"]

# Allow autofix for all enabled rules (when `--fix`) is provided.
lint.fixable = ["ALL"]
lint.unfixable = []
lint.per-file-ignores = {}

# Allow unused variables when underscore-prefixed.
lint.dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

# Same as Black.
line-length = 88

# Assume Python 3.13
target-version = "py313"

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
line_length = 88

[tool.coverage.run]
branch = true
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*site-packages*",
    "*__init__.py",
]

[tool.mypy]
show_error_codes = true
warn_unreachable = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
# Disabling incremental mode is required for `warn_unused_configs = true` to work
incremental = false
disallow_untyped_defs = true
check_untyped_defs = true
strict_equality = true
implicit_reexport = false
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pdm]
[[tool.pdm.source]]
name = "pypi"
url = "https://pypi.org/simple"
verify_ssl = true

[tool.versioneer]
VCS = "git"
style = "pep440"
versionfile_source = "nabla/_version.py"
versionfile_build = "nabla/_version.py"
tag_prefix = "prod-"
parentdir_prefix = ""

# [tool.hatch.metadata.hooks.datadog-build-metadata]
#
# [tool.hatch.metadata.hooks.datadog-build-metadata.urls]
# Homepage = "https://gitlab.com/AlbanAndrieu/fastapi-sample"
# source_archive = "{remote_http_url}/archive/{commit_hash}.tar.gz"

[tool.hatch.build.targets.wheel]
packages = ["nabla"]

[tool.hatch.version]
source = "versioningit"

[tool.versioningit]
default-version = "1.5.2"

[tool.commitizen]
# name = "cz_customize"
version = "1.5.2"
version_files = [
    "nabla/__version__.py",
    "nabla/__init__.py",
    "setup.py",
]
update_changelog_on_bump = true

[tool.commitizen.customize]
message_template = "{{change_type}}:{% if show_message %} {{message}}{% endif %}"
example = "feature: this feature enable customize through config file"
schema = "<type>: <body>"
schema_pattern = "(build|bump|chore|ci|docs|feat|feature|fix|perf|refactor|revert|style|test):(\\s.*)"
bump_pattern = "^(break|new|fix|hotfix)"
bump_map = {"break" = "MAJOR", "new" = "MINOR", "fix" = "PATCH", "hotfix" = "PATCH"}
change_type_order = ["BREAKING CHANGE", "feat", "fix", "refactor", "perf"]
info_path = "cz_customize_info.txt"
info = """
This is customized info
"""
commit_parser = "^(?P<change_type>feat|fix):\\s(?P<message>.*)?"
changelog_pattern = "^(feature|fix)?(!)?"
change_type_map = {"feature" = "Feat", "fix" = "Fix"}

[[tool.commitizen.customize.questions]]
type = "list"
name = "change_type"
choices = [{value = "feature", name = "feature: A new feature."}, {value = "fix", name = "bug fix: A bug fix."}]
# choices = ["feature", "fix"]  # short version
message = "Select the type of change you are committing"

[[tool.commitizen.customize.questions]]
type = "input"
name = "message"
message = "Body."

[[tool.commitizen.customize.questions]]
type = "confirm"
name = "show_message"
message = "Do you want to add body message in commit?"

# [tool.vercel.scripts]
# build = "python build.py"

[tool.fastapi]
entrypoint = "nabla.main:app"

[tool.codespell]
# Ref: https://github.com/codespell-project/codespell#using-a-config-file
skip = '.git*,*.svg,*.lock'
check-hidden = true
ignore-words-list = 'asend,sav'
