[build-system]
# requires = ["setuptools>=61.0"]
# build-backend = "setuptools.build_meta"
requires = ["hatchling", "versioningit", "setuptools>=61.0", "versioneer[toml]==0.29", "packaging>=24.2"]
build-backend = "hatchling.build"
# requires = ["poetry-core"]
# build-backend = "poetry.core.masonry.api"

[project]
name = "fastapi-sample"
version = "1.2.4"
# dynamic = ["version"]
# dynamic = [
#   "urls",
# ]
description = "Fastapi sample"
authors = [
    {name = "Alban Andrieu", email = "alban.andrieu@free.fr"},
]
maintainers = [
  { name = "Alban Andrieu", email = "alban.andrieu@free.fr" }
]
dependencies = ["dynamic"]
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]

# Keywords (translated to tags on the package index)
keywords = ["packaging", "poetry" ,"fastapi-samples"]

classifiers = [
  "Private :: Do not Upload"
]

[project.urls]
"Homepage" = "https://gitlab.com/jusmundi-group/proof-of-concept/fastapi-sample"

[project.optional-dependencies]
toml = ["tomli; python_version < '3.11'"]

#[virtualenvs]
#in-project = true

