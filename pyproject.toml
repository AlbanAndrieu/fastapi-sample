
[project]
name = "fastapi-sample"
version = "1.1.0"
description = "Fastapi sample"
authors = [
    {name = "Andrieu, Alban", email = "alban.andrieu@free.fr"},
]
dependencies = ["dynamic"]
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}

#[virtualenvs]
#in-project = true


[tool.poetry]
name = "fastapi-sample"
version = "1.1.0"
description = "Custom hooks to improve code quality before pushing to git"
authors = ["Andrieu, Alban <alban.andrieu@free.fr>"]
license = "MIT"
homepage = "https://gitlab.com/jusmundi-group/proof-of-concept/fastapi-sample"
readme = "README.md"
classifiers = [
    "Private :: Do not Upload"
]

packages = [
  { include = "nabla" }
]

[[tool.poetry.source]]
name = "gitlab"
# poetry config http-basic.gitlab __token__ ${GITLAB_FULL_PRIVATE_TOKEN}
# export POETRY_GITLAB_TOKEN_GITLAB=${GITLAB_FULL_PRIVATE_TOKEN}
