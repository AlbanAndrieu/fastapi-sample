nox = ">=2023.4.22"
tox = ">=3.27.1"

[tool.poetry.group.format]
optional = true
[tool.poetry.group.format.dependencies]
black = {version = ">=23.9.1", extras = ["d"]}
flake8 = ">=6.1.0"
flake8-formatter-junit-xml = ">=0.0.6"
pylint = ">=2.15.6"
pylint-junit = ">=0.3.2"
ruff = ">=0.5.1"

[tool.poetry.group.ci]
optional = true
[tool.poetry.group.ci.dependencies]
# autopep8 = "~=2.0.0"
bandit = ">=1.8.3"
checkov = ">=3.2.372"
#selenium = "~=4.6.0"
semgrep = ">=1.15.0"
sphinx = ">=7.1.2"
twine = ">=4.0.2"
cyclonedx-bom = ">=4.5.0"

# [tool.poetry.group.aws]
# optional = true
# [tool.poetry.group.aws.dependencies]
# awscli = ">=1.32.11"
# awscli-plugin-endpoint = ">=0.4"

# [tool.poetry.dev-dependencies]
[tool.poetry.group.extra]
optional = true
[tool.poetry.group.extra.dependencies]
ansible-core = ">=2.16.8"
# ansible-cmdb = "~=1.31"
# ansible-lint = {extras = ["yamllint"], version = "~=6.17.2"}
# ansible-navigator = ">=1.1.0"
# ansible-runner = ">=2.2.1"
# ansible-builder = ">=1.1.0"
# ansible-playbook-grapher = ">=1.1.0"
click-completion = "~=0.5.2"
colorama = ">=0.4.6"
httpx = {version = ">=0.23.3"}
git-url-parse = ">=1.2.2"
gitpython = ">=3.1.29"
numpy = ">=1.19.3,<2" # conflict possible with jm-multilabel-evaluator, TODO >=2.2.3
pre-commit = ">=3.7.1" # 4.0.1
pre-commit-hooks = ">=4.4.0"
pip-upgrader = ">=1.4.15"
python-keystoneclient = ">=0.0.18"
readme-renderer = {version = ">=43.0", extras = ["md"]}
sqlfluff = ">=3.1.0"
setup-cfg-fmt = ">=2.2.0"
setuptools = ">=70.0.0"
termcolor = ">=1.1.0" # >=2.4.0
wheel = ">=0.42.0"

[tool.setuptools-pipfile]

#[tool]
#setuptools-pipfile = "src/Pipfile"

[tool.pytest.ini_options]
testpaths = "tests/"

[tool.sqlfluff.core]
templater = "jinja"
sql_file_exts = ".sql,.sql.j2,.dml,.ddl"

[tool.sqlfluff.indentation]
indented_joins = false
indented_using_on = true
template_blocks_indent = false

[tool.sqlfluff.templater]
unwrap_wrapped_queries = true

[tool.sqlfluff.templater.jinja]
apply_dbt_builtins = true

# For rule specific configuration, use dots between the names exactly
# as you would in .sqlfluff. In the background, SQLFluff will unpack the
# configuration paths accordingly.
[tool.sqlfluff.rules.capitalisation.keywords]
capitalisation_policy = "upper"

[tool.bandit]
skips = ["B101", "B311"]

[tool.black]
line-length = 88
target-version = ["py310", "py311"]
include = "/(tests|nabla)"

[tool.ruff]
# Enable the pycodestyle (`E`) and Pyflakes (`F`) rules by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = ["E", "F"]
ignore = []

# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]
per-file-ignores = {}

# Same as Black.
line-length = 88

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# Assume Python 3.12.3
target-version = "py312"

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
line_length = 88

[tool.coverage.run]
branch = true
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*site-packages*",
    "*__init__.py",
]

[tool.pdm]
[[tool.pdm.source]]
name = "pypi"
url = "https://pypi.org/simple"
verify_ssl = true

[build-system]
requires = ["poetry-core>=1.2.0"]
build-backend = "poetry.core.masonry.api"
