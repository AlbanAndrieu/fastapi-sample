# Private Talos/TrueNAS staging overlay. No Ingress or public exposure.
# Use a reviewed immutable image digest and create the Secret out-of-band.
apiVersion: v1
kind: Namespace
metadata:
  name: fastapi-sample
  labels:
    app.kubernetes.io/part-of: fastapi-sample
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fastapi-sample-runtime
  namespace: fastapi-sample
data:
  FASTAPI_RUNTIME_MODE: "homelab"
  HOMELAB_INTERNAL_PROBES_ENABLED: "true"
  SICKZ_INTERNAL_NETWORK: "true"
  HOMELAB_TRUSTED_CIDRS: "82.66.4.247/32"
  OPS_ROUTE_POLICY_STRICT: "false"
  WEB_CONCURRENCY: "1"
  DATADOG_ENABLED: "false"
  DD_TRACE_ENABLED: "false"
  SENTRY_ENABLED: "false"
  LOGFIRE_ENABLED: "false"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-sample
  namespace: fastapi-sample
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: fastapi-sample
  template:
    metadata:
      labels:
        app: fastapi-sample
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # Replace with a verified build digest before deploying.
          image: ghcr.io/albanandrieu/fastapi-sample@sha256:REPLACE_WITH_VERIFIED_IMAGE_DIGEST
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: fastapi-sample-runtime
            - secretRef:
                name: fastapi-sample-runtime-secrets
                optional: true
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false # Gunicorn/third-party libs not yet verified on read-only rootfs
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: fastapi-sample
  namespace: fastapi-sample
spec:
  type: ClusterIP
  selector:
    app: fastapi-sample
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# Default private ingress: no cross-namespace access until explicitly authorized.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fastapi-sample-private-ingress
  namespace: fastapi-sample
spec:
  podSelector:
    matchLabels:
      app: fastapi-sample
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8080
