<!-- templates/base.html -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Sensor Dashboard{% endblock %}</title>

    <!-- HTMX Core -->
    <script src="https://unpkg.com/htmx.org@1.9.10/dist/htmx.min.js"></script>

    <!-- HTMX SSE Extension - Fixed version -->
    <script src="https://unpkg.com/htmx.org@1.9.10/dist/ext/sse.js"></script>

    <!-- DaisyUI + Tailwind -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.6.0/dist/full.min.css" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
      /* Align with /api landing: pure black canvas, system UI fonts */
      :root {
        --dash-bg: #000000;
        --dash-surface: #111111;
        --dash-surface-elevated: #0a0a0a;
        --dash-border: #333333;
        --dash-border-hover: #555555;
        --dash-text: #ffffff;
        --dash-muted: #888888;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        background-color: var(--dash-bg);
        color: var(--dash-text);
        line-height: 1.6;
      }

      .plotly-chart {
        background: transparent !important;
      }

      .plotly-chart .modebar,
      .plotly-chart .modebar-container {
        background: transparent !important;
      }

      .dash-panel {
        background-color: var(--dash-surface);
        border: 1px solid var(--dash-border);
        border-radius: 8px;
      }

      .dash-input {
        width: 100%;
        max-width: 24rem;
        background-color: var(--dash-surface-elevated);
        border: 1px solid var(--dash-border);
        border-radius: 6px;
        color: var(--dash-text);
        padding: 0.5rem 0.75rem;
      }

      .dash-input::placeholder {
        color: var(--dash-muted);
      }

      .dash-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.5rem 1rem;
        border-radius: 6px;
        font-size: 0.875rem;
        font-weight: 500;
        background-color: #222222;
        border: 1px solid var(--dash-border);
        color: var(--dash-text);
        transition:
          background-color 0.2s ease,
          border-color 0.2s ease;
      }

      .dash-btn:hover {
        background-color: #333333;
        border-color: var(--dash-border-hover);
      }

      .note-item {
        border: 1px solid var(--dash-border);
        padding: 1rem;
        margin-bottom: 1rem;
        border-radius: 8px;
        background-color: var(--dash-surface-elevated);
      }

      .note-item.done {
        opacity: 0.55;
        text-decoration: line-through;
        color: var(--dash-muted);
      }

      .note-actions button {
        margin-right: 0.5rem;
      }

      .note-actions .dash-btn {
        margin-top: 0.25rem;
      }

      .dash-alert {
        display: flex;
        align-items: flex-start;
        gap: 0.75rem;
        border-radius: 8px;
        border: 1px solid var(--dash-border);
        padding: 1rem;
        background-color: var(--dash-surface-elevated);
        color: var(--dash-text);
      }

      .dash-alert--warn {
        border-color: #854d0e;
        background-color: #1a1408;
        color: #fde68a;
      }

      .dash-alert--err {
        border-color: #7f1d1d;
        background-color: #1a0a0a;
        color: #fecaca;
      }

      .dash-loading-ok {
        color: #10b981 !important;
      }

      .dash-loading-err {
        color: #ef4444 !important;
      }
    </style>

    {% if DEBUG %}
    <!-- Hot reload for development -->
    <script>
      new EventSource("/hot-reload").onmessage = () => location.reload();
    </script>
    {% endif %}
  </head>

  <body class="min-h-screen overflow-y-auto antialiased">
    {% block content %}{% endblock %}
  </body>
</html>
