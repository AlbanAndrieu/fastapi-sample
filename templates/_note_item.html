<!doctype html>
<div id="note-{{ note.id }}" class="note-item {% if note.completed %}done{% endif %}">
  <h2 class="text-lg font-semibold text-white">{{ note.title }} {% if note.completed %}✔{% endif %}</h2>
  <p class="mt-1 text-sm text-[#888888]">{{ note.description }}</p>
  <div class="note-actions">
    <button class="dash-btn" hx-post="/notes/{{ note.id }}/toggle" hx-target="#note-{{ note.id }}" hx-swap="outerHTML">
      Toggle
    </button>
    <button class="dash-btn" hx-get="/notes/{{ note.id }}/edit" hx-target="#note-{{ note.id }}" hx-swap="outerHTML">
      Edit
    </button>
    <button class="dash-btn" hx-post="/notes/{{ note.id }}/delete" hx-target="#notes-list" hx-swap="outerHTML">
      Delete
    </button>
  </div>
</div>
