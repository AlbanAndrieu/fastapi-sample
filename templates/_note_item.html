<!doctype html>
<div id="note-{{ note.id }}" class="note-item {% if note.done %}done{% endif %}">
  <h2 class="text-lg font-semibold text-white">{{ note.title }} {% if note.completed %}✔{% endif %}</h2>
  <p class="mt-1 text-sm text-[#888888]">{{ note.content }}</p>
  <div class="note-actions">
    <button
      class="dash-btn"
      hx-post="/notes/notes/{{ note.id }}/toggle"
      hx-target="#note-{{ note.id }}"
      hx-swap="outerHTML"
    >
      Toggle
    </button>
    <button
      class="dash-btn"
      hx-get="/notes/notes/{{ note.id }}/edit"
      hx-target="#note-{{ note.id }}"
      hx-swap="outerHTML"
    >
      Edit
    </button>
    <button class="dash-btn" hx-post="/notes/notes/{{ note.id }}/delete" hx-target="#notes-list" hx-swap="outerHTML">
      Delete
    </button>
  </div>
</div>
