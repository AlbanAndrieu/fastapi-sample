---
# Default values for service.
clusterName: "helm-sample"
nodeGroup: "master"

replicaCount: 1
secret_from_vault:
  enabled: false
  mount: "infrastructure"

sopsSecrets:
  enabled: false
  keys:
    - DD_API_KEY
    - POSTGRES_DRIVER
    - POSTGRES_USER
    - POSTGRES_HOST
    - POSTGRES_PORT
    - POSTGRES_DB
    - POSTGRES_PASSWORD
    - SUPABASE_POOLER_REGION
    - SUPABASE_URL
    - SUPABASE_SERVICE_ROLE_KEY
    - SUPABASE_KEY
    - SUPABASE_PASSWORD
    - SUPABASE_DATABASE_URL
    - SUPABASE_TOKEN
    - SUPABASE_PROJECT_ID
    - KEYCLOAK_CLIENT_SECRET
    - OPENAI_API_KEY
    - OVH_APPLICATION_KEY
    - OVH_APPLICATION_SECRET
    - OVH_CONSUMER_KEY
    - OAUTH_TOKEN_SECRET
    - UNLEASH_API_URL
    - UNLEASH_INSTANCE_ID
    - UNLEASH_APP_NAME
    - UNLEASH_API_TOKEN
    - MAIL_PASSWORD
    - STATSIG_API_KEY
    - VERCEL_OIDC_TOKEN
  data: {}

global:
  imagePullPolicy: IfNotPresent
  registry:

image:
  repository: registry.gitlab.com/AlbanAndrieu/fastapi-sample
  pullPolicy: IfNotPresent
  tag: 1.2.3

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Default application security contract. The chart is designed to render under
# Kubernetes Pod Security Standards Restricted. Namespace PSA labels should be
# provisioned before Helm by the platform/GitOps layer; see
# examples/namespace-restricted.yaml.
podSecurityStandards:
  enforceRestricted: true
  namespace:
    enforce: restricted
    audit: restricted
    warn: restricted
    version: latest

serviceAccount:
  create: true
  # Security-first default: applications do not receive Kubernetes API
  # credentials unless an explicit workload requirement is reviewed.
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

pdb:
  enabled: true
  maxUnavailable: 1

pod:
  automountServiceAccountToken: false
  enableServiceLinks: false
  hostNetwork: false
  hostPID: false
  hostIPC: false

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  privileged: false
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

sidecarShell:
  enabled: false

volumeMounts:
  - name: tmp
    mountPath: /tmp

# Internal-only exposure by default. External exposure must be an explicit
# environment decision through Ingress or Gateway API.
service:
  type: ClusterIP
  port: 80
  containerPort: 8080

ingress:
  enabled: false
  className: ""
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: sample.us.lexsportiva.tech
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - secretName: sample-tls
      hosts:
        - sample.us.lexsportiva.tech

httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
    - name: gateway
      sectionName: http
      namespace: infrastructure
  hostnames:
    - chart-example.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /headers

resources:
  limits:
    cpu: 200m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /health
    port: http
readinessProbe:
  httpGet:
    path: /health
    port: http

autoscaling:
  enabled: false
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 65
  customMetrics: []
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
        - type: Pods
          value: 2
          periodSeconds: 60
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max

volumes:
  - name: tmp
    emptyDir:
      sizeLimit: 256Mi

# When enabled with the empty ingress/egress arrays below this is a true
# default-deny policy. Define the required DNS, ingress-controller,
# observability, database/API and other flows before enabling it. Keep disabled
# until the target CNI is proven to enforce NetworkPolicy.
networkPolicy:
  enabled: false
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress: []

nodeSelector: {}
tolerations: []
affinity: {}

mysql:
  enabled: false

tags:
  front-end: false
  back-end: true

env_vars:
  FASTAPI_ENV: "development"
  DD_URL: "http://defectdojo.service.gra.uat.consul"
  DD_PRODUCT_TYPE_NAME: "Showcase Alban"
  DD_PRODUCT_NAME: "fastapi-sample"
  DD_SERVICE: "fastapi-sample"
  DD_ENV: "uat"
  DD_ENGAGEMENT_NAME: "Albandrieu"
  DD_TEST_NAME: "Trivy"
  DD_TEST_TYPE_NAME: "Trivy Scan"
  DD_FILE_NAME: "trivy.json"
  DD_SSL_VERIFY: "false"
  DD_LOGS_INJECTION: "true"
  DD_TRACE_ENABLED: "false"
  DD_TRACE_SAMPLE_RATE: "1"
  DD_PROFILING_ENABLED: "false"
  DD_APPSEC_ENABLED: "false"
  DD_IAST_ENABLED: "true"
  DD_APPSEC_SCA_ENABLED: "false"
  OTEL_SDK_DISABLED: "true"
  POSTGRES_DRIVER: "postgresql"
  POSTGRES_USER: "fastapisample"
  POSTGRES_HOST: "pg-gra.service.gra.uat.consul"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "fastapi_sample_uat"
  OVH_PROJECT_NAME: "2844848994573234"
  KEYCLOAK_SERVER_URL: "https://keycloak-https.service.gra.uat.consul"
  KEYCLOAK_REALM: "jus_mundi"
  KEYCLOAK_CLIENT_ID: "nabla_uat"
  UNLEASH_API_URL: "https://gitlab.com/api/v4/feature_flags/unleash/46788175"
  UNLEASH_APP_NAME: "fastapi-sample"
  UNLEASH_REFRESH_INTERVAL: "60"
  UNLEASH_METRICS_INTERVAL: "90"
  UNLEASH_REQUEST_TIMEOUT: "45"
  UNLEASH_REQUEST_RETRIES: "4"
  UNLEASH_SSL_VERIFY: "true"
  METRICS_ENABLED: "true"
  FASTMCP_EXPERIMENTAL_ENABLE_NEW_OPENAPI_PARSER: "true"
