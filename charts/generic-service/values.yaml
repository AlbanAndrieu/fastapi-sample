---
# Default values for service.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
clusterName: "helm-sample"
nodeGroup: "master"

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1
secret_from_vault:
  enabled: false
  mount: "infrastructure"

# SOPS-decrypted secrets (e.g. from secrets-enc.yaml).
# Use with: helm secrets upgrade -f values.yaml -f secrets-enc.yaml ...
# Decrypted file may be flat (keys at root); list those key names here so they
# are included in the created Secret. Leave empty if using sopsSecrets.data instead.
sopsSecrets:
  enabled: false
  # Keys to pull from top-level values when using decrypted secrets-enc.yaml as -f
  keys:
    - DD_API_KEY
    - DB_URL
    - POSTGRES_PASSWORD
    - KEYCLOAK_CLIENT_SECRET
    - OPENAI_API_KEY
    - OVH_APPLICATION_KEY
    - OVH_APPLICATION_SECRET
    - OVH_CONSUMER_KEY
    - OVH_PASSWORD
    - OAUTH_TOKEN_SECRET
    - UNLEASH_API_URL
    - UNLEASH_INSTANCE_ID
    - UNLEASH_APP_NAME
    - UNLEASH_API_TOKEN
    - MAIL_PASSWORD
    - STATSIG_API_KEY
    - VERCEL_OIDC_TOKEN
  # Alternatively, pass secret key-value map here (e.g. from a wrapper values file)
  data: {}

global:
  # See https://kubernetes.io/fr/docs/concepts/containers/images/
  imagePullPolicy: IfNotPresent
  registry:

#This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  # repository: registry.gitlab.com/jusmundi-group/proof-of-concept/fastapi-sample
  repository: 783876277037.dkr.ecr.eu-west-3.amazonaws.com/fastapi-sample
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # imagePullPolicy: Always
  # tag: latest
  tag: 1.2.3
  # tag: "{{ default .Chart.AppVersion latest }}"

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

# PodDisruptionBudget: limit voluntary disruptions (evictions, node drain) so at least
# (replicas - maxUnavailable) or minAvailable pods stay up. Use exactly one of minAvailable or maxUnavailable.
pdb:
  enabled: true
  # minAvailable: 2   # optional: ensure at least N pods (use this OR maxUnavailable)
  maxUnavailable: 1   # allow at most 1 pod down during maintenance

podSecurityContext:
  {}
  # fsGroup: 2000

securityContext:
  {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  # type: ClusterIP
  type: NodePort
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 80

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: true
  className: ""
  annotations:
    {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: helm-sample.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# -- Expose the service via gateway-api HTTPRoute
# Requires Gateway API resources and suitable controller installed within the cluster
# (see: https://gateway-api.sigs.k8s.io/guides/)
httpRoute:
  # HTTPRoute enabled.
  enabled: false
  # HTTPRoute annotations.
  annotations: {}
  # Which Gateways this Route is attached to.
  parentRefs:
    - name: gateway
      sectionName: http
      # namespace: default
      namespace: infrastructure
  # Hostnames matching HTTP header.
  hostnames:
    - chart-example.local
  # List of rules and filters applied.
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /headers
  #   filters:
  #   - type: RequestHeaderModifier
  #     requestHeaderModifier:
  #       set:
  #       - name: My-Overwrite-Header
  #         value: this-is-the-only-value
  #       remove:
  #       - User-Agent
  # - matches:
  #   - path:
  #       type: PathPrefix
  #       value: /echo
  #     headers:
  #     - name: version
  #       value: v2

resources:
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  limits:
    cpu: 200m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
livenessProbe:
  httpGet:
    path: /health
    port: http
readinessProbe:
  httpGet:
    path: /health
    port: http

# This section is for setting up autoscaling (HPA v2).
# See: https://kubernetes.io/docs/concepts/workloads/autoscaling/
# Tactic: sane baseline with 60-70% CPU (burst headroom), scale down slowly / scale up fast.
autoscaling:
  enabled: false
  # Min replicas: use at least 3 for HA when autoscaling is on; max must fit cluster capacity.
  minReplicas: 3
  maxReplicas: 10
  # 60-70% leaves burst headroom; avoid thrashing on spiky traffic.
  targetCPUUtilizationPercentage: 65
  # targetMemoryUtilizationPercentage: 80

  # Custom metrics (Pods type). Requires metrics-server + Prometheus Adapter so the
  # metric is available as a pods metric. Metric name must match the app (fastapi_inflight_requests).
  customMetrics: []
  # Example: scale when avg inflight requests per pod exceeds 10
  # customMetrics:
  #   - type: Pods
  #     pods:
  #       metric:
  #         name: fastapi_inflight_requests
  #       target:
  #         type: AverageValue
  #         averageValue: "10"

  # HPA v2 behavior: scale down slowly (avoid thrash), scale up fast.
  # Omit or set to {} to use cluster defaults. selectPolicy: Max = use largest allowed change; Min = smallest.
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
        - type: Pods
          value: 2
          periodSeconds: 60
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

mysql:
  enabled: false

tags:
  front-end: false
  back-end: true

