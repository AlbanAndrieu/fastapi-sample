{{- if .Values.podSecurityStandards.enforceRestricted }}
{{- if not .Values.podSecurityContext.runAsNonRoot }}{{ fail "PSS Restricted: podSecurityContext.runAsNonRoot must be true" }}{{ end }}
{{- if ne .Values.podSecurityContext.seccompProfile.type "RuntimeDefault" }}{{ fail "PSS Restricted: pod seccompProfile.type must be RuntimeDefault" }}{{ end }}
{{- if .Values.securityContext.privileged }}{{ fail "PSS Restricted: privileged containers are forbidden" }}{{ end }}
{{- if .Values.securityContext.allowPrivilegeEscalation }}{{ fail "PSS Restricted: allowPrivilegeEscalation must be false" }}{{ end }}
{{- if not .Values.securityContext.runAsNonRoot }}{{ fail "PSS Restricted: container runAsNonRoot must be true" }}{{ end }}
{{- if not (has "ALL" .Values.securityContext.capabilities.drop) }}{{ fail "PSS Restricted: capabilities.drop must contain ALL" }}{{ end }}
{{- if .Values.pod.hostNetwork }}{{ fail "PSS Restricted: hostNetwork must be false" }}{{ end }}
{{- if .Values.pod.hostPID }}{{ fail "PSS Restricted: hostPID must be false" }}{{ end }}
{{- if .Values.pod.hostIPC }}{{ fail "PSS Restricted: hostIPC must be false" }}{{ end }}
{{- if .Values.pod.automountServiceAccountToken }}{{ fail "Security-first contract: Pod ServiceAccount token automount must be false by default" }}{{ end }}
{{- if .Values.serviceAccount.automount }}{{ fail "Security-first contract: ServiceAccount token automount must be false by default" }}{{ end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "service.fullname" . }}
  labels:
    environment: dev
    app.kubernetes.io/name: "{{ template "service.name" . }}"
    helm.sh/chart: "{{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}"
    app.kubernetes.io/managed-by: "{{ .Release.Service  }}"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
    app.kubernetes.io/version: "{{ .Chart.Version | replace "+" "_" }}"
    app.kubernetes.io/component: sample
    app.kubernetes.io/part-of: test
    app: "{{ template "service.name" . }}"
    chart: "{{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}"
    heritage: "{{ .Release.Service  }}"
    release: "{{ .Release.Name }}"
    {{- include "service.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "service.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- include "service.selectorLabels" . | nindent 8 }}
        app: {{ template "service.name" . }}
        chart: {{ template "service.chart" . }}
        tier: frontend
        track: canary
    spec:
      automountServiceAccountToken: {{ .Values.pod.automountServiceAccountToken }}
      enableServiceLinks: {{ .Values.pod.enableServiceLinks }}
      hostNetwork: {{ .Values.pod.hostNetwork }}
      hostPID: {{ .Values.pod.hostPID }}
      hostIPC: {{ .Values.pod.hostIPC }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "service.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- if hasKey .Values "command" }}
          command: {{ .Values.command }}
          {{- end}}
          {{- if and (hasKey .Values "command") (hasKey .Values "args") }}
          args:
          {{- range .Values.args }}
            - "{{ . }}"
          {{- end}}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: TITLE
              value: "Welcome to (EKS)"
          image: "{{ .Values.global.registry }}{{ .Values.image.repository }}:{{ default .Values.image.tag .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          terminationMessagePath: "/tmp/my-log"
          terminationMessagePolicy: FallbackToLogsOnError
          ports:
            - name: http
              containerPort: {{ .Values.service.containerPort }}
              protocol: TCP
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-cm
            {{- if .Values.secret_from_vault.enabled }}
            - secretRef:
                name: {{ .Release.Name }}-secret
            {{- end }}
            {{- if .Values.sopsSecrets.enabled }}
            - secretRef:
                name: {{ .Release.Name }}-sops-secret
            {{- end }}
          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- if .Values.sidecarShell.enabled }}
        - name: shell
          image: busybox:1.36.1-musl
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              cpu: 50m
              memory: 32Mi
            requests:
              cpu: 10m
              memory: 16Mi
          stdin: true
          tty: true
        {{- end }}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
