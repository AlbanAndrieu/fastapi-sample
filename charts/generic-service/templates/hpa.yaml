{{- if .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "service.fullname" . }}
  labels:
    {{- include "service.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "service.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  {{- $behavior := .Values.autoscaling.behavior }}
  {{- if and $behavior (kindIs "map" $behavior) (or (index $behavior "scaleDown") (index $behavior "scaleUp")) }}
  behavior:
    {{- $scaleDown := index $behavior "scaleDown" }}
    {{- if $scaleDown }}
    scaleDown:
      {{- if index $scaleDown "stabilizationWindowSeconds" }}
      stabilizationWindowSeconds: {{ $scaleDown.stabilizationWindowSeconds }}
      {{- end }}
      {{- if index $scaleDown "policies" }}
      policies:
        {{- range $scaleDown.policies }}
        - type: {{ .type }}
          value: {{ .value }}
          periodSeconds: {{ .periodSeconds }}
        {{- end }}
      {{- end }}
      {{- if index $scaleDown "selectPolicy" }}
      selectPolicy: {{ $scaleDown.selectPolicy }}
      {{- end }}
    {{- end }}
    {{- $scaleUp := index $behavior "scaleUp" }}
    {{- if $scaleUp }}
    scaleUp:
      {{- if index $scaleUp "stabilizationWindowSeconds" }}
      stabilizationWindowSeconds: {{ $scaleUp.stabilizationWindowSeconds }}
      {{- end }}
      {{- if index $scaleUp "policies" }}
      policies:
        {{- range $scaleUp.policies }}
        - type: {{ .type }}
          value: {{ .value }}
          periodSeconds: {{ .periodSeconds }}
        {{- end }}
      {{- end }}
      {{- if index $scaleUp "selectPolicy" }}
      selectPolicy: {{ $scaleUp.selectPolicy }}
      {{- end }}
    {{- end }}
  {{- end }}
  metrics:
    {{- if .Values.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if .Values.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
    {{- range .Values.autoscaling.customMetrics }}
    - type: {{ .type }}
      {{- if eq .type "Pods" }}
      pods:
        metric:
          name: {{ .pods.metric.name }}
          {{- if .pods.metric.selector }}
          selector: {{ toYaml .pods.metric.selector | nindent 10 }}
          {{- end }}
        target:
          type: {{ .pods.target.type }}
          {{- if .pods.target.averageValue }}
          averageValue: {{ .pods.target.averageValue }}
          {{- end }}
          {{- if .pods.target.value }}
          value: {{ .pods.target.value }}
          {{- end }}
      {{- end }}
    {{- end }}
{{- end }}
