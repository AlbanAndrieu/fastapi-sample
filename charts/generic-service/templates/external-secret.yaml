{{- if .Values.secret_from_vault.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: "{{ .Release.Name }}-ext-secret"
spec:
  refreshInterval: 5s
  secretStoreRef:
    name: vault-backend-{{ .Values.secret_from_vault.mount }}
    kind: ClusterSecretStore
  target:
    name: "{{ .Release.Name }}-secret"
    creationPolicy: Owner
  #template:
  #  engineVersion: v2
  #  data:
  #    "{{ `{{ .env }}` }}"
  #    
      
  dataFrom:
    - extract:
        key: "{{ .Values.secret_from_vault.mount }}/{{ .Release.Name }}"
{{- end}}
