---
# Default values for testChart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
clusterName: "helm-sample"
nodeGroup: "master"

replicaCount: 1

global:
  # See https://kubernetes.io/fr/docs/concepts/containers/images/
  imagePullPolicy: IfNotPresent
  registry:

image:
  # repository: registry.gitlab.com/jusmundi-group/proof-of-concept/fastapi-sample
  repository: 783876277037.dkr.ecr.eu-west-3.amazonaws.com/fastapi-sample
  imagePullPolicy: IfNotPresent
  # imagePullPolicy: Always
  # tag: latest
  tag: 1.2.3
  # tag: "{{ default .Chart.AppVersion latest }}"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name:

# This is the max unavailable setting for the pod disruption budget
# The default value of 1 will make sure that kubernetes won't allow more than 1
# of your pods to be unavailable during maintenance
maxUnavailable: 1

podSecurityContext:
  {}
  # fsGroup: 2000

securityContext:
  {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  # type: ClusterIP
  type: NodePort
  port: 8080

ingress:
  enabled: true
  annotations:
    {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: helm-sample.local
      paths: ["/"]
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  limits:
    cpu: 100m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}

mysql:
  enabled: false

tags:
  front-end: false
  back-end: true

# additional environment variables for the Neo4j Container
# env: {}
env:
  # - name: BO_API_KEY
  #   valueFrom:
  #     secretKeyRef:
  #       name: conflict-checker-secrets-bo
  #       key: BO_API_KEY
  # - name: NEO4J_AUTH
  #   valueFrom:
  #     secretKeyRef:
  #       name: conflict-checker-neo4j-auth
  #       key: NEO4J_AUTH
  #       optional: false
  - name: FASTAPI_ENV
    value: "development"
  - name: DD_VERSION
    value: "eks"
  - name: DD_URL
    value: "http://defectdojo.service.gra.uat.consul"
  - name: DD_PRODUCT_TYPE_NAME
    value: "Showcase Alban"
  - name: DD_PRODUCT_NAME
    value: "fastapi-sample"
  - name: DD_SERVICE
    value: "test" # fastapi-sample
  - name: DD_ENGAGEMENT_NAME
    value: "Albandrieu"
  - name: DD_TEST_NAME
    value: "Trivy"
  - name: DD_TEST_TYPE_NAME
    value: "Trivy Scan"
  - name: DD_FILE_NAME
    value: "trivy.json"
  - name: DD_SSL_VERIFY
    value: false

  - name: OTEL_SDK_DISABLED
    value: true
  - name: DD_LOGS_INJECTION
    value: true
  - name: DD_TRACE_SAMPLE_RATE
    value: "1"
  - name: DD_PROFILING_ENABLED
    value: true
  - name: DD_APPSEC_ENABLED
    value: false
  - name: DD_IAST_ENABLED
    value: true
  - name: DD_APPSEC_SCA_ENABLED
    value: false

  - name: UNLEASH_API_URL
    value: "https://gitlab.com/api/v4/feature_flags/unleash/46788175"
