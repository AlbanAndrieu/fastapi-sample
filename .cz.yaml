commitizen:
  name: cz_customize
  customize:
    message_template: "{{change_type}}:{% if show_message %} {{message}}{% endif %}"
    example: "feat: this feature enable customize through config file"
    schema: "<type>: <body>"
    schema_pattern: '(build|bump|chore|ci|docs|feat|fix|perf|refactor|revert|style|test):(\\s.*)'
    bump_pattern: "^(break|new|fix|hotfix)"
    commit_parser: '^(?P<change_type>feat|fix):\\s(?P<message>.*)?'
    changelog_pattern: "^(feat|fix)?(!)?"
    change_type_map:
      feat: Feat
      fix: Fix
    bump_map:
      break: MAJOR
      new: MINOR
      fix: PATCH
      hotfix: PATCH
    change_type_order: ["BREAKING CHANGE", "feat", "fix", "refactor", "perf"]
    info_path: cz_customize_info.txt
    info: This is customized info
    questions:
      - type: list
        name: change_type
        choices:
          - value: feat
            name: "feat: A new feature."
          - value: fix
            name: "fix: A bug fix."
        message: Select the type of change you are committing
      - type: input
        name: message
        message: "Body."
      - type: confirm
        name: show_message
        message: "Do you want to add body message in commit?"
