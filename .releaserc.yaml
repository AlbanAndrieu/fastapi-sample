plugins:
  # GitLab support
  - "@semantic-release/gitlab"
  # analyses the Git commits
  - "@semantic-release/commit-analyzer"
  # generates the release note from the Git commit messages
  - "@semantic-release/release-notes-generator"
  # generates the CHANGELOG.md file
  - "@semantic-release/changelog"
  # emulates bumpversion (replaces 'version' in pyproject.toml)
  - - semantic-release-replace-plugin
    - replacements:
        - files:
            - pyproject.toml
          from:
            - '(?<=name = "fastapi-sample"\n)version = "\d+\.\d+\.\d+"'
          to: 'version = "${nextRelease.version}"'
          countMatches: true
        - files:
            - pyproject.toml
          from:
            - '(?<=\[tool.versioningit\]\n)default-version = "\d+\.\d+\.\d+"'
          to: 'default-version = "${nextRelease.version}"'
          countMatches: true
        - files:
            - pyproject.toml
          from:
            - '(?<=\[tool.commitizen\]\n)version = "\d+\.\d+\.\d+"'
          to: 'version = "${nextRelease.version}"'
          countMatches: true
        - files:
            - nabla/_release.py
          from:
            - '__version__ = "\d+\.\d+\.\d+"'
          to: '__version__ = "${nextRelease.version}"'
          countMatches: true
        - files:
            - uv.lock
          from:
            - '(?<=name = "fastapi-sample"\n)version = "\d+\.\d+\.\d+"'
          to: 'version = "${nextRelease.version}"'
          countMatches: true
  # Synchronizes package.json and package-lock.json without publishing npm.
  - - "@semantic-release/npm"
    - npmPublish: false
  # git commit/push modified files
  - - "@semantic-release/git"
    - assets:
        - "CHANGELOG.md"
        - "pyproject.toml"
        - "package.json"
        - "package-lock.json"
        - "nabla/_release.py"
        - "uv.lock"
      # the commit MUST trigger a pipeline on tag (to perform publish jobs)
      # can be skipped on prod branch
      message: "chore(release): ${nextRelease.version} [skip ci on prod]"
branches:
  - main
  # - master
tagFormat: "${version}"
