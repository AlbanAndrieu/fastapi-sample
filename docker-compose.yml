---
# kics-scan ignore
services:
  web:
    build: ./src
    command: uvicorn app.main:app --reload --workers 1 --host 0.0.0.0 --port 8091
    # install requirements.txt

    volumes:
      - ./src/:/usr/src/app/
    ports:
      - "8002:8000"
    environment:
      - DATABASE_URL=postgresql://fastapi-sample:password-reset-XXX@db:5432/fastapi_sample_dev
    depends_on:
      - db
  db:
    image: postgres:16.2-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=fastapisample
      - POSTGRES_PASSWORD=password-reset-XXX
      - POSTGRES_DB=fastapi_sample_dev

    ports:
      - "5432:5432"

  prometheus:
    image: prom/prometheus
    container_name: prom
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus_data/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'


  grafana:
    image: grafana/grafana
    container_name: grafana-1
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana


  datascience-notebook:
    image: registry.gitlab.com/gitlab-data/data-image/analyst-image:v0.0.19
    volumes:
      - type: bind
        source: ${HOME}/
        target: /files
      - type: bind
        source: ${HOME}/.dbt
        target: /usr/local/snowflake_profile/
      - type: bind
        source: ${HOME}/.ssh
        target: /home/albanandrieu/.ssh/
    ports:
      - "8888:8888"
    environment:
      - JUPYTER_ENABLE_LAB=1
    command: start-notebook.sh --NotebookApp.notebook_dir=/files


volumes:
  prometheus_data:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ./prometheus_data
  grafana_data:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ./grafana_data
  postgres_data:

networks:
  default:
    name: fastapi-sample
