min_version = "2024.9.5"

[tools]
# mise.toml is the single source of truth for toolchain versions (no
# .tool-versions). CI reads `node` from here. uv remains the project
# package/runtime manager and the repository targets maintained Python 3.13 for the existing lock.
python = "3.13.17"
node = "24.22.1"
go = "1.25.5"
ruby = "3.4.7"
kube-score = "1.20.0"
ruff = "latest"
just = "latest"
betterleaks = "1.9.0"
shellcheck = "0.11.0"
awscli = { version = "latest", symlink_bins = "true" }
k9s = "latest"
kubectl = "latest"
helm = "latest"
terraform = "latest"
argocd = "latest"
trivy = "latest"
poetry = "latest"
sops = "latest"
# Same uv as CI (setup-uv in python.yml); mise's pypi backend (e.g. a global
# azure-cli) also runs this uv and requires >= 0.12.10.
uv = "0.12.22"
pre-commit = "latest"
docker-compose = "latest"

[settings]
lockfile = true
# Do not fail every mise command when .env.secrets.yaml cannot be decrypted
# (no age key / AWS KMS access on this workstation); secrets are just skipped.
sops.strict = false

[env]
_.file = [".env.secrets", ".env.secrets.yaml", ".env.local"]

ENV = "dev"

# Utiliser le nom du projet dérivé du répertoire courant
PROJECT_NAME = "{{ config_root | basename }}"

# API keys (must be set in environment or mise.local.toml)
# STATSIG_API_KEY = { required = true }
# SENTRY_DSN = { required = true }

# Postgres (must be set in environment or mise.local.toml; no DATABASE_URL / DB_URL)
POSTGRES_HOST = { required = "Set POSTGRES_HOST (e.g. localhost or db service name)" }
POSTGRES_USER = { required = "Set POSTGRES_USER" }
POSTGRES_PASSWORD = { required = "Set POSTGRES_PASSWORD" } #nosec allow:gitleaks
POSTGRES_DB = { required = "Set POSTGRES_DB" }

# Feature flags (must be explicitly configured)
# ENABLE_BETA_FEATURES = { required = true }

AWS_REGION = { required = "Set to your AWS region (e.g. us-east-1, eu-west-1)" }
AWS_PROFILE = "eks"

[tasks.init]
description = "Install the locked environment and Git hooks"
depends = ["install", "hooks"]

[tasks.build]
description = "Build the Python sdist/wheel locally (no deployment)"
run = "uv build"

[tasks.hooks]
description = "Install canonical pre-commit, commit-msg and pre-push Git hooks"
run = '''
pre-commit install --install-hooks --hook-type pre-commit --hook-type commit-msg
pre-commit install --config .pre-commit-pre-push.yaml --install-hooks --hook-type pre-push
'''

[tasks.quality]
description = "Run the canonical local quality gate"
run = "bash scripts/quality-gate.sh"

[tasks.agent-quality]
description = "Run the repo-specific agent-first validation gate"
run = "bash scripts/agent-quality-gate.sh"

[tasks.agent-fix]
description = "Apply/check deterministic local fixes before the strict agent gate"
run = "bash scripts/agent-quality-gate.sh --fix"

[tasks.agent-publish]
description = "Reuse or create the exact local publication proof for this HEAD/base/toolchain"
run = "bash scripts/agent-publish.sh"

[tasks.install]
description = "Install the locked dependencies with uv (pyproject.toml and uv.lock)"
alias = "i"
run = "uv sync --frozen"

[tasks.dev]
description = "Run the FastAPI development server on port 8080"
run = "uv run fastapi dev --port 8080"

[tasks.run]
description = "Run the complete ASGI app (lifespan, MCP, A2A) on port 8080"
run = "uv run uvicorn server_all:app --host 127.0.0.1 --port 8080"

[tasks.test]
description = "Run the test suite with the compact pytest runner"
run = "bash scripts/run-pytest-compact.sh"

[tasks.lint]
description = "Check Python lint without modifying sources"
run = "uv run --no-sync ruff check ."

# FastAPI Cloud deploys independently; GitHub Actions must not deploy this app.

[tasks.info]
description = "Project infos"
run = '''
echo "Project : $PROJECT_NAME"
echo "Virtuel environnment : $VIRTUAL_ENV"
echo "Langfuse PK : $LANGFUSE_PUBLIC_KEY"
'''
