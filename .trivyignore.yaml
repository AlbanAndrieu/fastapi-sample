---
# Time-bounded, dev-only npm CLI vendor residuals; tested by
# tests/unit/test_npm_bundled_vulnerability_guard.py. Do not extend to runtime.
# https://github.com/npm/cli/issues/10299
vulnerabilities:
  - id: CVE-2026-118773
    paths:
      - package-lock.json
    purls:
      - pkg:npm/glob@13.0.6
    expired_at: 2026-12-01
    statement: npm CLI dev-only bundled glob 13.0.6; no vendor fix yet; non-bundled instances required patched
  - id: CVE-2026-118764
    paths:
      - package-lock.json
    purls:
      - pkg:npm/minimatch@10.2.5
    expired_at: 2026-12-01
    statement: npm CLI dev-only bundled minimatch 10.2.5; no vendor fix yet; non-bundled instances required patched

misconfigurations:
  # This project publishes its own image to GitLab Container Registry. Trivy's
  # generic trusted-registry policy does not recognize that project registry.
  - id: KSV-0125
    paths:
      - "charts/generic-service/base/deployment.yaml"
      - "charts/generic-service/templates/deployment.yaml"
    statement: Images intentionally come from the project GitLab registry
  # Current production image declares USER 999:999. Changing only K8s UID/GID
  # breaks file ownership; migration requires a coordinated image rebuild.
  - id: KSV-0020
    paths:
      - "deploy/talos/fastapi-sample.yaml"
    statement: Staging only; runAsNonRoot 999 matches production image owner; migrate to UID over 10000 with image rebuild
  - id: KSV-0021
    paths:
      - "deploy/talos/fastapi-sample.yaml"
    statement: Staging only; group 999 matches production image file ownership; change together with image
  - id: KSV-0125
    paths:
      - "deploy/talos/fastapi-sample.yaml"
    statement: Private Talos staging pins images from this repository owner GHCR; enforce reviewed immutable digest at deployment
  - id: AVD-DS-0002
    statement: The image needs root privileges
  - id: AVD-DS-0026
  # Helm / Kustomize samples: namespace comes from release/kustomize at apply time
  - id: KSV110
    statement: Chart base omits namespace; set via helm -n or kustomize
  # Demo Pod hostAliases for local DNS in example only
  - id: KSV007
    paths:
      - "charts/generic-service/templates/pod.yaml"
    statement: Demo workload only; hostAliases intentional for examples
  # ConfigMap holds non-secret integration metadata (realm name, URLs), not credentials
  - id: AVD-KSV-01010
    paths:
      - "charts/generic-service/templates/configmap.yaml"
    statement: Values are identifiers and endpoints, not secrets; secrets use Vault/ESO

secrets:
  # Trivy v0.71.2's gcp-service-account regex matches the *literal*
  # {"type": "service_account"} in public Anthropic SDK 2.8.0 API docstrings,
  # not a Google service-account key. Exact vendor files only.
  # Review again before 2026-12-22 or when the SDK/Trivy version changes.
  - id: gcp-service-account
    paths:
      - "**/site-packages/anthropic/resources/beta/agents/agents.py"
      - "**/site-packages/anthropic/resources/beta/agents/__pycache__/agents.cpython-313.pyc"
      - "**/site-packages/anthropic/types/beta/agent_create_params.py"
      - "**/site-packages/anthropic/types/beta/agent_update_params.py"
      - "**/site-packages/anthropic/types/beta/beta_managed_agents_agent.py"
      - "**/site-packages/anthropic/types/beta/beta_managed_agents_session_agent.py"
      - "**/site-packages/anthropic/types/beta/beta_managed_agents_session_thread_agent.py"
    expired_at: 2026-12-22
    statement: Anthropic SDK 2.8.0 generated docstrings contain the public service_account type discriminator; Trivy v0.71.2 gcp-service-account regex flags it without credentials
  # FastAPI Users 15.0.5 embeds an expired example JWT (2019-10-19)
  # in BearerTransport's OpenAPI example; the .pyc concatenates string chunks.
  - id: jwt-token
    paths:
      - "**/site-packages/fastapi_users/authentication/transport/__pycache__/bearer.cpython-313.pyc"
    expired_at: 2026-12-22
    statement: fastapi-users 15.0.5 public OpenAPI sample JWT expires 2019-10-19; only the compiled sample constant is ignored

