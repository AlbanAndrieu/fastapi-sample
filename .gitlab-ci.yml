#     - echo -e "\e[35mOverriden on purpose as Sample docker build need explicit \e[0m FOR \e[43m${ENV} - ${DOCKER_BUILD_OPT}.\e[0m"

.build-image-dockefile: &build-image-dockefile
  script:
    - echo -e "\e[35mStarting docker\e[0m FOR \e[43m${ENV}.\e[0m"
    - |
      envsubst < etc/pip.conf > pip.conf || true
      echo -e "\e[35mBuilding with docker build ${DOCKER_BUILD_OPT} -t ${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA} ${DOCKER_BUILD_PATH}\e[0m ."
      docker build ${DOCKER_BUILD_OPT} -t "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}" ${DOCKER_BUILD_PATH}
      echo -e "\e[102mDocker image build succesfull\e[0m .";
    - export TRIVY_OCI="${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}"
    - !reference [.login-registry, script]

docker-build:
  extends: .docker-build

# See https://docs.gitlab.com/user/packages/npm_registry/?tab=%60npm+config%60#publish-a-package-with-a-cicd-pipeline
install-npm:
  extends: .install-npm
  script:
    # - npm config set @scope:registry=git@gitlab.com:api/v4/groups/2454528/-/packages/npm/
    # - npm config set '@nabla-group:registry=git@gitlab.com:api/v4/projects/60435718/packages/npm/'
    # - npm config set '@nabla-group:registry=git@gitlab.com:api/v4/packages/npm/:_authToken='"${CI_JOB_TOKEN}"
    # - echo "@scope:registry=https://${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/npm/" > ~/.npmrc
    - echo "@nabla-group:registry=git@gitlab.com:api/v4/packages/npm/" > ~/.npmrc
    # - echo "//${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/npm/:_authToken=${CI_JOB_TOKEN}" >> ~/.npmrc
    - echo "//${CI_SERVER_HOST}/api/v4/packages/npm/:_authToken=${CI_JOB_TOKEN}" >> ~/.npmrc
    # - rm -rf node_modules package-lock.json
    - |
      if [ -e yarn.lock ]; then
        yarn install --frozen-lockfile
      elif [ -e package-lock.json ]; then
        npm i --cache .npm --prefer-offline --no-audit
      fi
  cache:
    # inherit all global cache settings
    <<: *global_cache
  allow_failure: false

lint-eslint-npm:
  extends: .lint-eslint-npm
  script:
    - npm test --cache .npm
    - npx eslint --format gitlab scripts/**/*.mjs eslint.config.mjs
  allow_failure: false
  cache:
    # inherit all global cache settings
    <<: *global_cache
    # override the policy
    policy: pull
  artifacts:
    reports:
      codequality: gl-codequality.json
    when: on_success # don't attempt to upload the docs if generating them failed

mega_linter:
  extends: .mega_linter_common
  needs: ["test-pytest"]
  allow_failure: false

code_quality:
  extends: .code_quality
  # stage: test
  needs:
    - job: docker-build
    - job: lint-ruff
      optional: true
    - job: type-checker-pyright
      optional: true
  script:
    - |-
      if [[ $CONTAINER_SCANNING_GITLAB_CODEQUALITY_TEMPLATE_DISABLE != "true" ]]; then
        ruff_file="report_ruff.json"
        pyright_file="report_pyright.json"
        if [[ -f "$ruff_file" && -f "$pyright_file" ]]; then
          jq -s 'add' "$ruff_file" "$pyright_file" > gl-codeclimate.json || echo '[]' > gl-codeclimate.json
        elif [[ -f "$ruff_file" ]]; then
          cp "$ruff_file" gl-codeclimate.json
        elif [[ -f "$pyright_file" ]]; then
          cp "$pyright_file" gl-codeclimate.json
        else
          echo "No Ruff or Pyright codequality artifacts; skipping merge."
          echo '[]' > gl-codeclimate.json
        fi
      else
        echo "Disable report_ruff.json report_pyright.json report combine"
        echo '[]' > gl-codeclimate.json
      fi
  artifacts:
    paths:
      - gl-codeclimate.json
    reports:
      codequality: gl-codeclimate.json
    when: on_success

.terrascan:
  image:
    name: tenable/terrascan:1.18.3
    entrypoint: ["/bin/sh", "-c"]
  stage: static
  script:
    - /go/bin/terrascan scan . --skip-rules="AC_AWS_0214,AC_AWS_0148" --severity="high" --config-path ./terrascan.yaml || true
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: never
    - !reference [.default_rules, rules]

train-commit-activated:
  stage: train
  image: $CONTAINER_IMAGE
  tags:
    - saas-linux-medium-amd64-gpu-standard
  script:
    - echo "GPU training activated by commit message"
    - echo "message passed is $CI_COMMIT_MESSAGE"
    - notebookName=$(echo ${CI_COMMIT_MESSAGE/train})
    - echo "Notebook name $notebookName"
    - papermill -p is_local_development False -p tree_method 'gpu_hist' $notebookName -
  rules:
    - if: '$CI_COMMIT_BRANCH == "staging"'
      when: never
    - if: $CI_COMMIT_MESSAGE =~ /\w+\.ipynb/
      when: always
      allow_failure: true
  artifacts:
    paths:
      - ./model_metrics.md
    when: on_success # don't attempt to upload the docs if generating them failed

cml:
  stage: notify
  image: dvcorg/cml-py3:latest
  script:
    - cml-send-comment model_metrics.md
  rules:
    - if: $CI_COMMIT_MESSAGE =~ /\w+\.ipynb/
      when: always
      allow_failure: true

publish-npm:
  image: ${CI_IMAGE_NPM}
  extends: .publish-npm
  needs: ["install-npm"]
  dependencies:
    - install-npm
  variables:
    NPM_TOKEN: "${CI_JOB_TOKEN}"    
  script:
    - |
      set -euo pipefail

      NPM_REGISTRY="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/npm/"

      cat > .npmrc <<EOF
      @${CI_PROJECT_ROOT_NAMESPACE}:registry=${NPM_REGISTRY}
      //${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/npm/:_authToken=${NPM_TOKEN}
      always-auth=true
      EOF

      echo "Created .npmrc:"
      sed 's/_authToken=.*/_authToken=[MASKED]/' .npmrc

    - |
      NPM_PACKAGE_NAME="$(node -p "require('./package.json').name")"
      NPM_PACKAGE_VERSION="$(node -p "require('./package.json').version")"
      EXPECTED_SCOPE="@${CI_PROJECT_ROOT_NAMESPACE}/"

      case "${NPM_PACKAGE_NAME}" in
        "${EXPECTED_SCOPE}"*)
          echo "Valid package scope: ${NPM_PACKAGE_NAME}"
          ;;
        *)
          echo "Invalid package scope: ${NPM_PACKAGE_NAME}"
          echo "Expected: ${EXPECTED_SCOPE}${CI_PROJECT_NAME}"
          exit 1
          ;;
      esac

    - npm pack --dry-run

    - |
      NPM_REGISTRY="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/npm/"
      NPM_PACKAGE_NAME="$(node -p "require('./package.json').name")"
      NPM_PACKAGE_VERSION="$(node -p "require('./package.json').version")"

      if npm view \
        "${NPM_PACKAGE_NAME}@${NPM_PACKAGE_VERSION}" \
        version \
        --registry="${NPM_REGISTRY}" \
        >/dev/null 2>&1; then

        echo "Version ${NPM_PACKAGE_VERSION} is already published."
      else
        if [ -n "${SIGSTORE_ID_TOKEN:-}" ]; then
          npm publish \
            --provenance \
            --registry="${NPM_REGISTRY}"
        else
          npm publish \
            --registry="${NPM_REGISTRY}"
        fi

        echo "Successfully published ${NPM_PACKAGE_NAME}@${NPM_PACKAGE_VERSION}"
      fi

