# ======
# Python Code Checks
# ======

.python-check: &python-check
  stage: test
  image: registry.gitlab.com/gitlab-data/data-image/ci-python-image:v1.0.0
  only:
    changes:
      - "**/*.ipynb"
    refs:
      - merge_requests
  allow_failure: true

.python-black:
  <<: *python-check
  script:
    - black --check .

lint-ruff:
  extends: .lint-ruff
  stage: static
  image: $CI_IMAGE
  interruptible: true
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /^.*(#dev|#uat|#team|#prod).*$/s'
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH  # Make CI NOT run on main branch
      when: never

type-checker-pyright:
  extends: .type-checker-pyright
  stage: static
  image: $CI_IMAGE
  interruptible: true
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /^.*(#dev|#uat|#team|#prod).*$/s'
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH  # Make CI NOT run on main branch
      when: never

test-pytest-poetry:
  extends: .test-pytest-poetry
  needs: ["lint-ruff", "type-checker-pyright"]
  variables:
    DEFAULT_COV_ARGS: "--cov-fail-under=1" # We need to increase the test coverage
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /^.*(#dev|#uat|#team|#prod).*$/s'
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH  # Make CI NOT run on main branch
      when: never

test-pytest:
  extends: .test-pytest
  needs: []
  image: $CI_IMAGE_PYTHON
  interruptible: true
  allow_failure: true
  variables:
    DEFAULT_COV_ARGS: "--no-ddtrace --no-cov" # --cov-fail-under=70
    DEFAULT_PIPENV_ARGS: "--system --dev --ignore-pipfile" # --dev  --verbose --index=https://package_read:${CI_PIP_GITLABJUSMUNDI_TOKEN}@gitlab.com/api/v4/groups/7364654/-/packages/pypi/simple
  # BELOW is needed as we do not use jm-ubuntu but python:3.10
  before_script:
    # - export PIPENV_INSTALL_TIMEOUT=1800 # 900 is 15 minutes
    # - !reference [.install-pip3, script]
    - !reference [.install-pipenv, script]
    - !reference [.pipenv-install, script]

# See https://docs.gitlab.com/user/packages/npm_registry/?tab=%60npm+config%60#publish-a-package-with-a-cicd-pipeline
install-npm:
  extends: .install-npm
  script:
    # - npm config set @scope:registry=https://gitlab.com/api/v4/groups/2454528/-/packages/npm/
    # - npm config set '@jusmundi-group:registry=https://gitlab.com/api/v4/projects/60435718/packages/npm/'
    # - npm config set '@jusmundi-group:registry=https://gitlab.com/api/v4/packages/npm/:_authToken='"${CI_JOB_TOKEN}"
    # - echo "@scope:registry=https://${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/npm/" > ~/.npmrc
    - echo "@jusmundi-group:registry=https://gitlab.com/api/v4/packages/npm/" > ~/.npmrc
    # - echo "//${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/npm/:_authToken=${CI_JOB_TOKEN}" >> ~/.npmrc
    - echo "//${CI_SERVER_HOST}/api/v4/packages/npm/:_authToken=${CI_JOB_TOKEN}" >> ~/.npmrc
    # - rm -rf node_modules package-lock.json
    - |
      if [ -e yarn.lock ]; then
      yarn install --frozen-lockfile
      elif [ -e package-lock.json ]; then
      npm i --cache .npm --prefer-offline --no-audit
      fi
  cache:
    # inherit all global cache settings
    <<: *global_cache
  artifacts:
    paths:
      - node_modules
    expire_in: 6 hours # your GitLab instance will have a default, you can override it like this
    when: on_success # don't attempt to upload the docs if generating them failed
  allow_failure: false

lint-eslin-npmt:
  extends: .lint-eslint-npm
  script:
    - npm test --cache .npm
  allow_failure: false
  cache:
    # inherit all global cache settings
    <<: *global_cache
    # override the policy
    policy: pull

unit-tests-npm:
  extends: .unit-tests-npm
  needs: ["install-npm"]
  dependencies:
    - install-npm
  allow_failure: false
  cache:
    # inherit all global cache settings
    <<: *global_cache
    # override the policy
    policy: pull

