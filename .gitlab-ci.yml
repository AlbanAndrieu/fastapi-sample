---
stages:
  - static
  - test
  - build
  - train
  - deploy
  - notify
  - dast

include:
  - project: jusmundi-group/infrastructure/ci-templates
    ref: feature-dd-onerr
    file: "/templates/default.gitlab-ci.yml"

  - project: jusmundi-group/infrastructure/ci-templates
    ref: feature-dd-onerr
    file: "/templates/docker-build.gitlab-ci.yml"

  - project: jusmundi-group/infrastructure/ci-templates
    ref: feature-dd-onerr
    file: "/templates/deploy-nomad.gitlab-ci.yml"

  - project: jusmundi-group/infrastructure/ci-templates
    ref: feature-dd-onerr
    file: "/templates/test-python.gitlab-ci.yml"

  - project: jusmundi-group/infrastructure/ci-templates
    ref: feature-dd-onerr
    file: "/templates/_apk.gitlab-ci.yml"

  - project: jusmundi-group/infrastructure/ci-templates
    ref: feature-dd-onerr
    file: "/templates/data.gitlab-ci.yml"

  - project: jusmundi-group/infrastructure/ci-templates
    ref: feature-dd-onerr
    file: "/templates/mega-linter.gitlab-ci.yml"

  - template: 'Workflows/MergeRequest-Pipelines.gitlab-ci.yml'

  - template: Jobs/Dependency-Scanning.gitlab-ci.yml
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

  - template: DAST.gitlab-ci.yml

  - template: API-Security.gitlab-ci.yml

  # - project: 'renovate-bot/renovate-runner'
  #   file: '/templates/renovate.gitlab-ci.yml'

  # - remote: https://gitlab.com/renovate-bot/renovate-runner/-/raw/v17.69.3/templates/renovate.gitlab-ci.yml


# See https://docs.gitlab.com/ee/ci/yaml/#workflowauto_cancelon_new_commit
workflow:
  auto_cancel:
    on_new_commit: interruptible
    on_job_failure: all

variables:
  CI_IMAGE_PYTHON: python:3.10
  CI_REGISTRY: registry.gitlab.com
  OCI_REGISTRY: ${CI_REGISTRY}/${CI_PROJECT_NAMESPACE}
  TYPE_TRAINING: ""
  DOCKER_BUILD_OPT: " -f Dockerfile --build-arg CI_PIP_GITLABJUSMUNDI_TOKEN=${CI_PIP_GITLABJUSMUNDI_TOKEN} "
  # MOUNT_POINT: "/builds/$CI_PROJECT_PATH/mnt"
  CONTAINER_IMAGE: "$CI_REGISTRY_IMAGE/main-image:latest"
  DEFAULT_POETRY_OPT_GROUPS: "test,open_telemetry,api,test"
  # REGISTRY: 783876277037.dkr.ecr.eu-west-3.amazonaws.com
  CI_IMAGE_NAME: ${CI_REGISTRY}/jusmundi-group/web/templates/jm-oci/jm-ubuntu
  CI_IMAGE_TAG: latest
  GIT_STRATEGY: clone
  GIT_DEPTH: "3"
  # GIT_CLONE_PATH: '$CI_BUILDS_DIR/$CI_PROJECT_NAME/$CI_PIPELINE_ID'
  # GIT_CLONE_PATH: $CI_BUILDS_DIR/$CI_CONCURRENT_ID/$CI_PROJECT_PATH
  FLAVOR: "-python" # -ci_light
  TRIVY_SCANNERS: "vuln,config,secret"
  DD_PRODUCT_NAME: "$CI_PROJECT_NAME"
  DD_SERVICE: "test"  # fastapi-sample
  DD_PRODUCT_TYPE_NAME: "Showcase Alban" # "Research and Development"
  DD_URL_UAT: "http://defectdojo.service.gra.uat.consul" # 10.30.0.141
  DD_TEST_NAME: "JM Trivy"
  # DD_FILE_NAME: "trivy.json"
  DD_MINIMUM_SEVERITY: "MEDIUM"
  # DD_GROUP_BY: ""
  DD_CLOSE_OLD_FINDINGS: "True"
  DD_CLOSE_OLD_FINDINGS_PRODUCT_SCOPE: "True"
  DD_DO_NOT_REACTIVATE: "False"
  DD_BRANCH_TAG: "${CI_COMMIT_TAG}" # CI_COMMIT_BRANCH CI_IMAGE_TAG
  CLOC_SOURCE: "nabla"
  # RUNNER_GENERATE_ARTIFACTS_METADATA: "true"
  # FF_NETWORK_PER_BUILD: "true" # enable network per build so all services can communicate on the same network
  APP_NAME: fastapi-sample
  # DAST_WEBSITE: https://yourapp
  DAST_WEBSITE: https://fastapi-sample.service.gra.${ENV}.consul
  DAST_FULL_SCAN_ENABLED: "true" # do a full scan
  DAST_BROWSER_SCAN: "true" # use the browser-based GitLab DAST crawler
  NOMAD_SERVICE_DEPLOY_URL_SUFFIX: docs # citemap/ping
  NOMAD_SERVICE_DEPLOY_URL: http://${APP_NAME}.service.gra.${ENV}.consul/${NOMAD_SERVICE_DEPLOY_URL_SUFFIX}
  DEFAULT_POETRY_OPT_GROUPS: "format,test,extras,open_telemetry,deployment,influxdb,panda"


# override the dependency scanning job
gemnasium-dependency_scanning:
  tags: [ saas-linux-large-amd64 ]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_MERGE_REQUEST_IID
  variables:
    DS_REMEDIATE: "false"
  # dependencies: ["build"]

dast:
  # dependencies: []
  services: # use services to link your app container to the dast job
    # - name: mongo:latest
    #   alias: mongo
    - name: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
      alias: fastapi-sample
  allow_failure: true

# Extend the API Security job defined in CI template
# adding a services section with our test target
api_security:
  services:
    - name: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
      alias: fastapi-sample
  variables:
      APISEC_HAR: rest_target_http_archive.v1.2.har
      APISEC_TARGET_URL: http://fastapi-sample:8080
  allow_failure: true

#renovate:
#  rules:
#    - if: '$CI_PIPELINE_SOURCE == "schedule"'
#    - if: '$CI_PIPELINE_SOURCE == "push"'
#  allow_failure: true

spotbugs-sast:
  variables:
    FAIL_NEVER: 1

upload_trivy:uat:
  extends: .upload_trivy:uat

cloc:
  extends: .cloc

upload-cloc:uat:
  extends: .upload-cloc:uat

# ======
# Python Code Checks
# ======

.python-check: &python-check
  stage: test
  image: registry.gitlab.com/gitlab-data/data-image/ci-python-image:v1.0.0
  only:
    changes:
      - "**/*.ipynb"
    refs:
      - merge_requests
  allow_failure: true

.python-black:
  <<: *python-check
  script:
    - black --check .

#lint-flake8:
#  extends: .lint-flake8
#  tags:
#    - jusmundi-nomad-runner
#  variables:
#    DEFAULT_FLAKE8_TARGET: "nabla"
