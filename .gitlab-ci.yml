lint-ruff:
  extends: .lint-ruff
  image: $CI_IMAGE
  # variables:
  #   CI_IMAGE_NAME: ${CI_REGISTRY}/jusmundi-group/web/templates/jm-oci/jm-ubuntu
  #   CI_IMAGE_TAG: latest
  interruptible: true
  allow_failure: true

type-checker-pyright:
  extends: .type-checker-pyright
  image: $CI_IMAGE
  interruptible: true
  allow_failure: true

test-pytest-poetry:
  extends: .test-pytest-poetry
  needs: ["lint-ruff", "type-checker-pyright"]
  variables:
    # DEFAULT_COV_ARGS: "--cov-fail-under=70"
    DEFAULT_COV_ARGS: "--cov-fail-under=1" # We need to increase the test coverage
  allow_failure: true

test-pytest:
  extends: .test-pytest
  tags:
    - jusmundi-nomad-runner
  interruptible: true
  allow_failure: true
  # needs: ["lint-flake8"]
  variables:
    DEFAULT_COV_ARGS: "--cov-fail-under=70"
    DEFAULT_PIPENV_ARGS: "--system --dev --ignore-pipfile" # --dev  --verbose --index=https://package_read:${CI_PIP_GITLABJUSMUNDI_TOKEN}@gitlab.com/api/v4/groups/7364654/-/packages/pypi/simple
  # BELOW is needed as we do not use jm-ubuntu but python:3.10
  before_script:
    # - export PIPENV_INSTALL_TIMEOUT=1800 # 900 is 15 minutes
    # - !reference [.install-pip3, script]
    - !reference [.install-pipenv, script]
    - !reference [.pipenv-install, script]

mega_linter:
  extends: .mega_linter_common
  needs: ["test-pytest"]
  allow_failure: true

# package:
#   extends: .poetry-package

docker-build:
  extends: .docker-build
  tags:
    - jusmundi-nomad-runner
    # - docker # no space left on device
  timeout: 2 hours 10 minutes
  variables:
    CS_SEVERITY_THRESHOLD: "CRITICAL"
    CS_SEVERITY_FILESYTEM_THRESHOLD: "CRITICAL"
    # CUSTOM_CONTAINER_SCANNING_DISABLED: "true"
    # CONTAINER_SCANNING_GITLAB_CODEQUALITY_TEMPLATE_DISABLE: "true"
    TRIVY_TIMEOUT: "20m0s"
    # TRIVY_SCANNERS: "vuln"
    TRIVY_ARGS: "--debug --skip-dirs .direnv --skip-dirs .venv --skip-dirs code/.venv --skip-dirs code/.venv/lib/python3.10/site-packages/ --skip-files /code/fastapi-sample/pyproject.toml --skip-files /code/fastapi-sample/Pipfile --skip-files /code/fastapi-sample/pip.conf --skip-files code/fastapi-sample/Dockerfile.train_neuralcoref"
    # TRIVY_EXIT_ON_FAILURE: 0
    # TRIVY_FILESYTEM_EXIT_ON_FAILURE: 0
  before_script:
    - !reference [.env-definition, script]
    - !reference [.oci-image, script]
    - !reference [.login-gitlab-docker, script]
    - echo -e "\e[35mWe are in directory\e[0m."
    - pwd
    # - echo -e "\e[35mWe have files\e[0m."
    # - ls -lrta
    - !reference [.build-image-dockefile, script]
    - echo -e "\e[35mImage generated\e[0m."
  after_script:
    - !reference [.oci-image, script]
    - !reference [.scan-reports, script]
    - !reference [.combine-reports, script]
    - !reference [.login-gitlab-docker, script]
    # - !reference [.login-ecr, script]
    - !reference [.common-docker-release, script]

code_quality:
  extends: .code_quality
  stage: build
  needs: ["docker-build", "lint-ruff", "type-checker-pyright"]
  dependencies:
    - docker-build
    - lint-ruff
    - type-checker-pyright
  script:
    - |-
      if [[ $CONTAINER_SCANNING_GITLAB_CODEQUALITY_TEMPLATE_DISABLE != "true" ]]; then
        jq -s 'add' report_ruff.json report_pyright.json > gl-codeclimate.json || true;
      else
        echo "Disable report_ruff.json report_pyright.json report combine";
      fi

train-commit-activated:
  stage: train
  image: $CONTAINER_IMAGE
  tags:
    - saas-linux-medium-amd64-gpu-standard
  script:
    - echo "GPU training activated by commit message"
    - echo "message passed is $CI_COMMIT_MESSAGE"
    - notebookName=$(echo ${CI_COMMIT_MESSAGE/train})
    - echo "Notebook name $notebookName"
    - papermill -p is_local_development False -p tree_method 'gpu_hist' $notebookName -
  rules:
    - if: '$CI_COMMIT_BRANCH == "staging"'
      when: never
    - if: $CI_COMMIT_MESSAGE =~ /\w+\.ipynb/
      when: always
      allow_failure: true
  artifacts:
    paths:
      - ./model_metrics.md

cml:
  stage: notify
  image: dvcorg/cml-py3:latest
  script:
    - cml-send-comment model_metrics.md
  rules:
    - if: $CI_COMMIT_MESSAGE =~ /\w+\.ipynb/
      when: always
      allow_failure: true

deploy:dev:
  extends: .deploy:dev
  needs: ["docker-build"]
  tags:
    - jusmundi-nomad-runner

deploy:uat:
  extends: .deploy:uat
  needs: ["docker-build"]
  tags:
    - jusmundi-nomad-runner

deploy:prod:
  extends: .deploy:prod
  #needs: ["docker-build"]
  tags:
    - jusmundi-nomad-runner
