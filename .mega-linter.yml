---
APPLY_FIXES: none
DEFAULT_BRANCH: main
ENABLE_LINTERS:
  - ACTION_ZIZMOR
  - COPYPASTE_JSCPD
  - EDITORCONFIG_EDITORCONFIG_CHECKER
  - HTML_HTMLHINT
  - JAVASCRIPT_ES
  - JAVASCRIPT_PRETTIER
  - JSON_ESLINT_PLUGIN_JSONC
  - JSON_JSONLINT
  - JSON_PRETTIER
  - REPOSITORY_CHECKOV
  - SPELL_CODESPELL
  - TYPESCRIPT_ES
  - TYPESCRIPT_PRETTIER
  - YAML_PRETTIER
  - YAML_YAMLLINT
  - REPOSITORY_SECRETLINT
  - REPOSITORY_BETTERLEAKS
  - REPOSITORY_TRIVY
  - BASH_SHELLCHECK
  - MAKEFILE_CHECKMAKE
  - GIT_GIT_DIFF
  - DOCKERFILE_HADOLINT
  - JUPYTER_JUPYFMT
DISABLE:
  - CLOUDFORMATION
  - MARKDOWN
  - TEKTON
DISABLE_LINTERS:
  - ANSIBLE_ANSIBLE_LINT
  - PYTHON_MYPY
  - PYTHON_ISORT
  - REPOSITORY_DEVSKIM
  - REPOSITORY_DUSTILOCK
  - REPOSITORY_GITLEAKS
  - REPOSITORY_TRIVY_SBOM
  - REPOSITORY_SYFT
  - REPOSITORY_KICS
  - REPOSITORY_GRYPE
  - REPOSITORY_TRUFFLEHOG
  - RST_RSTCHECK
  - TERRAFORM_TERRAGRUNT
  - TERRAFORM_TERRASCAN
  - TERRAFORM_KICS
IGNORE_GITIGNORED_FILES: true
FILTER_REGEX_EXCLUDE: >-
  (megalinter-reports/|\.megalinter_github_conf/|open-webui/|\.automation/test|\.automation/generated|\.venv/|\.direnv/|\.mypy_cache/|docs/javascripts|docs/overrides|docs/json-schemas|flavors|clj-kondo|TEMPLATES|tests|trunk|(^|/)uv\.lock$|(^|/)Pipfile\.lock$|(^|/)trivy-sbom\.json$)
ACTION_ZIZMOR_FILTER_REGEX_EXCLUDE: (^|/)\.github/workflows/linter\.yml$
ACTION_ZIZMOR_UNSECURED_ENV_VARIABLES:
  - GITHUB_TOKEN
JSON_JSONLINT_FILTER_REGEX_EXCLUDE: >-
  ((^|/)(\.vscode|\.devcontainer)/|(^|/)uv\.lock$|(^|/)Pipfile\.lock$|(^|/)trivy-sbom\.json$)
JSON_PRETTIER_FILTER_REGEX_EXCLUDE: >-
  ((^|/)(\.vscode|\.devcontainer)/|(^|/)uv\.lock$|(^|/)Pipfile\.lock$|(^|/)trivy-sbom\.json$)
YAML_YAMLLINT_FILTER_REGEX_EXCLUDE: (templates/\.mega-linter\.yml)
YAML_PRETTIER_FILTER_REGEX_EXCLUDE: (templates/\.mega-linter\.yml|mkdocs\.yml)
BASH_FILTER_REGEX_EXCLUDE: (lib|open-webui/)
MARKDOWN_FILTER_REGEX_EXCLUDE: (license\.md)
MARKDOWN_MARKDOWN_LINK_CHECK_DISABLE_ERRORS: true
SPELL_MISSPELL_FILTER_REGEX_EXCLUDE: (\.automation/generated|docs/descriptors)
DOCKERFILE_HADOLINT_ARGUMENTS: >-
  --ignore DL3003 --ignore DL3007 --ignore DL3013 --ignore DL3016 --ignore DL3018
  --ignore DL3028 --ignore DL4001 --ignore DL4006 --ignore SC2015 --ignore SC2016
  --ignore SC2039 --ignore SC2086 --ignore SC1091
DOCKERFILE_HADOLINT_DISABLE_ERRORS: false
DOCKERFILE_HADOLINT_DISABLE_ERRORS_IF_LESS_THAN: 2
REPOSITORY_TRIVY_ARGUMENTS: >-
  --scanners vuln,misconfig,secret,license --vuln-type os,library --ignore-unfixed
  --ignorefile .trivyignore.yaml --skip-dirs .direnv --skip-dirs .venv
  --skip-dirs code/.venv --skip-dirs megalinter-reports --skip-dirs node_modules
  --skip-dirs vue-client/node_modules --skip-dirs open-webui --skip-files pip.conf
  --skip-files Pipfile --skip-files Pipfile.lock --skip-files uv.lock
  --skip-files trivy-sbom.json --skip-files "*.tgz"
REPOSITORY_TRIVY_DISABLE_ERRORS: true
REPOSITORY_BETTERLEAKS_CONFIG_FILE: .gitleaks.toml
REPOSITORY_BETTERLEAKS_ARGUMENTS: --redact
REPOSITORY_BETTERLEAKS_PR_COMMITS_SCAN: true
REPOSITORY_BETTERLEAKS_DISABLE_ERRORS: false
REPOSITORY_SECRETLINT_DISABLE_ERRORS: false
BASH_SHELLCHECK_ARGUMENTS: -e "SC2162"
BASH_SHELLCHECK_FILTER_REGEX_EXCLUDE: (test\|examples|docs/Makefile|open-webui/)
BASH_SHELLCHECK_DISABLE_ERRORS: false
BASH_SHELLCHECK_DISABLE_ERRORS_IF_LESS_THAN: 7
EXCLUDED_DIRECTORIES:
  - .gitlab-ci
  - node_modules
  - open-webui
  - .venv
  - .direnv
  - .mypy_cache
  - megalinter-reports
  - .megalinter_github_conf
PARALLEL: true
CLEAR_REPORT_FOLDER: true
PRINT_ALPACA: false
FAIL_IF_UPDATED_SOURCES: false
SHOW_ELAPSED_TIME: true
JSON_REPORTER: true
SARIF_REPORTER: true
FILEIO_REPORTER: false
UPDATED_SOURCES_REPORTER: false
VALIDATE_ALL_CODEBASE: true
FLAVOR_SUGGESTIONS: false
SHOW_SKIPPED_LINTERS: false
PLUGINS:
  - https://raw.githubusercontent.com/kpj/jupyfmt/master/mega-linter-plugin-jupyfmt/jupyfmt.megalinter-descriptor.yml
