---
# Local development and production-like smoke stack (replaces docker-compose.yml).
# compose.yml (TrueNAS runtime) takes precedence in this directory, so always
# select this file explicitly with -f (or COMPOSE_FILE=docker-compose.yaml):
#
#   docker compose -f docker-compose.yaml up                  # api + db + redis
#   docker compose -f docker-compose.yaml up api              # dev API + deps
#   docker compose -f docker-compose.yaml up fastapi-sample   # profile "prod"
#   docker compose -f docker-compose.yaml --profile observability up prometheus grafana
#
# A service with a profile starts only when its profile is enabled or when it
# is targeted explicitly. "api" and "fastapi-sample" both publish host port
# 8080 by default: run one or the other, not both.
# Requires Docker Compose >= 2.24 (optional env_file entries).

x-fastapi-build: &fastapi-build
  context: .
  dockerfile: Dockerfile

services:
  # Development API (default). The local env files are optional so that the
  # other services remain usable on a checkout without them.
  api:
    build: *fastapi-build
    tty: true
    container_name: fastapi-sample
    command: uvicorn server_all:app --reload --workers 1 --host 0.0.0.0 --port 8080
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - .:/app
    env_file:
      - path: ./.env.local
        required: false
      - path: ./.env.secrets
        required: false
    environment:
      - PYTHONPATH=.
      - POSTGRES_DRIVER=postgresql
      - POSTGRES_USER=fastapisample
      # secretlint-disable-next-line
      - POSTGRES_PASSWORD=password-reset-XXX # nosec gitleaks:allow local dev default
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=fastapi_sample_dev
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  db:
    image: postgres:16.2-alpine
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=fastapisample
      # secretlint-disable-next-line
      - POSTGRES_PASSWORD=password-reset-XXX # nosec gitleaks:allow local dev default
      - POSTGRES_DB=fastapi_sample_dev
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    image: "redis:alpine"
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Production-like image: FASTAPI_ENV=production, Gunicorn entrypoint from the
  # Dockerfile, no source mount and no local database.
  fastapi-sample:
    profiles: ["prod"]
    image: ${FASTAPI_IMAGE:-fastapi-sample:local}
    build: *fastapi-build
    container_name: fastapi-sample-prod
    ports:
      - "${FASTAPI_PORT:-8080}:8080"
    environment:
      FASTAPI_ENV: ${FASTAPI_ENV:-production}
      TRUENAS_URL: ${TRUENAS_URL:-}
      TRUENAS_API_USERNAME: ${TRUENAS_API_USERNAME:-}
      TRUENAS_API_KEY: ${TRUENAS_API_KEY:-}
      TRUENAS_API_VERIFY_SSL: ${TRUENAS_API_VERIFY_SSL:-true}
    restart: unless-stopped

  # Optional local observability. ./prometheus_data/prometheus.yml and
  # ./grafana_data are not versioned: create them before enabling this profile.
  prometheus:
    profiles: ["observability"]
    image: prom/prometheus
    container_name: prom
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus_data/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"

  grafana:
    profiles: ["observability"]
    image: grafana/grafana
    container_name: grafana-1
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  prometheus_data:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ./prometheus_data
  grafana_data:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ./grafana_data
  postgres_data:

networks:
  default:
    name: fastapi-sample
